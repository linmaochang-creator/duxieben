十頁」的規則，句子是整件事的起點。"}],"title2":"我正在慢慢完成的一件事","hint":"寫一件需要每天累積的事，說明你怎麼開始，並寫出一個最近的小進步。","starters":["我給自己訂了一個小規則……","每天回家的路上，我都……"]},{"title":"圖書館四樓","theme":"閱讀與書","text":["學校圖書館有四層樓，一樓放報紙和雜誌，二樓是小說，三樓是參考書，四樓最安靜，也最少人去。","有一個午休，我抱著書爬上去。樓梯間的玻璃窗被太陽曬得發亮，空氣裡有舊紙張的味道，像曬過太陽的棉被。走到四樓，推開門，整排落地窗忽然把操場、籃球架、遠方的屋頂和更遠處淡淡的山影，一口氣捧到我面前。","王之渙在〈登鸛雀樓〉裡寫過：「欲窮千里目，更上一層樓。」從前背它只是為了考試，現在才曉得，原來「上一層」是真的會看見不一樣的東西。","窗邊的桌子上，陽光斜斜地躺著，一頁書正被風輕輕翻過去。"],"gj":[{"s":"空氣裡有舊紙張的味道，像曬過太陽的棉被","t":"比喻","n":"把看不見的氣味比成棉被，又暖又軟，讓讀者彷彿聞得到。"},{"s":"整排落地窗忽然把操場、籃球架、遠方的屋頂和更遠處淡淡的山影，一口氣捧到我面前","t":"擬人","n":"落地窗像一個獻寶的人，景物由近到遠一一排開，很有層次。"},{"s":"王之渙在〈登鸛雀樓〉裡寫過：「欲窮千里目，更上一層樓。」","t":"引用","n":"先交代作者與篇名，再引原句，並接著說出自己的新體會。"}],"w":[{"w":"落地窗","m":"從地面到天花板的大窗戶"},{"w":"淡淡","m":"顏色或味道不濃的樣子"},{"w":"斜斜地","m":"傾斜的樣子"}],"quiz":[{"q":"作者為什麼覺得「上一層」真的會看見不一樣的東西？","o":["四樓的書比較好看","到了四樓才看到更遠的景色","樓層愈高愈沒有人打擾"],"a":1,"why":"作者走到四樓，才從落地窗看見操場和山影，印證了詩句。"},{"q":"「落地窗忽然把……一口氣捧到我面前」使用了什麼修辭？","o":["誇飾","排比","擬人"],"a":2,"why":"把窗戶寫成會「捧」東西的人，是擬人。"}],"title2":"我最喜歡的一個角落","hint":"寫學校或家裡你最愛待的地方，先寫看到什麼，最後寫一個安靜的小動作。","starters":["午休鐘聲一響，我就走向……","那個角落有一扇窗……"]},{"title":"舊書店阿伯","theme":"閱讀與書","text":["學校後巷有一家舊書店，招牌掉了漆，門口堆著三個紙箱，寫著「任選十元」。老闆是一位頭髮灰白的阿伯，總穿一件洗得褪色的背心，坐在藤椅上，手裡永遠有一本書。","我第一次進去，問他有沒有適合國中生的書，他頭也沒抬，伸手往後方的架子一抓，抽出一本邊角捲起來的短篇小說集：「這本，不錯。」他的手指又粗又黑，翻書的時候卻輕得像在撥一隻蝴蝶的翅膀。","後來我才知道，他連每本書是哪一年印的、哪裡有摺角，都記得清清楚楚。蘇軾說：「腹有詩書氣自華。」阿伯不一定讀過多少詩，但他站在滿牆的書前，背影就是有一種說不出的從容。","上星期我又去，他正用抹布擦一本舊字典的封面，擦完，放回架上，順手把書背對齊。"],"gj":[{"s":"翻書的時候卻輕得像在撥一隻蝴蝶的翅膀","t":"比喻","n":"粗黑的手和蝴蝶的翅膀形成反差，寫出阿伯對書的珍惜。"},{"s":"他頭也沒抬，伸手往後方的架子一抓","t":"動作描寫","n":"幾個動作就寫出阿伯對書店了如指掌，不必多說一個字。"},{"s":"蘇軾說：「腹有詩書氣自華。」","t":"引用","n":"借古人的話形容長年與書為伴的氣質，再接上自己的觀察。"}],"w":[{"w":"褪色","m":"顏色變淡"},{"w":"灰白","m":"介於灰色與白色之間"},{"w":"從容","m":"不慌不忙、態度鎮定"}],"quiz":[{"q":"面對「有沒有適合國中生的書」，阿伯怎麼回應？","o":["沒抬頭就直接抽出一本推薦","請作者自己慢慢找","說店裡沒有這類的書"],"a":0,"why":"文中寫他頭也沒抬，伸手一抓就抽出一本。"},{"q":"作者引用蘇軾的句子，是為了形容什麼？","o":["阿伯寫詩很有名","阿伯因為常年與書為伴而流露的氣質","店裡的詩集特別多"],"a":1,"why":"作者接著說阿伯背影有一種從容，可知是用來形容他的氣質。"}],"title2":"一位讓我印象深刻的店家","hint":"寫你熟悉的一位店家，抓住他的一個習慣動作，並寫出他說的一句話。","starters":["我常去的那家店，老闆總是……","第一次走進那家店，我看見……"]},{"title":"一本書的身體","theme":"閱讀與書","text":["杜甫說：「讀書破萬卷，下筆如有神。」書讀得多了，下筆自然順暢。可是你有沒有想過，一本書本身，也像人一樣，有各個部位？","先看「封面」，它像人的臉，告訴你書名和作者。翻開來，「目次」像一張地圖，列出每一章在第幾頁，想找哪一篇，順著它就不會迷路。","書的最後常有「索引」，它像一本小小的電話簿，把重要的詞語排好，告訴你在哪幾頁出現。至於「版權頁」，通常藏在書的前面或後面，上面記著出版社、出版的年月和版次，想知道這本書是不是新的，看它就對了。","下次拿起一本書，別急著讀內文。先從封面摸到版權頁，像和一位新朋友握手，再問他：你從哪裡來？"],"gj":[{"s":"杜甫說：「讀書破萬卷，下筆如有神。」","t":"引用","n":"用名句開場，先談讀書的好處，再轉到書本身，銜接自然。"},{"s":"「目次」像一張地圖，列出每一章在第幾頁","t":"比喻","n":"用大家熟悉的地圖來說明目次的功能，很容易懂。"},{"s":"先從封面摸到版權頁，像和一位新朋友握手，再問他：你從哪裡來？","t":"擬人","n":"把書當成新朋友，結尾有動作也有趣味，讓說明文不呆板。"}],"w":[{"w":"目次","m":"書中各篇章的標題與頁碼"},{"w":"索引","m":"把重要詞語排列並標出頁碼的查詢表"},{"w":"出版社","m":"負責印製並發行書籍的機構"}],"quiz":[{"q":"想知道一本書是不是新版本，應該看哪個部分？","o":["封面","目次","版權頁"],"a":2,"why":"文中說版權頁記著出版年月與版次，可用來判斷新舊。"},{"q":"作者主要用什麼方法說明書的各個部分？","o":["用熟悉的事物打比方","列出各種書籍的銷售數字","比較古書與現代書的差異"],"a":0,"why":"封面像臉、目次像地圖、索引像電話簿，全是比方。"}],"title2":"我來介紹一樣東西的各部分","hint":"選一樣你熟悉的東西，像介紹書一樣，用比方說明它的三個部分。","starters":["我的書包有三個部分……","如果把我的教室比成一個人……"]},{"title":"讀書與懷疑","theme":"閱讀與書","text":["孟子說過：「盡信書，不如無書。」意思是，如果對書裡的每一句話都全盤相信，那還不如沒有書。乍看之下，這句話像在勸人別讀書，其實正好相反。","想想看，書是人寫的，人會有疏漏，時代也會變。十年前的書說的方法，現在不一定適用；有些書只寫了事情的一面，另一面要靠其他書來補。讀的時候遇到不明白的地方，停下來問一問「為什麼」，比急著翻下一頁更有收穫。","懷疑，並不是挑毛病。就像買水果，我們會捏一捏、聞一聞，再決定要不要買。書也一樣，多比對幾本、多想幾次，才能真正把它吃進肚子裡。","所以下次翻開書，不妨在旁邊放一枝鉛筆，遇到想不通的句子，輕輕畫一道線。"],"gj":[{"s":"孟子說過：「盡信書，不如無書。」","t":"引用","n":"直接引出全文的核心觀念，並在後面用白話解釋，不會讓讀者卡住。"},{"s":"乍看之下，這句話像在勸人別讀書，其實正好相反","t":"轉折","n":"先說表面印象，再翻到真正的意思，讓論點更有力。"},{"s":"就像買水果，我們會捏一捏、聞一聞，再決定要不要買","t":"類比","n":"用買水果的日常經驗說明讀書要思考，道理一下就懂。"}],"w":[{"w":"疏漏","m":"疏忽遺漏"},{"w":"全盤","m":"全部、整個"},{"w":"比對","m":"互相對照比較"}],"quiz":[{"q":"作者認為「盡信書，不如無書」真正的意思是什麼？","o":["書裡的內容大多是錯的","讀書要經過思考，不要全部照單全收","讀書不如親身經歷"],"a":1,"why":"作者說這句話看似勸人別讀書，其實是提醒要思考與比對。"},{"q":"「就像買水果」這個例子有什麼作用？","o":["說明水果與書一樣便宜","表示作者很喜歡買水果","用日常經驗類比，讓道理更容易懂"],"a":2,"why":"把抽象的「懷疑」比成捏一捏、聞一聞，屬於類比。"}],"title2":"我讀書時的一個疑問","hint":"寫一次你讀書時覺得不對勁的經驗，說明你怎麼處理，結尾用一個動作。","starters":["書上這樣寫，但我覺得……","老師說到這裡，我忍不住舉手……"]},{"title":"書堆與足下","theme":"閱讀與書","text":["老子說：「千里之行，始於足下。」我媽把這句話貼在我的書桌前，意思是叫我從眼前的小事做起。我的足下，現在剛好有一座書山。","這座書山由兩本漫畫、三本參考書、一本從圖書館借了又續借的小說，和一本我一直沒拆封的《成語故事》組成。每次我想走向書桌，都得先翻越它們。","前天晚上，我終於決定整理。我把書一本一本疊成一排，想抽出最底下的那本，一拉，整座山轟然倒塌，砸中我的腳趾。我抱著腳在地上轉圈，才體會到老子說的「始於足下」，果然是很痛的真理。","媽媽聞聲跑來，看了一眼地板，默默把紙條撕下來，換貼了另一張，上面寫著：「先把書放回書架。」"],"gj":[{"s":"老子說：「千里之行，始於足下。」","t":"引用","n":"開頭引用名句，下一句馬上拿來和自己的書堆開玩笑。"},{"s":"一拉，整座山轟然倒塌，砸中我的腳趾","t":"誇飾","n":"把書堆寫成一座山，倒塌的氣勢與腳趾的疼痛形成笑點。"},{"s":"才體會到老子說的「始於足下」，果然是很痛的真理","t":"雙關","n":"「足下」既是出發的地方，也是被砸到的地方，一語雙關。"}],"w":[{"w":"轟然","m":"形容巨大的聲響"},{"w":"拆封","m":"打開封口"},{"w":"翻越","m":"從上面越過"}],"quiz":[{"q":"文中「始於足下」的雙重意思是什麼？","o":["從腳下開始做起，也指書堆砸到了腳","從旅行開始，也指離開家","從鞋子開始整理，也指穿好鞋"],"a":0,"why":"作者既用它指從眼前做起，又指書山倒塌砸中腳趾。"},{"q":"結尾媽媽換貼的紙條想表達什麼？","o":["要作者別再看書","要作者把書放回書架","提醒作者小心腳趾"],"a":1,"why":"紙條上寫著「先把書放回書架」，是媽媽對作者的叮嚀。"}],"title2":"我的桌面（或書包）大災難","hint":"寫一次東西堆太多或找不到的狼狽經驗，用誇張的方式寫出當時的混亂。","starters":["我的書桌上有一座小山……","那天我翻遍整個書包，終於……"]},{"title":"老字典","theme":"閱讀與書","text":["外婆的櫃子最底層，躺著一本厚厚的字典，書皮的邊角磨得發白，書背用透明膠帶纏了一圈又一圈。","小時候，我常看見外婆戴上眼鏡，用手指沿著一行行小字慢慢往下滑，口中輕輕念著：「這個字，是這樣寫的。」她沒有讀過太多書，卻靠著這本字典，把我的名字一筆一畫地教給我。","如今字典安靜地躺在我的書桌上，翻開的第一頁，有一圈淡淡的茶漬。朱熹寫過：「問渠那得清如許，為有源頭活水來。」我望著那圈茶漬想，我心裡那一點點對文字的喜歡，大概就是從這本字典流出來的一條小溪。","窗外有風，書頁沙沙地翻動，彷彿誰又用手指，輕輕往下滑。"],"gj":[{"s":"書背用透明膠帶纏了一圈又一圈","t":"細節描寫","n":"「一圈又一圈」寫出字典被使用很久，也寫出外婆的珍惜。"},{"s":"朱熹寫過：「問渠那得清如許，為有源頭活水來。」","t":"引用","n":"用詩句說明活水有源頭，順勢把外婆比成作者喜歡文字的源頭。"},{"s":"書頁沙沙地翻動，彷彿誰又用手指，輕輕往下滑","t":"以景結情","n":"不直接說想念，而讓風翻書頁，把思念藏在畫面裡。"}],"w":[{"w":"磨得發白","m":"因長久摩擦而顏色變淡"},{"w":"茶漬","m":"茶水留下的痕跡"},{"w":"一筆一畫","m":"寫字時一劃一劃，認真仔細"}],"quiz":[{"q":"引用朱熹詩句中的「源頭活水」，在文中比喻什麼？","o":["家鄉附近的一條小溪","字典裡收錄的字數很多","外婆帶給作者的文字啟蒙"],"a":2,"why":"作者說自己對文字的喜歡，是從這本字典流出來的小溪，源頭是外婆教字。"},{"q":"結尾「彷彿誰又用手指，輕輕往下滑」暗示了什麼？","o":["作者想起外婆教自己認字的情景","窗外的風雨愈來愈大","外婆其實就在房間裡"],"a":0,"why":"手指往下滑正是外婆教字的動作，風吹書頁讓作者想起她。"}],"title2":"一樣有故事的舊東西","hint":"寫一樣家裡的舊物，先寫它的外表，再寫它和某個人的回憶。","starters":["櫃子最底層，放著一個……","那件東西已經很舊了，可是……"]},{"title":"愛心傘","theme":"善意與社會","text":["梅雨季，放學後突然下起大雨。我站在公車站的屋簷下，書包頂在頭上，正盤算要不要衝去對面的便利商店。","這時，我看見站牌旁的欄杆上，掛著一把藍色的大傘，傘柄上綁著一張紙條，寫著：「下雨了，請自取，用完請歸還。」字寫得歪歪的，像是匆匆寫下的。","我猶豫了一會兒，把傘拿下來，傘面有點舊，卻撐得很穩。雨點打在傘上，咚咚咚，像有人在耳邊輕輕敲門。走到巷口，我看見另一個同校的學生淋著雨跑來，便把傘舉高一些：「一起走吧。」","隔天，我把傘擦乾，掛回原來的欄杆。紙條在風裡輕輕動著，傘下的陰影，像一個小小的家。"],"gj":[{"s":"我站在公車站的屋簷下，書包頂在頭上，正盤算要不要衝去對面的便利商店","t":"心理描寫","n":"用動作加上盤算，把淋雨前的猶豫寫得很真實。"},{"s":"雨點打在傘上，咚咚咚，像有人在耳邊輕輕敲門","t":"摹聲","n":"用「咚咚咚」加上敲門的比方，把雨聲寫得溫柔。"},{"s":"傘下的陰影，像一個小小的家","t":"象徵","n":"一把傘遮住的不只是雨，更象徵陌生人之間願意互相庇護的善意。"}],"w":[{"w":"盤算","m":"在心裡計畫或考慮"},{"w":"猶豫","m":"拿不定主意"},{"w":"歸還","m":"把東西還給原主"}],"quiz":[{"q":"作者拿到傘之後做了什麼？","o":["把傘帶回家保管","和另一位淋雨的同學一起撐傘","轉身去便利商店買雨衣"],"a":1,"why":"文中寫他看到同校學生跑來，便舉高傘說「一起走吧」。"},{"q":"文中的傘最可能象徵什麼？","o":["梅雨季令人煩悶的心情","學生肩上沉重的負擔","陌生人之間可以傳遞的善意"],"a":2,"why":"傘被借出、歸還又再借出，象徵善意的接力。"}],"title2":"一次被別人幫助的經驗","hint":"寫一次你受到陌生人或同學幫助的經驗，用一樣小東西當作這份善意的象徵。","starters":["那天，我忘了帶……","有人把一樣東西遞到我面前……"]},{"title":"巷口的路燈","theme":"善意與社會","text":["我家巷口有一盞路燈，燈罩有點髒，光是淡淡的橘黃色。每天傍晚六點多，它會自己醒來，先閃兩下，才穩穩地亮起。","補習班下課的晚上，我騎腳踏車經過，總會看見那圈橘光，像一張被人攤開的毯子，鋪在柏油路上。毯子裡有時躺著幾隻小飛蟲，有時有一隻貓，睜著圓圓的眼睛，看我慢慢騎過。","下雨的夜裡，光裡會多出一絲絲銀白的線，每一條雨都亮了一下才落到地上。賣烤地瓜的老伯在燈下停好推車，爐子裡的火和路燈的光輕輕碰在一起，空氣裡浮起一股甜甜的味道。","我不知道是誰裝了這盞燈，只知道它從不挑人，不管誰走過，它都把腳下的路照亮一點點。我放慢車速，輕輕按了一下車鈴，彷彿是在說：「謝謝你，今天也辛苦了。」"],"gj":[{"s":"像一張被人攤開的毯子，鋪在柏油路上","t":"比喻","n":"把燈光比成毯子，有溫度也有面積，夜路一下子變得柔軟。"},{"s":"爐子裡的火和路燈的光輕輕碰在一起，空氣裡浮起一股甜甜的味道","t":"轉化","n":"光與火像會碰面的人，視覺與嗅覺同時出現，畫面很豐富。"},{"s":"它從不挑人，不管誰走過，它都把腳下的路照亮一點點","t":"托物寄意","n":"藉路燈不挑人、默默照路的樣子，寄託對平凡善意的敬意。"}],"w":[{"w":"柏油路","m":"鋪著瀝青的道路"},{"w":"推車","m":"攤販使用的可推動的車子"},{"w":"淡淡","m":"顏色或味道不濃的樣子"}],"quiz":[{"q":"下雨的夜裡，路燈下出現了什麼景象？","o":["雨絲在光裡亮了一下才落地","路燈被雨打得熄滅","小貓躲進了燈罩"],"a":0,"why":"文中寫「每一條雨都亮了一下才落到地上」。"},{"q":"作者藉路燈想表達什麼？","o":["對補習班生活的抱怨","默默照亮別人、不求回報的善意","夜晚獨自騎車的恐懼"],"a":1,"why":"路燈不挑人、默默照路，正是作者所欣賞的善意。"}],"title2":"一樣默默做事的東西","hint":"選一樣每天默默幫助人的東西，寫出它的樣子，並說明你為什麼感謝它。","starters":["每天經過那個地方，我都會看見……","如果它會說話，我想對它說……"]},{"title":"早餐店阿姨","theme":"善意與社會","text":["學校對面的早餐店，老闆娘我們都叫她阿姨。她綁著藍色圍裙，頭髮盤得高高的，一邊翻鐵板上的蛋餅，一邊還能同時記得八個人的口味。","「少冰、不加蔥、蛋要全熟。」她背出來，不用抄。我有一次忘了帶錢，站在櫃台前臉漲得通紅，阿姨瞄了我一眼，把一杯熱豆漿推過來，說：「先喝，明天再給。」","那杯豆漿的杯壁燙燙的，我雙手捧著，熱氣一直爬到鼻尖。後來我發現，她對很多人都這樣：給趕早班的清潔阿伯多加一顆蛋，給考試前的學生多包一份火腿，卻總是笑著說「剛好多出來的啦」。","隔天我把錢放在櫃台，她還沒收，先替我把吸管插好。早晨的陽光斜斜地照進店裡，豆漿的白煙，一縷一縷地往上爬。"],"gj":[{"s":"一邊翻鐵板上的蛋餅，一邊還能同時記得八個人的口味","t":"細節描寫","n":"用一心多用的動作，寫出阿姨的熟練與用心。"},{"s":"那杯豆漿的杯壁燙燙的，我雙手捧著，熱氣一直爬到鼻尖","t":"托物寄意","n":"燙手的豆漿不只是食物，更寄託了被體諒的溫暖。"},{"s":"卻總是笑著說「剛好多出來的啦」","t":"語言描寫","n":"阿姨輕描淡寫的一句話，把善意說得毫無負擔。"}],"w":[{"w":"圍裙","m":"工作時繫在身前的布"},{"w":"瞄","m":"很快地看一眼"},{"w":"一縷一縷","m":"一條一條細長的樣子"}],"quiz":[{"q":"作者忘了帶錢時，阿姨怎麼做？","o":["請他到旁邊等家人送錢","讓他先把吃的放回去","讓他先喝熱豆漿，明天再給"],"a":2,"why":"文中阿姨說：「先喝，明天再給。」"},{"q":"那杯熱豆漿在文中最適合象徵什麼？","o":["不張揚、不求回報的體貼","早餐店生意很好","學生早上總是肚子餓"],"a":0,"why":"豆漿的熱度與阿姨多送一份的作法，一同象徵暖暖的體貼。"}],"title2":"一次讓我心裡暖起來的小事","hint":"寫一件小事，並選一樣東西（食物、傘、外套都可以）寄託你的感受。","starters":["那天早上，我走進……","他沒有多說什麼，只是遞給我……"]},{"title":"生活中的符號","theme":"善意與社會","text":["走在街上，我們每天都在讀符號。紅燈亮起，大家停下腳步；綠燈一閃，人群便像水一樣流過斑馬線。顏色沒有長腳，卻能叫許多人同時做出同一個動作，這是因為大家有共同的約定。","有些符號是為了安全。救護車和消防車的警示燈與鳴笛，是在告訴路上的人：請讓路。有些符號是為了體貼。捷運與公車上的「博愛座」標誌，提醒大家有人更需要座位；視障朋友手中的白手杖，則是一種無聲的提醒，請留意腳邊，慢一點。","還有一些符號，是人們慢慢累積出來的，像是比出愛心的手勢、微微點頭的致意。它們不用任何一個字，卻比一句話更快地被讀懂。","下次站在路口等綠燈，抬頭看看，一整排人像一排安靜的音符，正等著同一個節拍。"],"gj":[{"s":"人群便像水一樣流過斑馬線","t":"比喻","n":"把行人比成流水，寫出綠燈亮起時順暢而整齊的畫面。"},{"s":"顏色沒有長腳，卻能叫許多人同時做出同一個動作","t":"映襯","n":"「沒有長腳」與「叫許多人」形成對照，點出符號的力量來自共同約定。"},{"s":"視障朋友手中的白手杖，則是一種無聲的提醒","t":"象徵","n":"一根手杖就代表需要被體諒的人，是社會中善意的符號。"}],"w":[{"w":"斑馬線","m":"路面上給行人通行的白色條紋線"},{"w":"鳴笛","m":"發出尖銳的汽笛聲"},{"w":"致意","m":"向人表示敬意或問候"}],"quiz":[{"q":"文中怎樣說明「白手杖」？","o":["是年長者專用的休息工具","是提醒大家留意並體貼視障者的符號","是提醒車輛減速的標誌"],"a":1,"why":"文中說它是一種無聲的提醒，請留意腳邊、慢一點。"},{"q":"這篇文章主要用什麼方式說明生活中的符號？","o":["比較古代與現代符號的差異","列出各國符號的統計","依用途分類並舉例"],"a":2,"why":"文章依安全、體貼、慢慢累積分成幾類，並各自舉例。"}],"title2":"我發現了一個生活中的符號","hint":"寫一個你在學校或街上看過的記號或手勢，說明它代表什麼，以及你的一次經驗。","starters":["我第一次看懂那個標誌是在……","在我們班，大家都懂的暗號是……"]},{"title":"老榕樹","theme":"善意與社會","text":["校門口那棵老榕樹，比學校還老。它的氣根垂下來，像許多條長長的鬍鬚，風一吹，就輕輕地晃。","夏天，它把整條人行道都蓋在影子裡。早上，賣飯糰的阿伯推著車停在樹下；中午，警衛伯伯坐在樹根上，搖著一把蒲扇；放學後，一群人擠在石椅上，吃著剛買的涼麵，誰也不嫌誰擠。","我常想，榕樹什麼都沒做，只是站著，卻讓每一個走過的人，都能在它下面停一停、歇一歇。它不問你是哪一班，也不問你考了幾分。","畢業那天，我繞到樹下，伸手摸摸粗糙的樹幹，上面還留著太陽的餘溫。葉子沙沙地響著，聽起來像一句很輕的再見。"],"gj":[{"s":"它的氣根垂下來，像許多條長長的鬍鬚","t":"比喻","n":"把氣根比成鬍鬚，讓老樹有了慈祥長者的形象。"},{"s":"榕樹什麼都沒做，只是站著，卻讓每一個走過的人，都能在它下面停一停、歇一歇","t":"托物寄意","n":"以榕樹的默默庇蔭，寄託對包容、不計較的善意的讚美。"},{"s":"葉子沙沙地響著，聽起來像一句很輕的再見","t":"以聲結情","n":"用葉聲代替告別的話，結尾留有餘韻。"}],"w":[{"w":"氣根","m":"榕樹等植物從枝幹長出的根"},{"w":"蒲扇","m":"用蒲葵葉做的扇子"},{"w":"餘溫","m":"還沒散盡的溫度"}],"quiz":[{"q":"文中中午在榕樹下搖著蒲扇的是誰？","o":["警衛伯伯","賣飯糰的阿伯","放學的學生"],"a":0,"why":"文中寫「中午，警衛伯伯坐在樹根上，搖著一把蒲扇」。"},{"q":"作者藉榕樹寄託了什麼感情？","o":["對畢業考試的焦慮","對默默庇蔭、不計較他人的善意的敬意","對夏天炎熱的抱怨"],"a":1,"why":"榕樹不問班級、不問分數，只是讓人歇腳，寄託的是這份包容。"}],"title2":"我心中的一棵樹（或一個地方）","hint":"寫一棵樹或一個地方，說明它怎樣陪著你和身邊的人，並以聲音或畫面結尾。","starters":["學校附近有一棵樹……","每次經過那個地方，我都會……"]},{"title":"奉茶","theme":"善意與社會","text":["台灣的鄉間，早年常能在路口、廟埕或樹下，看到一只茶桶，旁邊掛著幾個杯子，上面寫著「奉茶」兩個字。不用付錢，口渴的人自己倒一杯，喝完把杯子放回去，繼續趕路。","這只茶桶，裝的當然是茶，可是它也裝著別的東西。放茶的人也許從來沒見過喝茶的人，卻在炎熱的午後，替一個陌生人想到了口渴這件事。茶水涼了還能再煮，這份心意卻是一代一代傳下來的。","現在街頭有了便利商店與販賣機，奉茶漸漸少見。但我覺得，那只茶桶並沒有消失，它只是換了樣子：公園裡的飲水機、鄰居擺在門口的一桶綠豆湯、考試前志工媽媽遞來的一杯熱茶。","善意不需要很大，一杯水的重量，剛好可以讓人走完下一段路。"],"gj":[{"s":"這只茶桶，裝的當然是茶，可是它也裝著別的東西","t":"托物寄意","n":"由實物轉到心意，用茶桶寄託照顧陌生人的善意。"},{"s":"公園裡的飲水機、鄰居擺在門口的一桶綠豆湯、考試前志工媽媽遞來的一杯熱茶","t":"排比","n":"三個生活例子並列，說明奉茶的精神仍在身邊。"},{"s":"一杯水的重量，剛好可以讓人走完下一段路","t":"映襯","n":"用輕輕的一杯水對照漫長的路，小與大之間顯出善意的力量。"}],"w":[{"w":"廟埕","m":"廟前的空地"},{"w":"茶桶","m":"裝茶水的大桶子"},{"w":"趕路","m":"加快腳步前往目的地"}],"quiz":[{"q":"作者認為奉茶中最珍貴的是什麼？","o":["茶水的品質","茶桶製作的年代","為陌生人設想的心意"],"a":2,"why":"文中說放茶的人替素不相識的陌生人想到口渴，這份心意最可貴。"},{"q":"「那只茶桶並沒有消失，它只是換了樣子」是什麼意思？","o":["奉茶的精神仍以別的形式存在","茶桶被搬到別的地方","作者主張重新設置茶桶"],"a":0,"why":"後文舉飲水機、綠豆湯、熱茶為例，說明善意換了形式繼續流傳。"}],"title2":"我看過的一件小小善意","hint":"寫一件你見過或做過的小善意，並用一樣物品當作它的象徵。","starters":["很多人沒有發現，但我看見……","那天放學，我在路口看到……"]},{"title":"失物招領箱","theme":"善意與社會","text":["學務處門口有一個紙箱，貼著「失物招領」四個大字。我懷疑那個箱子有個無底洞，因為我每次去找東西，都會看到一些無法解釋的寶貝：只有一隻的手套、沒有蓋子的水壺，還有一把寫著別人名字的直尺。","上星期，我的外套不見了。我抱著一絲希望走到箱子前，翻了一陣，翻出一件深藍色的外套。我歡呼一聲，一看名牌，上面寫的是隔壁班的同學，不是我。","這時，值日的學長走過來，說：「你的外套，昨天有人撿到，放在辦公室了。」原來有個不認識的同學，看到外套掉在走廊，不但撿起來，還特地拍掉灰塵，摺好，才交給老師。","我拿回外套，聞到淡淡的洗衣精味。走出學務處前，我回頭看了一眼那個紙箱，它安靜地張著口，像一個大大的口袋，專門裝別人替你多想的那一點點，也順便等著下一隻落單的手套。"],"gj":[{"s":"我懷疑那個箱子有個無底洞","t":"誇飾","n":"把紙箱說成無底洞，一開頭就有幽默感。"},{"s":"不但撿起來，還特地拍掉灰塵，摺好，才交給老師","t":"動作描寫","n":"連續的動作寫出陌生同學的細心，善意都藏在細節裡。"},{"s":"像一個大大的口袋，專門裝別人替你多想的那一點點","t":"象徵","n":"紙箱被賦予新意義，象徵人與人之間不經意的體貼。"}],"w":[{"w":"無底洞","m":"比喻怎麼也填不滿的地方"},{"w":"學務處","m":"學校處理學生事務的處室"},{"w":"落單","m":"只剩下一個，沒有成對"}],"quiz":[{"q":"作者的外套最後在哪裡找到？","o":["在失物招領箱的最底層","被同學撿起後交到辦公室","被隔壁班同學誤拿回去"],"a":1,"why":"學長說外套昨天被人撿到，放在辦公室。"},{"q":"作者最後說紙箱像「大口袋」，裡面裝的是什麼？","o":["同學遺失的各種雜物","老師沒收的東西","別人替你多想的一點善意"],"a":2,"why":"作者寫「專門裝別人替你多想的那一點點」，指的是看不見的善意。"}],"title2":"我撿到（或弄丟）的一樣東西","hint":"寫一次撿到或弄丟東西的經過，並寫出一個讓你意外的好心人。","starters":["有一天，我發現書包裡少了……","我在走廊上撿到一樣東西……"]},{"title":"第一張志願單","theme":"夢想與未來","text":["導師發下一張薄薄的表格，上面印著「我的夢想職業」六個字。我拿著筆，筆尖停在空白處，像一隻不敢落地的麻雀。","前座的小宇寫得飛快，他要當太空人。隔壁的佩珊想當獸醫，已經在旁邊畫了一隻戴聽診器的貓。我看看他們，再看看自己，空白的格子好像越來越大。","最後我寫下「麵包師傅」。放學路上經過巷口那家麵包店，烤箱的香氣一路追著我，從轉角追到公車站牌，我吸了一大口，笑了。"],"gj":[{"s":"像一隻不敢落地的麻雀","t":"譬喻","n":"把遲疑的筆尖比成想停又不敢停的麻雀，畫面輕巧又貼切。"},{"s":"空白的格子好像越來越大","t":"誇飾","n":"格子其實沒有變大，是心裡的茫然讓它看起來變大，寫出緊張的感覺。"},{"s":"烤箱的香氣一路追著我，從轉角追到公車站牌","t":"擬人","n":"把香氣寫成會追人的人，讓味道有了動作，也暗示作者心裡的答案。"}],"w":[{"w":"聽診器","m":"醫生用來聽心跳與呼吸聲的器具"},{"w":"空白","m":"沒有寫上任何東西的地方"},{"w":"麵包師傅","m":"製作麵包的專業工作者"}],"quiz":[{"q":"作者最後寫下「麵包師傅」，主要原因是什麼？","o":["麵包店的香氣常在生活中陪著他，讓他發現自己的喜好","導師要求大家都寫與食物有關的職業","小宇告訴他麵包師傅比太空人更有前途"],"a":0,"why":"由第三段可知，作者是在放學路上被香氣牽動，才想到答案，並非受人指示。"},{"q":"「像一隻不敢落地的麻雀」使用了哪種修辭？","o":["誇飾，形容筆尖停了很久很久","譬喻，形容筆尖遲疑不決","擬人，把麻雀當成有想法的人"],"a":1,"why":"句中有「像」，把筆尖比成麻雀，是譬喻；並沒有誇大事實，也不是把物當人。"}],"title2":"我的第一個夢想","hint":"寫出你小時候或現在的一個夢想，說說它是怎麼出現的，可以加入一個當時的場景或味道。","starters":["那天，我第一次認真想過自己長大要做什麼。","如果要我在紙上寫下一個夢想，我的筆會先停在……"]},{"title":"補習班的夜燈","theme":"夢想與未來","text":["晚上八點半，補習班的窗戶一格一格亮著，像一排整齊的方糖，浮在黑色的咖啡裡。騎樓下停滿了腳踏車，車籃裡塞著書包和吃到一半的雞蛋糕。","我從三樓往下看，馬路對面的小吃攤正冒著白煙，老闆翻動鐵板的聲音，隔著玻璃還能隱約聽見。路燈一盞接著一盞，從街頭亮到街尾，好像有人把一條長長的珠鍊鋪在地上。","老師在黑板上寫著明天的目標，粉筆聲沙沙的。我把視線收回來，發現玻璃上映著自己的臉，疊在那一排燈上面，像戴了一頂亮晶晶的帽子。"],"gj":[{"s":"像一排整齊的方糖，浮在黑色的咖啡裡","t":"譬喻","n":"把亮燈的窗戶比成方糖，夜色比成咖啡，顏色與形狀都很生動，也有甜甜的感覺。"},{"s":"路燈一盞接著一盞，從街頭亮到街尾","t":"視覺摹寫","n":"用「一盞接著一盞」寫出燈光延伸的長度，讓人彷彿看見一條發亮的街。"},{"s":"粉筆聲沙沙的","t":"聽覺摹寫","n":"只用三個字就讓讀者聽見教室裡的聲音，簡短而有現場感。"}],"w":[{"w":"騎樓","m":"臨街建築一樓向外延伸、可遮雨的走廊"},{"w":"隱約","m":"不太清楚、若有若無"},{"w":"映著","m":"把影像反照出來"}],"quiz":[{"q":"「隱約」在文中的意思最接近下列何者？","o":["刻意躲藏、不讓人知道","吵雜刺耳、令人不舒服","不太清晰、若有若無"],"a":2,"why":"隔著玻璃聽小吃攤的聲音，只能模糊聽見，所以是不太清晰。"},{"q":"結尾說玻璃上自己的臉疊在燈上，最可能暗示什麼？","o":["作者與窗外許多人一樣，心中都有自己的盼望","作者覺得補習班的燈光太刺眼","作者想趕快離開教室去吃雞蛋糕"],"a":0,"why":"臉與燈疊在一起，把自己和城市裡的燈火連結起來，帶出大家都在為未來努力的感覺。"}],"title2":"夜晚的一個角落","hint":"寫一個你在晚上看見的景色，例如補習班外、夜市或回家的路，用視覺和聽覺各寫一句。","starters":["夜色降下來以後，我常在窗邊看見……","走出教室時，天已經全黑了，街上……"]},{"title":"阿公的魚攤夢","theme":"夢想與未來","text":["阿公在市場賣了四十年的魚，手上的刀比我的鉛筆盒還舊。他說話大聲，笑起來更大聲，整條走道的人都聽得見。","小時候我問他有沒有夢想，他把一尾虱目魚甩上砧板，說：「我的夢想，是讓每個客人回家都能多吃一碗飯。」我當時覺得這個夢想好小，小得像魚鱗。","直到有一天，我看見他幫獨居的奶奶把魚剖好、刺挑乾淨，還多放了兩片薑。奶奶提著袋子走遠，背影輕輕的，像是提著一整個晚上的溫暖。阿公把圍裙擦了擦，又對著下一位客人大喊：「來喔，今天的魚最肥！」"],"gj":[{"s":"笑起來更大聲，整條走道的人都聽得見","t":"誇飾","n":"聲音再大也不可能全走道都聽見，這樣寫是為了突出阿公豪爽開朗的個性。"},{"s":"小得像魚鱗","t":"譬喻","n":"用魚鱗比夢想的小，也呼應魚攤的環境，貼近人物生活。"},{"s":"像是提著一整個晚上的溫暖","t":"譬喻","n":"把看不見的溫暖寫成可以提著的東西，讓善意有了重量與畫面。"}],"w":[{"w":"砧板","m":"切菜、剖魚時墊在下面的木板"},{"w":"獨居","m":"一個人住"},{"w":"剖","m":"用刀把東西切開"}],"quiz":[{"q":"阿公的夢想是什麼？","o":["把魚攤擴大成市場裡最大的一間","讓每位客人回家都能多吃一碗飯","讓孫子接手他的刀和魚攤"],"a":1,"why":"文中阿公親口說出夢想，與客人的飯桌有關，並沒有提到擴張或傳承。"},{"q":"「笑起來更大聲，整條走道的人都聽得見」運用了什麼修辭？","o":["映襯，與阿公的安靜相對照","借代，用笑聲代表市場","誇飾，突出阿公爽朗的個性"],"a":2,"why":"現實中聲音不會傳遍整條走道，故意誇大是誇飾，用來強調個性。"}],"title2":"一位為生活努力的人","hint":"寫一位你認識、做著平凡工作的人，先寫他的外表或口頭禪，再寫一件讓你改變想法的小事。","starters":["我身邊有一個人，他的工作看起來很平凡，卻……","每次經過那個攤子，我都會先聽見……"]},{"title":"夢想的階梯","theme":"夢想與未來","text":["夢想像一座高塔，從地面望上去，頂端藏在雲裡。但是再高的塔，也是一層一層蓋起來的。","想當醫生的人，要先把國中的自然讀懂，再把高中的基礎打好，接著通過大學的訓練，最後才穿上白袍。想開餐廳的人，要先學會切菜，再學會顧火，然後學會算帳，最後才有自己的招牌。每一步看起來都不起眼，卻都不能跳過。","所以，與其問「我能不能一下子到達」，不如問「我今天能往上爬哪一階」。一階可以是背完十個單字，也可以是練習煎出一顆形狀完整的荷包蛋。"],"gj":[{"s":"要先把國中的自然讀懂，再把高中的基礎打好，接著通過大學的訓練，最後才穿上白袍","t":"層遞","n":"依照先後與難度一步步往上排，讓人看見夢想是慢慢累積出來的。"},{"s":"再高的塔，也是一層一層蓋起來的","t":"譬喻","n":"用蓋塔說明夢想的完成過程，簡單易懂。"},{"s":"與其問「我能不能一下子到達」，不如問「我今天能往上爬哪一階」","t":"映襯","n":"兩種問法相對照，把焦點從遙遠的終點拉回今天能做的事。"}],"w":[{"w":"不起眼","m":"不引人注意、看起來普通"},{"w":"基礎","m":"事物發展的根基"},{"w":"招牌","m":"店家掛在門口標示名稱的牌子"}],"quiz":[{"q":"第二段舉醫生與餐廳的例子，目的是什麼？","o":["說明夢想要一步一步完成","比較醫生與廚師哪一種職業更辛苦","說明夢想應挑選最容易實現的"],"a":0,"why":"兩個例子都按順序排出步驟，並以「每一步都不能跳過」收束，重點是循序漸進。"},{"q":"「先……再……接著……最後……」的寫法最接近哪種修辭？","o":["排比","層遞","轉化"],"a":1,"why":"句子依先後順序、層層向上推進，屬層遞；排比強調結構相似但不一定有程度或順序的推進。"}],"title2":"我的一小步","hint":"寫下一個你想達成的目標，並列出三個由小到大的步驟，再寫你這星期完成了哪一步。","starters":["如果夢想是一座塔，我現在大概站在第……","要完成這件事，我得先……"]},{"title":"寫給三年後的我","theme":"夢想與未來","text":["三年後的我，你好嗎？這時候是十月底，窗外的路燈把樹影丟在牆上，一晃一晃的。","我現在坐在書桌前，檯燈的光圈很小，剛好罩住一本寫了一半的作業。我不知道你有沒有考上想去的學校，不知道你還喜不喜歡畫畫，也不知道你是不是已經不再害怕上台報告。","如果你已經變得很厲害，請不要笑我現在的笨拙。如果你還在原地打轉，也沒關係，我替你把檯燈開著。夜風從紗窗鑽進來，翻了翻桌上的信紙，像是替你先答了一聲：「在。」"],"gj":[{"s":"不知道你有沒有考上想去的學校，不知道你還喜不喜歡畫畫，也不知道你是不是已經不再害怕上台報告","t":"排比","n":"三個「不知道」連著說，節奏層層推進，把對未來的好奇與不安都寫出來。"},{"s":"檯燈的光圈很小，剛好罩住一本寫了一半的作業","t":"視覺摹寫","n":"用光圈的大小寫出安靜、專注的小小世界。"},{"s":"夜風從紗窗鑽進來，翻了翻桌上的信紙","t":"擬人","n":"把風寫成會翻信的人，結尾因此有了溫柔的回應。"}],"w":[{"w":"笨拙","m":"動作或想法不靈巧"},{"w":"原地打轉","m":"一直停在同一處，沒有進展"},{"w":"紗窗","m":"裝在窗上防蚊蟲的網"}],"quiz":[{"q":"「原地打轉」在文中最可能指什麼？","o":["在操場上繞圈跑步","對現在的生活非常滿意","還沒有明顯進步"],"a":2,"why":"句子與「變得很厲害」相對，所以指停在原處、沒有進展。"},{"q":"「我替你把檯燈開著」表達了什麼心意？","o":["願意在未來的自己迷惘時給予陪伴","提醒自己要節省用電","打算通宵讀書不睡覺"],"a":0,"why":"開燈象徵光亮與等待，是對未來的自己的支持，不是真的要省電或熬夜。"}],"title2":"寫給未來的一封信","hint":"寫一封短信給三年後的自己，先問候，再說說你現在的生活，最後說一句祝福。","starters":["三年後的我，你還記得今天……","親愛的未來，我想先告訴你……"]},{"title":"夢想不必很大","theme":"夢想與未來","text":["很多人以為，夢想一定要大到能上新聞，大到讓全校同學都羨慕。其實，夢想的大小並不重要，重要的是它能不能讓你早上願意起床。","想想看，有人夢想成為站上球場的投手，有人夢想把巷口的早餐店顧成老字號，也有人只想學會騎單車繞完一圈夜市。這些夢想大小不同，卻都讓人願意今天多努力一點點。","當然，也有人會說，夢想太小就沒出息。但換個角度想，連小小的目標都不肯踏出去，大夢想也只會停在空中。反過來說，小夢想一個一個完成，就是在替大夢想鋪路。","所以，不妨先把夢想放進口袋，走到哪帶到哪。"],"gj":[{"s":"夢想一定要大到能上新聞，大到讓全校同學都羨慕","t":"誇飾","n":"用誇張的標準寫出人們對夢想的迷思，也為後面的反駁做準備。"},{"s":"有人夢想成為站上球場的投手，有人夢想把巷口的早餐店顧成老字號，也有人只想學會騎單車繞完一圈夜市","t":"排比","n":"三個例子句型相近，從運動、生意到日常，讓論點更有說服力。"},{"s":"小夢想一個一個完成，就是在替大夢想鋪路","t":"轉化","n":"把完成夢想寫成鋪路，讓抽象的累積變成看得見的動作。"}],"w":[{"w":"老字號","m":"經營很久、信譽良好的店"},{"w":"羨慕","m":"看見別人擁有而心生嚮往"},{"w":"鋪路","m":"為後面的發展先做準備"}],"quiz":[{"q":"本文的主要看法是什麼？","o":["夢想越大越值得被稱讚","夢想的大小不是重點，能讓人願意努力才重要","小夢想因為容易達成所以不需要努力"],"a":1,"why":"第一段提出看法，後文以例子與反面意見一再支持這個觀點。"},{"q":"第三段開頭「當然，也有人會說……」的作用是什麼？","o":["重複第一段的看法","轉換成與夢想無關的主題","先提出反方意見再回應，使論證更周全"],"a":2,"why":"議論文常先承認不同意見再反駁，能顯示作者思考完整。"}],"title2":"我心中的小夢想","hint":"寫一個你覺得「很小卻很重要」的夢想，先說看法，再用一個自己的例子說明。","starters":["我認為，夢想不一定要很大，例如……","有人覺得我的夢想太小，但是……"]},{"title":"我的未來不是睡覺","theme":"夢想與未來","text":["我的志願，本來是「當一個睡到自然醒的人」。我把這句話寫在聯絡簿上，導師用紅筆圈起來，旁邊寫了三個字：「請重寫」。","我只好開始認真思考。如果我當上班族，鬧鐘要比我早起；如果我當老師，我要比學生早到；如果我當夜市老闆，我還得在半夜三點去批貨。我發現，全世界的職業好像都在跟我的棉被作對。","最後我想到一個完美的工作：枕頭試用員。我興沖沖拿給媽媽看，她盯著我看了五秒，說：「先把你的床整理好，再來討論你的前途。」","我低頭看著那團像海苔卷一樣纏在一起的棉被，默默地開始摺。"],"gj":[{"s":"如果我當上班族，鬧鐘要比我早起；如果我當老師，我要比學生早到；如果我當夜市老闆，我還得在半夜三點去批貨","t":"層遞","n":"起床時間一個比一個早，層層加碼，幽默感就這樣累積起來。"},{"s":"全世界的職業好像都在跟我的棉被作對","t":"誇飾","n":"把個人的賴床說成全世界與他作對，誇張得好笑。"},{"s":"那團像海苔卷一樣纏在一起的棉被","t":"譬喻","n":"用海苔卷比棉被的樣子，貼近生活又有畫面。"}],"w":[{"w":"興沖沖","m":"興致很高、很急切的樣子"},{"w":"批貨","m":"向上游一次買進商品"},{"w":"聯絡簿","m":"學校與家長聯絡用的簿子"}],"quiz":[{"q":"「全世界的職業好像都在跟我的棉被作對」使用了哪種修辭？","o":["誇飾","借代","映襯"],"a":0,"why":"並非真的全世界的職業都針對棉被，故意放大是誇飾。"},{"q":"媽媽叫作者先整理床，真正的意思最可能是什麼？","o":["她支持作者去當枕頭試用員","未來要從生活中的小事先做好","她想要買一條新的棉被"],"a":1,"why":"媽媽用幽默方式提醒：連床都整理不好，很難談前途，是在談責任與習慣。"}],"title2":"一個很奇怪的志願","hint":"想一個好玩、不太正經的志願，寫出它的理由，並加入家人或老師的反應。","starters":["如果可以選一份很奇怪的工作，我會選……","當我把這個志願告訴媽媽，她……"]},{"title":"校門口的流浪狗","theme":"環境與動物","text":["校門口的紅綠燈旁，住著一隻黃色的狗。同學都叫牠「便當」，因為牠總是在午休時間出現，眼睛亮亮地盯著每一個提便當袋的人。","我起初覺得牠很可愛，常常把吃不完的雞腿丟給牠。後來警衛伯伯攔住我，說：「人吃的東西太鹹，對牠的身體不好。你若真的喜歡牠，就別亂餵。」我愣住了，原來我以為的善意，可能是在添麻煩。","現在我只在放學時蹲下來，輕輕摸牠的頭。便當搖著尾巴，把下巴擱在我的鞋面上，像一塊溫熱的小毯子。"],"gj":[{"s":"眼睛亮亮地盯著每一個提便當袋的人","t":"視覺摹寫","n":"抓住狗盯著食物的神情，讓讀者一看就懂牠為什麼叫便當。"},{"s":"原來我以為的善意，可能是在添麻煩","t":"映襯","n":"「善意」與「添麻煩」形成反差，寫出作者想法改變的瞬間。"},{"s":"像一塊溫熱的小毯子","t":"譬喻","n":"把狗的重量與體溫比成毯子，讓結尾溫暖又安靜。"}],"w":[{"w":"攔住","m":"擋下，不讓繼續前進"},{"w":"愣住","m":"因驚訝而一時反應不過來"},{"w":"擱","m":"放置"}],"quiz":[{"q":"警衛伯伯為什麼要阻止作者餵雞腿？","o":["學校規定不可以帶便當進校園","狗吃了雞腿會變得很兇","人吃的食物太鹹，可能傷害狗的健康"],"a":2,"why":"文中警衛明說人吃的食物對牠的身體不好。"},{"q":"作者後來「只在放學時蹲下來摸頭」，代表什麼？","o":["他學會用不傷害動物的方式表達關心","他不再喜歡這隻狗","他害怕被警衛責罵"],"a":0,"why":"重點在改變做法而非改變喜歡的心意，是用更適當的方式相處。"}],"title2":"我與一隻動物的相遇","hint":"寫一次你與動物相處的經驗，先說發生了什麼，再說你後來怎麼想。","starters":["在路邊，我第一次遇見牠……","那隻動物看著我，眼神……"]},{"title":"雨後的稻田","theme":"環境與動物","text":["午後的雷陣雨像一群急著趕路的人，嘩啦啦地經過，又匆匆離開。雲縫裡透出一線陽光，雨後的稻田便亮了起來。","田埂上的水窪，一塊一塊嵌著天空。稻葉尖端掛著水珠，風一搖，珠子就滾進泥土裡，發出細細的「滴」聲。幾隻白鷺鷥停在水田邊，伸長了脖子，像一支支白色的問號。","空氣裡有濕泥巴和青草混合的味道，吸進鼻子，涼涼甜甜。遠處的電線上，燕子排成一列音符，等著誰來彈奏。"],"gj":[{"s":"午後的雷陣雨像一群急著趕路的人，嘩啦啦地經過","t":"譬喻","n":"把雨寫成趕路的人群，同時用聲音寫出雨的急促。"},{"s":"田埂上的水窪，一塊一塊嵌著天空","t":"轉化","n":"水窪映著天空，寫成像鑲嵌的寶石，景色變得有層次。"},{"s":"空氣裡有濕泥巴和青草混合的味道，吸進鼻子，涼涼甜甜","t":"嗅覺摹寫","n":"從氣味與溫度感受雨後的田野，讓讀者彷彿站在田邊。"}],"w":[{"w":"田埂","m":"稻田之間隆起的小路"},{"w":"水窪","m":"地面上積水的小凹處"},{"w":"白鷺鷥","m":"常見於水田的白色涉禽"}],"quiz":[{"q":"「午後的雷陣雨像一群急著趕路的人」使用了哪種修辭？","o":["借代","譬喻","排比"],"a":1,"why":"句中有「像」，是把雨比成人群，屬譬喻。"},{"q":"「水窪嵌著天空」最可能的意思是什麼？","o":["天空掉進了水窪","水窪被泥土填滿","水窪映出天空，看起來像鑲在地上"],"a":2,"why":"水面像鏡子，反映天空，作者用「嵌」寫出像寶石鑲在地面的視覺。"}],"title2":"雨後的一個畫面","hint":"寫一個你在下雨後看見的畫面，加入至少一種聲音與一種氣味。","starters":["雨剛停，我走到屋外，先聞到……","雲散開的時候，路邊……"]},{"title":"淨灘的阿姨","theme":"環境與動物","text":["每個月第一個星期天，王阿姨都會出現在海邊，戴著斗笠，提著夾子和大垃圾袋。她個子不高，走起路來卻比誰都快，像一台自動掃地機。","有一次我跟著媽媽去幫忙。阿姨撿起一個寶特瓶，翻過來看看，說：「你看，瓶蓋還在，這個可以回收。」又夾起一條漁網，輕輕解開纏在上面的海藻。她說得很平常，好像在說今天的菜價。","我問她累不累。她把斗笠往後推，露出曬紅的臉，說：「海邊乾淨了，浪就比較開心。」說完又彎下腰，背影在沙灘上慢慢移動，像一隻認真的寄居蟹。"],"gj":[{"s":"像一台自動掃地機","t":"譬喻","n":"用機器比喻阿姨行動迅速、動作有效率，詼諧又傳神。"},{"s":"海邊乾淨了，浪就比較開心","t":"擬人","n":"讓浪有了心情，用溫柔的說法表達保護環境的想法，不說教。"},{"s":"又夾起一條漁網，輕輕解開纏在上面的海藻","t":"動作描寫","n":"「夾」與「解開」兩個動作寫出阿姨的細心。"}],"w":[{"w":"斗笠","m":"遮陽用的竹編帽"},{"w":"回收","m":"把可再利用的物品收回處理"},{"w":"寄居蟹","m":"住在空殼中的蟹類"}],"quiz":[{"q":"阿姨說「浪就比較開心」，主要表現了什麼？","o":["她用溫柔的角度看待環境保護","她覺得浪真的會說話","她想抱怨垃圾太多"],"a":0,"why":"這句話是擬人，不是抱怨，用溫和的方式表達愛護海洋的心意。"},{"q":"「她說得很平常，好像在說今天的菜價」可看出阿姨怎樣的態度？","o":["對垃圾感到非常生氣","把淨灘當作自然的日常","不太重視回收"],"a":1,"why":"用說菜價的口氣說回收，代表她早已習慣、不覺得是大事。"}],"title2":"一次愛護環境的小行動","hint":"寫一件你或你身邊的人為環境做的小事，描寫動作和說的話。","starters":["那天，我第一次拿起夾子……","她一邊撿垃圾，一邊說……"]},{"title":"濕地像海綿","theme":"環境與動物","text":["濕地常被誤會成「沒用的爛泥巴地」，其實它是大自然的海綿。下大雨時，濕地可以先把一部分的水吸住，再慢慢放出去，減少積水淹進街道的機會。","除此之外，濕地也是許多生物的家。水裡有小魚和螃蟹，泥灘上有貝類，天空中則有來來去去的水鳥。這些生物彼此相連：小魚和蝦蟹是水鳥的食物，水鳥吃飽了才有力氣繼續遷徙，形成一個小小的循環。","台灣的西南沿海就有不少濕地，每到冬天，常有候鳥來這裡休息。保護濕地，就像替城市保留一塊看不見的緩衝墊。"],"gj":[{"s":"濕地常被誤會成「沒用的爛泥巴地」，其實它是大自然的海綿","t":"譬喻","n":"先寫誤會，再用海綿揭曉真正功能，一抑一揚，讓人印象深刻。"},{"s":"水裡有小魚和螃蟹，泥灘上有貝類，天空中則有來來去去的水鳥","t":"排比","n":"由水中、泥灘到天空，空間層層展開，說明濕地的多樣生物。"},{"s":"小魚和蝦蟹是水鳥的食物，水鳥吃飽了才有力氣繼續遷徙","t":"因果說明","n":"說明食物與遷徙的關係，讓讀者理解生物之間彼此依靠。"}],"w":[{"w":"緩衝","m":"減輕衝擊或影響"},{"w":"遷徙","m":"動物隨季節遠距離移動"},{"w":"循環","m":"事物依序重複的過程"}],"quiz":[{"q":"文章說濕地像海綿，是因為它能怎樣？","o":["把所有雨水立刻蒸發","讓水完全停止流動","先吸住部分雨水，再慢慢放出"],"a":2,"why":"第一段直接說明濕地先吸水、再慢慢放水，減少積水。"},{"q":"第二段主要用哪種方法說明？","o":["列舉不同生物，並說明彼此的關係","用統計數字比較濕地大小","與沙漠的環境相比較"],"a":0,"why":"第二段列出水中、泥灘與天空的生物，再說明食物關係。"}],"title2":"我認識的一種自然環境","hint":"介紹一種你去過或知道的自然環境，說明它的特色，並寫出它對人或動物的幫助。","starters":["你知道嗎？有一個地方，常被人忽略……","第一次走進那片自然環境，我看見……"]},{"title":"窗台上的麻雀","theme":"環境與動物","text":["每天早上六點多，總有幾隻麻雀落在我家的窗台，嘰嘰喳喳，像一群還沒睡醒的同學在吵著交作業。","我曾經嫌牠們吵，直到有一次下大雨，我看見牠們縮在冷氣室外機旁，羽毛濕成一團，抖也不敢抖。我找出一小碟碎米，放在遮雨的角落。第二天，牠們沒有道謝，只是歪著頭看我，然後一隻接著一隻啄起米粒。","我沒有再嫌牠們吵。城市很大，高樓一棟比一棟高，能讓小鳥落腳的地方卻一天比一天少。那點小小的重量落在窗台上，輕輕的，卻讓我覺得自己也被需要。窗外天色漸亮，一隻麻雀抖抖翅膀，飛進晨光裡。"],"gj":[{"s":"像一群還沒睡醒的同學在吵著交作業","t":"譬喻","n":"把麻雀比成同學，生活感很強，也讓吵鬧變得可愛。"},{"s":"羽毛濕成一團，抖也不敢抖","t":"細節描寫","n":"用小小的動作寫出麻雀淋雨的狼狽，讓人心疼。"},{"s":"高樓一棟比一棟高，能讓小鳥落腳的地方卻一天比一天少","t":"映襯","n":"高樓越來越多，落腳處卻越來越少，兩者對照出城市中動物生存的困難。"}],"w":[{"w":"嘰嘰喳喳","m":"形容鳥叫或人聲細碎吵雜"},{"w":"啄","m":"鳥類用嘴取食或叩擊"},{"w":"落腳","m":"暫時停留或住下"}],"quiz":[{"q":"「落腳」在文中的意思是什麼？","o":["不小心摔倒","暫時停留休息","匆匆離開"],"a":1,"why":"「小鳥落腳的地方」指鳥能停下休息的地方。"},{"q":"第三段對比高樓與落腳處，作者想表達什麼？","o":["麻雀應該搬到鄉下去","高樓越多越能保護鳥類","城市發展讓小動物的生存空間變少"],"a":2,"why":"高樓越來越高、落腳處越來越少，指出環境變化對動物的影響。"}],"title2":"窗外的小訪客","hint":"寫一次你在家中或校園看見小動物的經驗，描寫牠的動作，以及你的心情變化。","starters":["清晨，一隻小動物出現在……","一開始我嫌牠吵，後來……"]},{"title":"寵物不是玩具","theme":"環境與動物","text":["我認為，養寵物之前，應該先想清楚自己能不能負責到底。寵物不是玩具，膩了就能收進箱子裡。","例如，有人看到小狗可愛就帶回家，沒過多久，卻發現牠會咬鞋子、會半夜吠叫，還需要每天散步。又如，一隻貓可能陪伴人很多年，吃飯、看醫生、打掃，都是不能中斷的責任。","也許有人會說，只要真心喜歡，自然會願意付出。這句話有一半是對的，喜歡是起點，卻不是全部。喜歡讓人心動，責任才讓人留下。","所以，想養寵物的人，先別急著問「牠可不可愛」，不妨先問「十年後，我還在牠身邊嗎」。"],"gj":[{"s":"寵物不是玩具，膩了就能收進箱子裡","t":"借喻","n":"把寵物與玩具相提並論再否定，直接點出不能隨便對待生命。"},{"s":"喜歡讓人心動，責任才讓人留下","t":"對偶","n":"兩句字數相近、意思相對，把「喜歡」與「責任」的差別說得清楚易記。"},{"s":"先別急著問「牠可不可愛」，不妨先問「十年後，我還在牠身邊嗎」","t":"映襯","n":"兩種問題相對照，把結論落在長期的承諾上，也給讀者一個可以思考的行動。"}],"w":[{"w":"吠叫","m":"狗大聲叫"},{"w":"責任","m":"分內應盡的義務"},{"w":"中斷","m":"半途停止"}],"quiz":[{"q":"第二段在議論文結構中的功能是什麼？","o":["舉例說明養寵物需要持續付出","提出與作者相反的意見","總結全文並呼籲行動"],"a":0,"why":"第二段用小狗與貓的例子支持第一段的看法。"},{"q":"「喜歡讓人心動，責任才讓人留下」的意思是什麼？","o":["喜歡一點都不重要","喜歡是開始，長期照顧要靠責任","責任會讓人討厭寵物"],"a":1,"why":"作者在上一句已說明喜歡是起點、不是全部，因此責任才讓人持續陪伴。"}],"title2":"我對這件事的看法","hint":"選一個與動物或環境有關的題目，先說看法，再舉一個例子，最後寫一個反方意見並回應。","starters":["我認為，對待動物應該……","舉例來說，我曾經看過……"]},{"title":"我家的貓是老闆","theme":"環境與動物","text":["我家有一隻橘貓，名叫「年糕」。牠體重七公斤，走路像一顆會滾動的南瓜。全家人都說，是我們在養牠，只有我知道，其實是牠在養我們。","每天早上五點，牠會準時站在我的胸口，用肉墊輕輕按我的臉，意思是：「員工，上班了。」我若假裝沒醒，牠就把我桌上的筆一支一支推到地上，掉落的聲音又清脆又響亮，像在敲打考勤鐘。","晚上我寫功課，牠就坐在課本正中間，尾巴掃過我的鼻子，好像在批閱公文。我只好把作業挪到一個小角落，委屈地縮著手寫字。","今天牠又盯著我的便當，眼神深不可測。我默默夾了一塊雞肉，放在牠面前的盤子裡。"],"gj":[{"s":"走路像一顆會滾動的南瓜","t":"譬喻","n":"用南瓜形容橘貓圓滾滾的身材，顏色與形狀都對上了。"},{"s":"全家人都說，是我們在養牠，只有我知道，其實是牠在養我們","t":"倒反","n":"表面上是人養貓，實際上卻是貓在支使人，形成幽默的反差。"},{"s":"用肉墊輕輕按我的臉，意思是：「員工，上班了。」","t":"擬人","n":"把貓的動作翻譯成老闆說的話，角色立刻有趣起來。"}],"w":[{"w":"肉墊","m":"貓狗腳底柔軟的墊"},{"w":"考勤","m":"按時間記錄上下班"},{"w":"深不可測","m":"深奧得讓人猜不透"}],"quiz":[{"q":"「走路像一顆會滾動的南瓜」強調貓的什麼特點？","o":["走路速度很快","毛色非常特別","身形圓胖"],"a":2,"why":"南瓜圓滾滾，與前句七公斤相呼應，突出貓的圓胖。"},{"q":"結尾夾雞肉給貓，最可能暗示什麼？","o":["作者最後還是乖乖聽貓的","作者想測試貓餓不餓","作者打算把便當全部吃掉"],"a":0,"why":"整篇把貓當成老闆，結尾作者主動奉上雞肉，延續幽默。"}],"title2":"我家的某位成員","hint":"把家中的一位成員，可以是人或寵物，用誇張又有趣的角度介紹，寫出他的口頭禪或習慣動作。","starters":["我家有一位「老闆」，牠……","每天晚上，牠最愛做的事是……"]},{"title":"除夕圍爐","theme":"傳統與節慶","text":["除夕下午，廚房裡的鍋鏟聲從沒停過。媽媽炒著長年菜，姑姑剝著蝦子，我站在旁邊負責一項重要任務：把碗筷擺好。","傍晚六點，白髮與黑髮擠在同一張圓桌旁，十幾雙筷子在菜盤之間穿梭。魚端上桌時，阿嬤說要留一點，這叫做「年年有餘」。阿公舉起杯子說了幾句吉祥話，我的汽水冒著小泡泡，也跟著舉高。","飯後，小孩子最期待的時刻到了。長輩們一個個把紅包遞過來，我雙手接下，嘴裡說著「恭喜發財，身體健康」。數著數著，鞭炮聲從遠處傳來，劈劈啪啪，像在替我們鼓掌。"],"gj":[{"s":"白髮與黑髮擠在同一張圓桌旁","t":"借代","n":"以頭髮顏色代替老人與年輕人，一句話就寫出三代同堂的熱鬧。"},{"s":"十幾雙筷子在菜盤之間穿梭","t":"轉化","n":"把筷子寫成穿梭的人，畫面有動感，也讓人感覺到大家搶著夾菜的熱烈。"},{"s":"鞭炮聲從遠處傳來，劈劈啪啪，像在替我們鼓掌","t":"譬喻","n":"聲音加上比喻，使結尾充滿節慶氣氛。"}],"w":[{"w":"長年菜","m":"過年常吃的芥菜，象徵長壽"},{"w":"吉祥話","m":"祝福順利平安的話"},{"w":"穿梭","m":"來回快速移動"}],"quiz":[{"q":"「白髮與黑髮擠在同一張圓桌旁」中，「白髮」「黑髮」是借代什麼？","o":["染髮的人與沒染的人","老人與年輕人","頭髮保養的方法"],"a":1,"why":"借代是用相關特徵代替本體，這裡以髮色代表不同年齡的人。"},{"q":"文中「魚要留一點」，是為了取什麼寓意？","o":["魚不好吃","魚代表小孩","年年有餘"],"a":2,"why":"這是台灣常見的過年習俗，取「魚」與「餘」同音。"}],"title2":"我家的過年","hint":"寫一個你家過年的場景，用一個借代或特別的比喻，並寫出一種聲音。","starters":["每年除夕，我家最熱鬧的時刻是……","聽到鞭炮聲，我就知道……"]},{"title":"元宵夜的燈海","theme":"傳統與節慶","text":["元宵節的晚上，公園裡的燈會亮了起來。入口處立著一座巨大的花燈，彩光一明一暗，像在呼吸。","小朋友提著兔子燈與魚燈，在人群裡搖搖晃晃地走，燈裡的小燈泡閃啊閃，把一張張臉照得紅通通。猜燈謎的攤位前擠滿了人，有人皺著眉，有人突然拍手大喊「我知道了」。","我捧著一碗熱湯圓，白煙撲上鏡片，眼前一片霧。等霧散開，抬頭一看，遠處的夜空裡，有幾盞天燈正緩緩升起，一盞接著一盞，越飄越高，終於和星星混在一起，分不出誰是誰了。"],"gj":[{"s":"彩光一明一暗，像在呼吸","t":"譬喻","n":"以呼吸比喻燈光忽明忽暗，讓巨大的花燈有了生命。"},{"s":"白煙撲上鏡片，眼前一片霧","t":"視覺摹寫","n":"用熱湯圓的蒸氣寫視線模糊，是只有元宵夜才有的小細節。"},{"s":"有幾盞天燈正緩緩升起，一盞接著一盞，越飄越高，終於和星星混在一起，分不出誰是誰了","t":"層遞","n":"由升起、增多到越飄越高，最後和星星混在一起，一層層把視線帶向夜空，很有餘韻。"}],"w":[{"w":"猜燈謎","m":"元宵節常見的猜謎活動"},{"w":"搖搖晃晃","m":"站立或行走不穩的樣子"},{"w":"緩緩","m":"慢慢地"}],"quiz":[{"q":"「一盞接著一盞，越飄越高」最接近哪種寫法？","o":["層遞，一步步推向高處","排比，字數完全相同","誇飾，把天燈說成星星"],"a":0,"why":"由升起到越飄越高，有逐步向上的程度推進，是層遞。"},{"q":"「分不出誰是誰了」指什麼？","o":["天燈被風吹散","天燈越飛越高，與星光混在一起","作者眼鏡起霧看不清"],"a":1,"why":"這是前文「和星星混在一起」的結果，用來寫夜空的美。"}],"title2":"節慶夜晚的一個畫面","hint":"寫一個你參加燈會、市集或夜市的畫面，用光線、味道與人群寫出氣氛。","starters":["夜裡的人潮把街道擠得滿滿的，我……","遠遠地，我看見一片亮光……"]},{"title":"外婆的粽子","theme":"傳統與節慶","text":["端午節前一天，外婆的客廳鋪滿了粽葉，空氣裡浮著一股清清的草香。她坐在小板凳上，手指一捲一折，一片葉子就變成一個漂亮的小漏斗。","「米要壓緊，不然煮的時候會散。」外婆一邊說，一邊舀進花生、香菇和一塊滷得油亮的肉。她的雙手滿是皺紋，卻靈活得像兩隻小鳥，綁繩子時一拉一繞，快得我還沒看清楚，一顆粽子已經完成。","我學了三次，包出來的粽子不是漏米，就是歪成一團。外婆笑到肩膀發抖，說：「沒關係，歪的留給你吃。」門邊掛著剛買來的艾草，鍋裡的水開始滾，整間屋子的白煙裡，都是外婆的味道。"],"gj":[{"s":"手指一捲一折，一片葉子就變成一個漂亮的小漏斗","t":"動作描寫","n":"用「一捲一折」寫出熟練的手勢，結果一出現，更突顯外婆的功夫。"},{"s":"靈活得像兩隻小鳥","t":"譬喻","n":"用小鳥比外婆的手，把滿是皺紋的手寫得輕巧而有生命力。"},{"s":"整間屋子的白煙裡，都是外婆的味道","t":"轉化","n":"把味道當成可以充滿房間的東西，寫出親人的氣息，也有節慶氛圍。"}],"w":[{"w":"粽葉","m":"包粽子用的葉子"},{"w":"艾草","m":"端午常掛在門邊的草本植物"},{"w":"靈活","m":"動作敏捷、不呆板"}],"quiz":[{"q":"「靈活得像兩隻小鳥」主要形容外婆的什麼？","o":["身材很嬌小","說話聲音清脆","雙手動作輕巧熟練"],"a":2,"why":"句子前面寫雙手與綁繩子，可知是形容手的動作靈活。"},{"q":"外婆說「歪的留給你吃」，表現什麼？","o":["用幽默鼓勵包不好的孫子","責怪孫子浪費米","嫌棄孫子笨手笨腳"],"a":0,"why":"她笑到肩膀發抖，語氣輕鬆，是用玩笑化解孫子的挫折。"}],"title2":"一位傳承手藝的家人","hint":"寫一位會做某種傳統食物或手藝的長輩，描寫他的雙手和一句說過的話。","starters":["每到節日，奶奶總會坐在……","她的手一動，我就看得入神……"]},{"title":"中秋節怎麼過","theme":"傳統與節慶","text":["中秋節在農曆八月十五，這一天的月亮，在人們眼中特別圓、特別亮，所以也被叫做「團圓節」。","說起中秋的習俗，最常見的就是賞月與吃月餅。月餅圓圓的，象徵團圓，餅皮裡包著的餡料從豆沙、蓮蓉到蛋黃，口味各有各的愛好者。","此外，許多台灣家庭還有一個特別的習慣：全家人聚在騎樓下或公園裡烤肉。炭火一紅，肉片滋滋作響，香味順著風飄到隔壁，有時連鄰居都會探頭來打招呼。桌上常有一顆剝好的柚子，清香又多汁，據說柚與「佑」同音，帶有保佑的祝福。"],"gj":[{"s":"這一天的月亮，在人們眼中特別圓、特別亮","t":"類疊","n":"「特別」重複使用，一層強調月亮的圓與亮，也說明為何成為團圓的象徵。"},{"s":"炭火一紅，肉片滋滋作響，香味順著風飄到隔壁","t":"感官摹寫","n":"用視覺、聽覺與嗅覺寫出烤肉的場面，說明文也能有畫面。"},{"s":"據說柚與「佑」同音，帶有保佑的祝福","t":"諧音","n":"用同音字說明吃柚子的寓意，是中文節慶常見的文字巧思。"}],"w":[{"w":"象徵","m":"用具體事物表示抽象意義"},{"w":"餡料","m":"包在食物裡面的內容"},{"w":"探頭","m":"伸出頭來看"}],"quiz":[{"q":"中秋節為什麼又稱「團圓節」？","o":["這天全國放長假","月圓象徵家人團聚","大家要互送月餅給朋友"],"a":1,"why":"第一段與第二段都提到月圓、月餅圓圓象徵團圓。"},{"q":"「柚與佑同音」使用了什麼文字技巧？","o":["借代","排比","諧音"],"a":2,"why":"利用字音相同來表達祝福，屬諧音。"}],"title2":"我家的中秋","hint":"寫你家如何過中秋，介紹一種食物或活動，並寫出一個有趣的細節。","starters":["中秋節那天，我家最期待的是……","月亮還沒升起，院子裡已經……"]},{"title":"清明時節","theme":"傳統與節慶","text":["清明前後，常常下著細雨。我們一家人提著鮮花、水果，沿著山坡的小路往上走，草葉上的水珠沾濕了我的褲腳。","阿公把墓碑旁的雜草一把一把拔掉，阿嬤用毛巾擦拭碑上的字。爸爸點起香，我學著大人的樣子，雙手合十，把心裡想說的話輕輕說給天上聽。我從沒見過曾祖父，卻覺得那一刻，像有一條細細的線，把我和很久以前的人連在一起。","回程時雨停了，雲縫裡露出一小片藍天。阿嬤提著空空的竹籃走在前面，白髮在風裡微微飄動。我回頭看了一眼，山坡上的香煙，還淡淡地升著。"],"gj":[{"s":"像有一條細細的線，把我和很久以前的人連在一起","t":"譬喻","n":"把看不見的親情寫成一條線，說出對祖先的連結感，細膩而不誇張。"},{"s":"阿公把墓碑旁的雜草一把一把拔掉","t":"類疊","n":"「一把一把」寫出反覆的動作，也看出家人對祖先的用心。"},{"s":"白髮在風裡微微飄動","t":"借代","n":"用白髮代替年長的阿嬤，把她的年紀與背影一起寫進畫面。"}],"w":[{"w":"墓碑","m":"立在墓前刻有名字的石碑"},{"w":"擦拭","m":"用布輕輕擦乾淨"},{"w":"雙手合十","m":"兩手掌心相合，表示敬意"}],"quiz":[{"q":"「白髮在風裡微微飄動」中的「白髮」是借代什麼？","o":["年長的阿嬤","風的顏色","時間"],"a":0,"why":"由前一句阿嬤走在前面可知，白髮用來代表阿嬤本人。"},{"q":"「像有一條細細的線」最可能表達什麼？","o":["擔心在山上走失","在祭拜中感到與祖先之間的連結","想起放風箏的回憶"],"a":1,"why":"線把「我」與很久以前的人連在一起，說明作者感受到家族的傳承。"}],"title2":"一次家人相聚的儀式","hint":"寫一次你與家人一起進行的節日或祭拜活動，描寫其中一個動作和你的心情。","starters":["那天，我們一早就出門，路上……","大人們在忙的時候，我悄悄……"]},{"title":"廟會的熱鬧","theme":"傳統與節慶","text":["每次聽到遠方傳來鑼鼓聲，我就知道廟會到了。有人覺得廟會吵吵鬧鬧，不如待在家裡滑手機；我卻認為，廟會是一個地方記憶最鮮活的樣子。","你看，神轎經過時，街上的人自動讓出一條路；陣頭的鼓點一響，連最不愛運動的人都想跟著晃兩下。廟埕前的小吃攤排成一列，滷肉飯、麵線、涼水，每一樣都是從小吃到大的味道。","當然，鞭炮聲和人潮確實會帶來噪音與垃圾，這是需要大家一起改進的地方，比如減少不必要的燃放、活動結束後一起整理環境。但不能因此就說廟會沒有價值。","一個熱鬧的廟埕，就像一本會動的地方誌，翻開之後，有鄰居、有味道，也有聲音。"],"gj":[{"s":"每次聽到遠方傳來鑼鼓聲，我就知道廟會到了","t":"借代","n":"用鑼鼓聲代替廟會，一聽到聲音就想到整場熱鬧，有地方色彩。"},{"s":"鞭炮聲和人潮確實會帶來噪音與垃圾，這是需要大家一起改進的地方","t":"讓步轉折","n":"先承認缺點，再提出改進方向，使論證不偏頗、不誇張。"},{"s":"一個熱鬧的廟埕，就像一本會動的地方誌","t":"譬喻","n":"把廟埕比成活的書，收束時既有畫面又替論點加分。"}],"w":[{"w":"廟埕","m":"廟前的廣場"},{"w":"陣頭","m":"廟會中的民俗表演隊伍"},{"w":"地方誌","m":"記錄一個地方歷史與風俗的書"}],"quiz":[{"q":"第三段承認廟會會有噪音與垃圾，目的是什麼？","o":["否定廟會的價值","轉換成與廟會無關的話題","承認缺點並提出改善，讓論證更周全"],"a":2,"why":"議論文提到反面問題，再提出改善方向，能增加說服力。"},{"q":"「一本會動的地方誌」使用了哪種修辭？","o":["譬喻","借代","誇飾"],"a":0,"why":"把廟埕比作書，是明喻中的隱喻式比喻，屬譬喻。"}],"title2":"一場我參加過的熱鬧活動","hint":"寫一次你參加廟會、市集或慶典的經驗，先寫聲音與味道，再說你的看法。","starters":["遠遠地，我先聽到……","我覺得這樣的熱鬧，值得留下，因為……"]},{"title":"紅包保管費","theme":"傳統與節慶","text":["每年過年，我的口袋都會經歷一場「短暫的富有」。初一到初三，長輩的紅包一個接一個遞過來，我數了數，剛好湊成一張夠買新球鞋的金額。","然而，這份財富平均活不過三十分鐘。媽媽笑咪咪地走過來，說：「來，媽媽幫你保管，以後給你。」我說：「那什麼時候給我？」她說：「等你長大。」我說：「我國中二年級，已經很大了。」她說：「還差一點。」","我這才發現，紅包袋根本是一種魔法道具，從長輩手中遞出時是紅色，到了我手裡是金色，進了媽媽口袋就變成透明。","不過，我今年學聰明了。我偷偷留了一個，塞進襪子裡，走路時，腳底踩著一小塊紅色的幸福。"],"gj":[{"s":"這份財富平均活不過三十分鐘","t":"誇飾","n":"把拿到紅包後很快被收走說成財富的壽命，誇張又好笑。"},{"s":"從長輩手中遞出時是紅色，到了我手裡是金色，進了媽媽口袋就變成透明","t":"層遞","n":"顏色一路變化，最後變成透明，用幽默寫出紅包消失的過程。"},{"s":"腳底踩著一小塊紅色的幸福","t":"轉化","n":"把紅包的紅色與幸福結合，讓結尾帶著小小得意的畫面。"}],"w":[{"w":"保管","m":"代為看管並保存"},{"w":"財富","m":"有價值的錢財與物資"},{"w":"笑咪咪","m":"眼睛瞇起來微笑的樣子"}],"quiz":[{"q":"「這份財富平均活不過三十分鐘」使用了哪種修辭？","o":["映襯","誇飾","排比"],"a":1,"why":"把紅包很快被收走，誇張說成財富活不過三十分鐘，是誇飾。"},{"q":"結尾作者把紅包塞進襪子裡，暗示了什麼？","o":["準備把紅包送給媽媽","不小心把紅包弄丟了","想偷偷保住一點屬於自己的紅包"],"a":2,"why":"他前面被收走紅包，現在學聰明，留一個藏起來，是幽默的小心機。"}],"title2":"過年的小插曲","hint":"寫一件過年時發生的有趣小事，可以用誇張的方式寫，並加入一段對話。","starters":["過年那幾天，我最緊張的時刻是……","我拿到紅包的下一秒，媽媽……"]},{"title":"接力賽","theme":"運動與團隊","text":["槍聲一響，第一棒衝了出去。操場的紅土被鞋底踢起一小團灰。我站在第三棒的位置，手心全是汗，早已把接棒的動作在腦海裡演練了一百遍。","第二棒彎進來了。他的臉漲紅，嘴巴張得很大，手臂一下一下地甩。我開始跑，伸手向後，等。啪。棒子落進掌心，涼涼的。","我只管往前。風灌進耳朵，看台的聲音變成一片嗡嗡。第四棒的同學已經在前面蹲好，我把棒子遞出去，他轉身就跑，背影越來越小。我彎下腰，雙手撐著膝蓋，喘得說不出話。"],"gj":[{"s":"我開始跑，伸手向後，等。","t":"短句節奏","n":"四個短短的動作接連出現，讀起來像腳步一樣緊湊，把接棒前的緊張感寫了出來。"},{"s":"啪。棒子落進掌心，涼涼的。","t":"摹聲與觸覺","n":"用一個聲音加一種觸感，就寫出交棒完成的瞬間，不必多說心情。"},{"s":"他轉身就跑，背影越來越小","t":"白描","n":"只寫動作和畫面，用背影漸漸變小，帶出速度與目送的心情。"}],"w":[{"w":"漲紅","m":"臉因用力或激動而變得紅通通"},{"w":"嗡嗡","m":"許多聲音混在一起，聽不清楚的樣子"},{"w":"演練","m":"事先反覆練習"}],"quiz":[{"q":"「我」站在第三棒的位置時，為什麼手心全是汗？","o":["緊張，反覆想著接棒的動作","剛跑完一圈，非常疲累","擔心鞋子不合腳而跑不快"],"a":0,"why":"文中說他早已在腦海裡演練接棒一百遍，可見是因緊張而出汗。"},{"q":"「啪。棒子落進掌心，涼涼的。」這句的寫法重點是什麼？","o":["用誇飾強調跑步的速度","用聲音與觸感寫出接棒的瞬間","用譬喻把棒子比成冰塊"],"a":1,"why":"這句沒有比喻或誇張，而是用聲音和觸感直接呈現畫面。"}],"title2":"一次難忘的比賽或合作","hint":"先寫比賽前一刻的動作與身體感覺（心跳、手心、呼吸），再用三、四個短句寫出關鍵動作。","starters":["哨聲一響，我……","那天的操場很安靜，只聽得見……"]},{"title":"球場午後","theme":"運動與團隊","text":["午休鐘一響，籃球場就熱鬧起來。水泥地被太陽曬得發白，籃框的鐵網晃著細細的光。球一下下拍在地上，咚、咚、咚，像誰在敲一面小鼓。","場邊的榕樹投下一圈陰影，幾個同學把書包堆在樹根旁，水壺倒了一地。有人運球，有人搶斷，有人跳起來投籃，球在籃框上轉了兩圈，才慢慢掉進去。","歡呼聲沖上天空，驚起樹上兩隻麻雀。汗水沿著下巴滴在地上，立刻被曬乾，只留下一個淺淺的圓點。"],"gj":[{"s":"咚、咚、咚，像誰在敲一面小鼓","t":"摹聲與譬喻","n":"先用擬聲字寫出聽到的聲音，再用小鼓比喻，讓聲音有了節奏感。"},{"s":"球在籃框上轉了兩圈，才慢慢掉進去","t":"細節描寫","n":"把一顆球的動態寫得很慢，讀者彷彿也屏住呼吸等它進籃。"},{"s":"汗水沿著下巴滴在地上，立刻被曬乾，只留下一個淺淺的圓點。","t":"白描收束","n":"結尾只留一個小畫面，既寫出天氣的熱，也讓餘韻停在場上。"}],"w":[{"w":"搶斷","m":"在對手手中截下球"},{"w":"榕樹","m":"常見的校園大樹，樹蔭寬廣"},{"w":"歡呼聲","m":"眾人高興時發出的呼喊聲"}],"quiz":[{"q":"文中的「搶斷」最可能是什麼意思？","o":["把球投進籃框","阻止對手進入球場","從對手手中把球截下來"],"a":2,"why":"搶斷是防守動作，指把對方控制的球截下來。"},{"q":"「像誰在敲一面小鼓」是用什麼來比喻什麼？","o":["用小鼓比喻同學的歡呼","用小鼓比喻拍球的聲音","用小鼓比喻午休的鐘聲"],"a":1,"why":"前一句寫球拍在地上的咚咚聲，小鼓比喻的就是這個聲音。"}],"title2":"我最愛的運動場所","hint":"選一個你常去的運動場地，依序寫出看到的光線、聽到的聲音、聞到或摸到的東西。","starters":["中午的操場，總是先聽見……","走進體育館的那一刻，……"]},{"title":"教練的哨子","theme":"運動與團隊","text":["我們的游泳教練姓黃，個子不高，皮膚曬得黝黑，脖子上永遠掛著一支銀色哨子。他不愛說話，只愛吹哨。","一聲長哨，下水。兩聲短哨，上岸。他站在池邊，雙手插腰，眼睛像雷達，誰偷懶、誰踢水沒力，他一眼就看穿。我們私下叫他「黃雷達」。","有一次我腳抽筋，身體往下沉了一下。還沒來得及喊，一個影子已經跳進水裡，一把撈住我的肩膀。上岸後他只說了一句：「慢慢呼吸。」後來，他的哨子晾在池邊的欄杆上，滴著水，閃著光。"],"gj":[{"s":"一聲長哨，下水。兩聲短哨，上岸。","t":"對比與節奏","n":"長短哨音對照下水與上岸，句子短而整齊，像哨音本身一樣乾脆。"},{"s":"眼睛像雷達","t":"譬喻","n":"把教練的眼神比成雷達，一個詞就說明他觀察入微，還帶點幽默。"},{"s":"一個影子已經跳進水裡，一把撈住我的肩膀","t":"動作白描","n":"不寫教練的表情，只寫跳、撈兩個動作，就顯出他反應之快與可靠。"}],"w":[{"w":"黝黑","m":"皮膚呈深褐色"},{"w":"偷懶","m":"不肯認真做事"},{"w":"抽筋","m":"肌肉突然痙攣，緊縮疼痛"}],"quiz":[{"q":"學生為什麼私下叫教練「黃雷達」？","o":["他的哨子會發出機器般的聲音","他喜歡用儀器測量大家的成績","他觀察力敏銳，誰偷懶都逃不過他的眼睛"],"a":2,"why":"文中說他眼睛像雷達，誰偷懶、踢水沒力都被看穿，所以得此外號。"},{"q":"這篇文章想表現教練是怎樣的人？","o":["話不多，但關鍵時刻很可靠","嚴格冷淡，從不關心學生","愛開玩笑，上課不太認真"],"a":0,"why":"他不愛說話，卻在學生抽筋時立刻跳下水相救，可見外冷內熱。"}],"title2":"一位讓我印象深刻的老師或教練","hint":"選一個特別的小習慣（口頭禪、動作、道具），再配一件事說明這個人。","starters":["他總是帶著……","大家都說她……，但是有一天……"]},{"title":"暖身三分鐘","theme":"運動與團隊","text":["體育課開始前，老師總要我們先慢跑、拉筋。很多人覺得這是浪費時間，其實暖身是在叫醒身體。","人安靜坐著的時候，肌肉比較緊，關節也不太靈活。慢跑可以讓心跳逐漸加快，血液流得更順，身體跟著熱起來。接著做拉筋和轉動關節，肌肉和關節才比較能適應接下來的動作。","暖身的順序也有訣竅：先動大的，再動小的；先慢，再快。就像冬天發動機車，先讓引擎轉一轉，再催油門。少了這三分鐘，突然衝刺，最容易扭到腳、拉傷肌肉。"],"gj":[{"s":"暖身是在叫醒身體","t":"轉化","n":"把身體寫成一個正在睡覺的人，讓抽象的道理變得親切好懂。"},{"s":"先動大的，再動小的；先慢，再快。","t":"對偶排比","n":"兩組相對的句子工整，讀來有節奏，又能把順序一次記住。"},{"s":"就像冬天發動機車，先讓引擎轉一轉，再催油門","t":"舉例類比","n":"用生活經驗打比方，讓讀者馬上理解暖身為什麼要循序漸進。"}],"w":[{"w":"關節","m":"骨頭與骨頭相連、可活動的部位"},{"w":"訣竅","m":"做事的巧妙方法"},{"w":"衝刺","m":"用盡力氣快速向前跑"}],"quiz":[{"q":"依照文章，暖身的合理順序是什麼？","o":["先動小的，再動大的","先快後慢，讓身體盡早發熱","先動大的、先慢再快"],"a":2,"why":"文中明說「先動大的，再動小的；先慢，再快」。"},{"q":"文中用「發動機車」當例子，用意是什麼？","o":["說明身體要逐漸進入狀態，不能一開始就猛衝","提醒機車需要定期保養","說明冬天不適合做運動"],"a":0,"why":"發動機車要先讓引擎轉動，就像暖身要先讓身體慢慢熱起來。"}],"title2":"我的運動小習慣","hint":"寫出一個你每天或每週固定做的運動習慣，說明做的步驟與做完的感覺。","starters":["我運動前一定會……","以前我總是跳過暖身，直到……"]},{"title":"拔河","theme":"運動與團隊","text":["繩子很粗，粗得像一條沉睡的蟒。我們二十個人排成一列，腳尖抵住地面，雙手握緊。","哨音響起，繩子猛地一抖。我咬著牙往後仰，掌心被磨得發燙。前面的同學喊「一、二」，後面的人跟著喊「一、二」，聲音疊在一起，像一條看不見的線，把我們每個人縫在一起。","我們輸了。最後一下，繩子從手裡滑走，大家跌坐在草地上，有人笑，有人喘，有人躺平看天空。我的手掌紅通通的，卻覺得心裡很滿。天空很藍，雲慢慢飄過去，沒有人想先站起來。"],"gj":[{"s":"粗得像一條沉睡的蟒","t":"譬喻","n":"把繩子比成沉睡的蟒蛇，既寫出粗，又暗示它即將被喚醒的力量。"},{"s":"聲音疊在一起，像一條看不見的線，把我們每個人縫在一起","t":"譬喻與轉化","n":"把聲音寫成可以縫合的線，抽象的團結感一下子有了形狀。"},{"s":"有人笑，有人喘，有人躺平看天空","t":"並列短句","n":"三個『有人』並排，用不同的動作寫出每個人各自的反應，畫面豐富。"}],"w":[{"w":"抵住","m":"用力頂著，不使移動"},{"w":"疊","m":"一層壓著一層"},{"w":"躺平","m":"身體平直地躺下"}],"quiz":[{"q":"這場拔河比賽的結果是什麼？","o":["贏了，大家一起歡呼","輸了，但作者心裡覺得很滿足","輸了，大家互相責怪"],"a":1,"why":"文中直接寫「我們輸了」，卻又說「心裡很滿」。"},{"q":"「像一條看不見的線，把我們每個人縫在一起」想表現什麼？","o":["全隊口號一致，心也連在一起","隊員被繩子綁住無法離開","口號太大聲，聽不清楚"],"a":0,"why":"線與縫都是比喻，說明喊聲讓大家緊密相連。"}],"title2":"一次我們一起完成的事","hint":"寫一件需要全班或全隊一起完成的事，重點放在大家的動作與聲音，不要只寫輸贏。","starters":["大家把手放在一起，……","比賽結束後，我們……"]},{"title":"板凳上的人","theme":"運動與團隊","text":["每支球隊都有人坐在板凳上。比賽時，他們不是投籃的那個，也不是被歡呼的那個。有人說，板凳球員只是來湊人數的。我不這麼認為。","第一，練習時他們是最好的對手。沒有人陪主力球員練防守、練傳球，比賽時就沒有默契。第二，比賽中他們是場邊的眼睛，看得見場上的人看不見的漏洞。第三，隨時準備上場，本身就是一種實力，因為機會來時，不會先通知你。","團隊像一座拱橋，每塊石頭都要頂住旁邊的石頭。少了不起眼的那一塊，整座橋就會垮。下次看球賽，別只盯著得分的人，也看看場邊那排拍手的背影。"],"gj":[{"s":"團隊像一座拱橋，每塊石頭都要頂住旁邊的石頭","t":"譬喻","n":"拱橋的石頭彼此支撐，剛好說明團隊成員缺一不可，比喻貼切。"},{"s":"機會來時，不會先通知你","t":"警句","n":"用簡短的一句話點出『平時就要準備』的道理，讓人印象深刻。"},{"s":"也看看場邊那排拍手的背影","t":"畫面收束","n":"結尾轉成一個具體的畫面，邀請讀者換個角度看球賽。"}],"w":[{"w":"默契","m":"彼此心意相通的配合"},{"w":"漏洞","m":"不周密、容易出錯的地方"},{"w":"不起眼","m":"不引人注意"}],"quiz":[{"q":"本文的主旨最接近下列哪一項？","o":["只有得分的人才是球隊的核心","場邊的球員對球隊同樣重要","板凳球員應該盡快取代主力"],"a":1,"why":"全文從練習、觀察、準備三方面說明板凳球員的價值。"},{"q":"「拱橋」的比喻說明了什麼？","o":["球隊需要有人負責搭建橋梁","主力球員比其他人更重要","每個成員互相支撐，缺一不可"],"a":2,"why":"拱橋靠每塊石頭相互頂住，比喻團隊裡每個人都有作用。"}],"title2":"我在團體中的角色","hint":"寫一個你在班上或社團中不太顯眼、卻很有用的角色，並舉一件具體的事。","starters":["在班上，我負責……","有一次，因為我……，所以……"]},{"title":"躲避球求生記","theme":"運動與團隊","text":["躲避球一開打，我立刻決定當一棵樹。站得直直的，一動也不動，希望敵人以為我是校園綠化的一部分。","可惜樹不會長腿，敵人的球還是朝我飛來。我往左閃，球往左；我往右閃，球竟也往右。「砰」的一聲，球在我背上留下一個熱情的印子。","我被請到場外，和先前出局的同學並排坐著，像一排等著被點名的鵝。場上有人尖叫，有人撲倒。我忽然發現，場外視野最好，還可以大聲指揮。於是，我成了全班最有氣勢的場外教練，雖然沒有人聽。"],"gj":[{"s":"我立刻決定當一棵樹","t":"幽默誇張","n":"想用站著不動來躲球，把荒唐的想法說得一本正經，笑點就出來了。"},{"s":"我往左閃，球往左；我往右閃，球竟也往右","t":"對照節奏","n":"兩組句子結構相同，讀者先預期結果，再被『竟』字輕輕逗笑。"},{"s":"像一排等著被點名的鵝","t":"譬喻","n":"用鵝排排坐的呆樣比喻出局的同學，形象可愛又好笑。"}],"w":[{"w":"出局","m":"被淘汰，不能繼續參加比賽"},{"w":"氣勢","m":"展現出來的力量或威風"},{"w":"指揮","m":"發號施令，帶領別人行動"}],"quiz":[{"q":"「我立刻決定當一棵樹」是什麼意思？","o":["躲到樹後面防守","站著不動，希望不被注意","想把球拍到樹上"],"a":1,"why":"後文說站得直直的、一動也不動，希望敵人把他當成綠化。"},{"q":"作者最後自稱「場外教練」，語氣是什麼？","o":["驕傲，認為自己很專業","不滿，覺得被冷落","自我調侃，帶點幽默"],"a":2,"why":"「雖然沒有人聽」顯示這是自嘲的玩笑話。"}],"title2":"一次尷尬又好笑的運動經驗","hint":"用一點誇張的想像開頭，再老實交代事情的結果，最後可以幫自己下個玩笑式的頭銜。","starters":["我今天的任務是……","沒想到事情會變成這樣：……"]},{"title":"外婆的鐵盒","theme":"時間與回憶","text":["整理房間時，我在抽屜深處翻出一個餅乾鐵盒，蓋子上的圖案已經掉漆，露出銀灰色的鐵。","打開來，裡面有幾顆玻璃彈珠、一張泛黃的車票，還有一個用紅線綁著的小布袋。我忽然想起六歲那年的暑假，外婆坐在老家的門檻上，把這個鐵盒遞給我，說：「裡面都是寶貝，你替我顧著。」那時我嫌它舊，隨手就塞進了抽屜。","現在我把彈珠倒在手心，它們滾來滾去，發出清脆的聲響，像很久以前的笑聲。窗外下起了雨，我把鐵盒蓋上，抱在懷裡坐了很久。"],"gj":[{"s":"我忽然想起六歲那年的暑假","t":"倒敘","n":"從眼前的鐵盒轉進多年前的場景，一句話就把時間拉回過去。"},{"s":"像很久以前的笑聲","t":"譬喻與通感","n":"把彈珠的聲音聯想成笑聲，讓聽覺連上了記憶與情感。"},{"s":"我把鐵盒蓋上，抱在懷裡坐了很久。","t":"動作抒情","n":"不直接說想念，只寫抱著鐵盒坐很久，情感都藏在動作裡。"}],"w":[{"w":"掉漆","m":"表面的漆脫落"},{"w":"泛黃","m":"顏色漸漸變黃"},{"w":"門檻","m":"門下方橫著的木條或石條"}],"quiz":[{"q":"六歲那年，「我」為什麼把鐵盒隨手塞進抽屜？","o":["覺得它很舊，不放在心上","怕被別人搶走","想把它送給別人"],"a":0,"why":"文中寫「那時我嫌它舊」，所以隨手就放進抽屜。"},{"q":"「像很久以前的笑聲」把彈珠聲連結到什麼？","o":["下雨的聲音","外婆生氣的聲音","過去的溫暖回憶"],"a":2,"why":"彈珠聲讓人想起從前的笑聲，帶出對往事的懷念。"}],"title2":"一件讓我想起過去的舊東西","hint":"先寫你發現這件東西的現在，再用倒敘帶出它背後的故事，最後回到現在的動作。","starters":["在書櫃的角落，我找到……","看著它，我想起……"]},{"title":"老街黃昏","theme":"時間與回憶","text":["傍晚五點，老街的燈籠一盞一盞亮起來，紅色的光落在石板路上，像灑了一地的碎糖。","巷口的麵攤冒著白煙，老闆用長筷子攪著鍋裡的麵，蒸氣撲上他的眼鏡，他也不擦。對面的雜貨店門口，一台老電風扇還在慢慢轉，轉得比時間還慢。","我小時候常跟著阿嬤走這條路，她牽著我，我數著石板上的裂縫。現在我自己走過，裂縫還在，只是牽我的手不在身邊。我停了一下，聞到熟悉的滷味香，又繼續往前走。"],"gj":[{"s":"像灑了一地的碎糖","t":"譬喻","n":"把燈光落在石板路上比成碎糖，帶有甜味與溫暖的感覺。"},{"s":"轉得比時間還慢","t":"誇飾","n":"電風扇當然轉得比時間快，這樣說是為了強調老街悠閒的步調。"},{"s":"裂縫還在，只是牽我的手不在身邊","t":"今昔對比","n":"景物沒變、人事已變，一個『只是』輕輕點出了惆悵。"}],"w":[{"w":"燈籠","m":"用紙或布做成的照明用具"},{"w":"蒸氣","m":"水加熱後變成的氣體"},{"w":"石板路","m":"用石板鋪成的道路"}],"quiz":[{"q":"「轉得比時間還慢」想表達什麼？","o":["老街的步調悠閒緩慢","電風扇壞了","時間過得非常快"],"a":0,"why":"這是誇飾，用慢得誇張的電風扇來寫老街的悠閒氣氛。"},{"q":"結尾「只是牽我的手不在身邊」流露怎樣的心情？","o":["憤怒與不滿","懷念中帶著一點感傷","開心與期待"],"a":1,"why":"景物未變而人已不在身旁，是溫柔的懷念與淡淡的感傷。"}],"title2":"一條有故事的路","hint":"寫一條你熟悉的路，先寫現在看到的景物，再用一個景物帶出以前和誰走過。","starters":["放學後，我走過那條……","路邊那家小店，讓我想起……"]},{"title":"畫在桌上的線","theme":"時間與回憶","text":["小學三年級時，我的同桌叫阿宏。他有一個習慣，開學第一天就用鉛筆在桌面中間畫一條線，說：「過線的橡皮擦沒收。」","我們為了這條線吵過很多次。他的手肘常常越界，我的課本也偷偷過去。有一次他的橡皮擦真的被我沒收，他氣得整節課不跟我說話，下課卻默默推來半塊餅乾。","畢業前一天，我們一起把那條線擦掉。橡皮擦一下一下地擦，桌面乾乾淨淨，反而讓人有點捨不得。如今我們念不同的學校，我偶爾經過文具店，還是會停下腳步，想起那半塊餅乾的味道。"],"gj":[{"s":"他的手肘常常越界，我的課本也偷偷過去","t":"對仗","n":"兩人互相越線，句子工整對稱，把孩子氣的小爭執寫得又好笑又可愛。"},{"s":"下課卻默默推來半塊餅乾","t":"細節刻畫","n":"不講和解，只用一個動作表達友情，比說『對不起』更動人。"},{"s":"橡皮擦一下一下地擦，桌面乾乾淨淨，反而讓人有點捨不得","t":"反襯","n":"擦乾淨本是好事，卻讓人捨不得，說明那條線早已是友情的記號。"}],"w":[{"w":"越界","m":"超過界線"},{"w":"沒收","m":"強制收走別人的東西"},{"w":"默默","m":"不說話、不出聲的樣子"}],"quiz":[{"q":"阿宏「默默推來半塊餅乾」說明了什麼？","o":["他嘴上較真，心裡仍把我當朋友","他想用餅乾換回橡皮擦","他不喜歡吃那塊餅乾"],"a":0,"why":"他剛生過氣，卻主動分享食物，可見重視這段友情。"},{"q":"文中「越界」最接近下列哪個意思？","o":["離開座位到別班","超出桌面中間那條線的範圍","在考試時作弊"],"a":1,"why":"文中說手肘與課本越過鉛筆畫的線，就是『越界』。"}],"title2":"一位舊同學或老朋友","hint":"找一個小物件（鉛筆線、紙條、零食）當線索，倒敘你們之間的小故事。","starters":["翻開舊相簿，我看見……","小時候，我和他最常……"]},{"title":"老照片為何褪色","theme":"時間與回憶","text":["翻開家裡的舊相簿，有些照片的顏色已經淡了，天空泛黃，人臉偏灰，像被時間洗過一遍。","照片會褪色，主要是因為它一直在和環境接觸。陽光中的紫外線會慢慢破壞影像的成分，空氣中的濕氣和髒汙也會讓紙面變質。不同的照片使用的材料不同，所以變化的樣子也不一樣，有的泛黃，有的偏色。","想讓照片活得久一點，可以避開陽光直射，放在乾燥、陰涼的地方，用專門的相簿或保存盒收好。手指也別直接亂摸影像面。保存照片，其實就是替回憶多買一點時間。"],"gj":[{"s":"像被時間洗過一遍","t":"譬喻","n":"把時間寫成洗衣服的人，淡去的顏色就像洗過後褪掉的色彩，貼切又新鮮。"},{"s":"有的泛黃，有的偏色","t":"對比舉例","n":"用兩種不同的變化舉例，說明褪色並非只有一種樣子。"},{"s":"保存照片，其實就是替回憶多買一點時間","t":"轉化","n":"把時間寫成可以購買的東西，替說明文收出一點抒情的餘味。"}],"w":[{"w":"紫外線","m":"陽光中看不見的一種光線"},{"w":"濕氣","m":"空氣中的水分"},{"w":"變質","m":"性質發生改變，常指變壞"}],"quiz":[{"q":"依文章，想讓照片保存得久，應該怎麼做？","o":["擺在窗邊多曬太陽","用手多摸，保持乾淨","放在乾燥陰涼處，避開陽光直射"],"a":2,"why":"文中建議避開直射陽光，放在乾燥陰涼的地方，並用專門的保存盒。"},{"q":"「替回憶多買一點時間」的意思是什麼？","o":["照片可以拿去賣錢","好好保存照片，就能讓回憶留得更久","花錢才能買到時間"],"a":1,"why":"這是以買東西作比喻，說明保存照片能延長回憶的壽命。"}],"title2":"一張我最想保存的照片","hint":"描述一張照片裡的人、景與光線，再倒敘拍下它那一天發生的事。","starters":["這張照片拍在……","相紙上的笑容，讓我想起……"]},{"title":"回家的區間車","theme":"時間與回憶","text":["此刻我坐在回家的區間車上，窗外的稻田一格一格往後退，天色漸漸暗了。","我想起小時候，每年過年都搭這班車。媽媽把我抱在腿上，爸爸提著大包小包，車廂裡有橘子的味道。我趴在窗邊數電線桿，數到一百就睡著，醒來時已經到站，月台上有人在揮手。","現在我自己拿著車票，一個人坐在窗邊。車廂很安靜，窗玻璃映出我的臉，和當年那個數電線桿的小孩，好像沒有差很多。火車進站，我拎起背包，月台上，有人正在揮手。"],"gj":[{"s":"窗外的稻田一格一格往後退","t":"動態描寫","n":"把車行的速度化成稻田一格一格退去，用景物的變化表現時間流逝。"},{"s":"我趴在窗邊數電線桿，數到一百就睡著","t":"細節與倒敘","n":"小孩的天真舉動很具體，也讓讀者看見舊日的溫暖。"},{"s":"月台上，有人正在揮手。","t":"首尾呼應","n":"與前面回憶中的月台畫面相互呼應，讓過去與現在在同一個場景重疊。"}],"w":[{"w":"區間車","m":"在各小站都停靠的火車"},{"w":"電線桿","m":"架設電線的長柱子"},{"w":"月台","m":"車站供旅客上下車的平台"}],"quiz":[{"q":"「窗外的稻田一格一格往後退」寫出了什麼現象？","o":["稻田真的被移走","火車正在倒退","火車前進時，窗外景物看起來向後移動"],"a":2,"why":"這是搭乘交通工具時常見的視覺感受，景物看似後退。"},{"q":"文末再次寫「月台上有人在揮手」，作用是什麼？","o":["呼應前文，讓過去與現在重疊","說明火車誤點","表示作者不認識那個人"],"a":0,"why":"前面回憶裡已有揮手的人，結尾重現，形成首尾呼應。"}],"title2":"一趟難忘的旅程","hint":"以現在在路上的場景開頭，中段倒敘小時候的同一條路，結尾回到現在。","starters":["車子慢慢開動，……","每次經過這裡，我就想起……"]},{"title":"懷舊的好處","theme":"時間與回憶","text":["有人說，總是回頭看的人走不遠。我卻覺得，偶爾回頭看看，不但無妨，還有好處。","回憶像一盞放在背包裡的小燈。心情低落時，想起考試前一起背書的朋友、下雨天分食的一包鹽酥雞，心裡就會暖一點。而且回頭看看，我們才發現自己走過多遠，原來去年不敢上台的人，今天已經能完整報告。","當然，不能一直停在原地。就像騎車，偶爾看後照鏡確認安全，眼睛還是得望著前方。懷舊是為了走得更穩，而不是為了不再前進。"],"gj":[{"s":"回憶像一盞放在背包裡的小燈","t":"譬喻","n":"把回憶比成隨身的小燈，說明它能在低潮時帶來光亮與溫暖。"},{"s":"原來去年不敢上台的人，今天已經能完整報告","t":"今昔對比","n":"拿自己的進步當例子，比講大道理更有說服力。"},{"s":"偶爾看後照鏡確認安全，眼睛還是得望著前方","t":"類比","n":"用騎車的經驗說明回顧與前進要保持平衡，淺顯易懂。"}],"w":[{"w":"無妨","m":"沒有關係，不要緊"},{"w":"低落","m":"情緒不高、精神不振"},{"w":"後照鏡","m":"車子上用來看後方的鏡子"}],"quiz":[{"q":"本文的主旨最接近下列何者？","o":["人應該活在過去，不必往前","回憶沒有任何用處","偶爾回顧有益，但目標仍是向前"],"a":2,"why":"作者先肯定懷舊的好處，結尾又提醒要往前，所以重點是平衡。"},{"q":"用「後照鏡」作比喻，目的是什麼？","o":["說明回頭看與向前看都需要","提醒騎車要注意安全","比較不同車子的設備"],"a":0,"why":"後照鏡是偶爾看的，眼睛還是要望向前方，對應回顧與前進的平衡。"}],"title2":"回憶帶給我的力量","hint":"寫一段會讓你心情變好的回憶，並說明它在什麼時候特別有用。","starters":["每當我覺得很累，就會想起……","如果回憶是一樣東西，它像……"]},{"title":"手機相簿考古","theme":"時間與回憶","text":["上週我決定整理手機相簿，結果一不小心，就變成了一場考古。往下滑，滑到三年前，出現一張照片：我，頂著鍋蓋頭，笑得像剛中了樂透。","再往下滑，更驚人。六年級的我穿著畢業旅行的紀念衣，比著耶，背後的同學正在挖鼻孔。我立刻截圖傳給他，附註：「這是你的歷史名場面。」他回了三個字：「你也是。」","我們隔著螢幕笑了很久。最後相簿沒整理成，手機容量依舊爆滿，我只好把四十張一模一樣的便當照，含淚刪掉三十九張。"],"gj":[{"s":"變成了一場考古","t":"轉化比喻","n":"把翻舊照片比成挖掘古物，既點出年代久遠，也帶有自嘲的幽默。"},{"s":"笑得像剛中了樂透","t":"譬喻誇飾","n":"用中樂透形容笑容，誇張地寫出當時的得意傻氣。"},{"s":"含淚刪掉三十九張","t":"誇飾","n":"只刪掉三十九張卻要含淚，捨不得的心情說得好笑又真實。"}],"w":[{"w":"鍋蓋頭","m":"瀏海齊平、像扣著鍋蓋的髮型"},{"w":"截圖","m":"把螢幕畫面存成圖片"},{"w":"爆滿","m":"擠得滿滿的，容納不下"}],"quiz":[{"q":"「變成了一場考古」是什麼意思？","o":["作者真的去挖掘古蹟","翻看舊照片像挖掘古物，帶有幽默","手機壞了，需要修理"],"a":1,"why":"這是比喻，把翻找多年前的照片比作考古。"},{"q":"最後作者為什麼要把便當照「含淚」刪掉？","o":["照片太多卻捨不得，有點誇張地自嘲","便當照拍得很差","老師要求刪除"],"a":0,"why":"四十張一模一樣只留一張，捨不得刪卻不得不刪，是幽默的說法。"}],"title2":"一次翻舊物的發現","hint":"用輕鬆的語氣寫你翻出舊照片、舊作業或舊日記的過程，最後留一個好笑的結尾。","starters":["本來只想整理，沒想到……","翻到這一張，我整個人愣住了："]},{"title":"整理書包","theme":"學期回顧","text":["期末前一晚，我決定把書包徹底清空。拉鍊一開，一堆東西滾了出來：揉皺的考卷、斷成兩截的鉛筆、一包不知道放了多久的餅乾。","我一件一件拿出來。九月發的課表邊角已經捲起來，十月的聯絡簿夾著一張小紙條，是同桌寫的「別睡了，老師在看」。我看著笑了，原來這學期，我被提醒過這麼多次。","書包終於空了，我把該留的放回去，只留下那張小紙條。拉鍊一拉，輕輕的一聲，像替這學期蓋上了章。"],"gj":[{"s":"揉皺的考卷、斷成兩截的鉛筆、一包不知道放了多久的餅乾","t":"列舉","n":"三樣東西各有故事，用列舉就把一學期的雜亂與忙碌都擺在眼前。"},{"s":"原來這學期，我被提醒過這麼多次","t":"自我反思","n":"輕輕一句帶笑自嘲，既有同學情，也有成長的自覺。"},{"s":"拉鍊一拉，輕輕的一聲，像替這學期蓋上了章","t":"首尾呼應與譬喻","n":"與開頭『拉鍊一開』相呼應，又把關上書包比成蓋章，替整學期畫下句點。"}],"w":[{"w":"聯絡簿","m":"老師與家長聯繫的小本子"},{"w":"揉皺","m":"用手搓揉而起皺紋"},{"w":"課表","m":"列出每日課程的表格"}],"quiz":[{"q":"「我」為什麼只留下那張小紙條？","o":["它是考試的重點整理","它記錄了同學的提醒與關心","它是老師寫的獎狀"],"a":1,"why":"紙條是同桌寫的提醒，讓作者看了會笑，顯示它有紀念意義。"},{"q":"開頭「拉鍊一開」與結尾「拉鍊一拉」有什麼作用？","o":["說明書包的拉鍊壞了","比較兩個書包的差別","前後呼應，表現學期的開始與結束"],"a":2,"why":"開與拉的動作首尾相扣，使文章結構完整，也點出收尾的主題。"}],"title2":"我的書包裡的故事","hint":"列出書包裡三樣東西，各用一句話說明它背後的小故事，最後用一個動作收尾。","starters":["打開書包，我先看到……","這個學期留在我書包裡的，是……"]},{"title":"教室黑板","theme":"學期回顧","text":["放學後的教室很安靜，只剩下黑板還醒著。上面的粉筆字沒擦乾淨，一道數學公式的尾巴拖在角落，像一隻不肯回家的小蟲。","夕陽從窗口斜斜地照進來，粉筆灰在光裡慢慢飄，一粒一粒，像細小的雪。講台上的板擦躺著，邊緣磨得發白。這學期它擦掉多少錯誤的答案，沒有人算過。","值日生拿起板擦，從左到右，一下一下擦過去。字消失了，黑板重新變得深綠、乾淨，安安靜靜地等著明天。"],"gj":[{"s":"只剩下黑板還醒著","t":"擬人","n":"用『醒著』寫黑板，讓空教室有了生命，也點出放學後的寂靜。"},{"s":"粉筆灰在光裡慢慢飄，一粒一粒，像細小的雪","t":"譬喻","n":"把粉筆灰比成雪，讓平常的灰塵變得輕盈美麗。"},{"s":"這學期它擦掉多少錯誤的答案，沒有人算過","t":"含蓄點題","n":"不直接講學習的過程，只說板擦擦掉了多少錯誤，讓人體會一學期的練習。"}],"w":[{"w":"粉筆灰","m":"粉筆書寫時掉下的細粉"},{"w":"板擦","m":"擦黑板用的工具"},{"w":"值日生","m":"輪流負責打掃的學生"}],"quiz":[{"q":"「只剩下黑板還醒著」使用了什麼手法？","o":["譬喻","擬人","誇飾"],"a":1,"why":"把黑板寫成會醒著的人，是擬人（轉化）。"},{"q":"結尾黑板被擦乾淨，「等著明天」，暗示什麼？","o":["學校即將關閉","黑板需要換新","學習日復一日，一個階段結束也是下個階段的開始"],"a":2,"why":"擦淨之後等著被寫滿，象徵結束後的新開始。"}],"title2":"放學後的教室","hint":"選教室裡的一樣東西，寫它在放學後的樣子，並讓它在結尾回到開頭的畫面。","starters":["最後一個同學離開後，教室……","陽光爬上課桌的時候，……"]},{"title":"畢業班的背影","theme":"學期回顧","text":["每天早上升旗，我都會看見三年級的學長姐站在隊伍最前面。他們的背影都很高、很直，制服洗得發白，領口卻整整齊齊。","有一位學姐，我不知道她的名字，只記得她的馬尾總是紮得很高，走路帶風。她每天都最早到校，在走廊盡頭背英文單字，嘴唇輕輕動，像在跟空氣講悄悄話。我經過時，她會抬頭點個頭，又低下頭去。","期末那天，我又看見她的背影，走在夕陽裡，馬尾一晃一晃。明年這個時候，會不會也有人在後面看著我的背影？我加快腳步，把自己的背影挺直了一點。"],"gj":[{"s":"他們的背影都很高、很直，制服洗得發白，領口卻整整齊齊","t":"對比","n":"洗得發白與整整齊齊並列，用小細節寫出學長姐的樸實與自律。"},{"s":"像在跟空氣講悄悄話","t":"譬喻","n":"把背單字比成對空氣說話，畫面可愛，又顯出她專心的樣子。"},{"s":"我加快腳步，把自己的背影挺直了一點。","t":"首尾呼應與動作","n":"以背影收尾，呼應開頭，也用挺直的動作寫出受到啟發。"}],"w":[{"w":"升旗","m":"升起國旗的儀式"},{"w":"領口","m":"衣服圍著脖子的部分"},{"w":"單字","m":"語言中獨立的詞"}],"quiz":[{"q":"學姐每天早到校，通常在做什麼？","o":["在走廊盡頭背英文單字","在操場練習跑步","在教室裡整理桌椅"],"a":0,"why":"文中說她最早到校，在走廊盡頭背英文單字。"},{"q":"結尾「把自己的背影挺直了一點」表示什麼？","o":["想趕快超越學姐","覺得背影不重要","受到學姐啟發，也想成為別人的榜樣"],"a":2,"why":"他想到明年也會有人看著自己，因此用挺直的動作表示自我期許。"}],"title2":"我欣賞的一位學長姐","hint":"寫一個你觀察過的人，描寫他的背影、動作與習慣，並說明你學到了什麼。","starters":["我常在走廊遇見……","從背影看去，他……"]},{"title":"成績單怎麼看","theme":"學期回顧","text":["期末拿到成績單，大家第一眼多半先找總平均。不過，一張成績單其實可以讀出更多東西。","首先看各科的分數，找出自己比較穩定和比較吃力的科目。其次看各次考試的變化，如果數字一路往上，代表方法有效；如果忽高忽低，可能是準備不夠均勻。最後看老師的評語，那裡常藏著分數看不見的提醒，像是上課專心、作業認真，或是需要多練習表達。","看完之後，不妨選一個最想進步的科目，訂一個小目標，例如每週多寫一份練習。這樣，成績單就不只是結算，也成了下學期的地圖。"],"gj":[{"s":"不過，一張成績單其實可以讀出更多東西","t":"轉折引題","n":"用『不過』轉開大家的習慣，先拋出新觀點，帶著讀者往下看。"},{"s":"那裡常藏著分數看不見的提醒","t":"轉化","n":"把評語寫成藏著東西的地方，使它變得值得細讀。"},{"s":"成績單就不只是結算，也成了下學期的地圖","t":"譬喻與點題","n":"把成績單比成地圖，與開頭呼應，並指出它的真正用途是指引方向。"}],"w":[{"w":"吃力","m":"費力，不輕鬆"},{"w":"評語","m":"對人或事所下的評論"},{"w":"結算","m":"把一段時間的成果算清楚"}],"quiz":[{"q":"依文章，分數忽高忽低可能表示什麼？","o":["準備不夠均勻","老師出題不公平","運氣太差"],"a":0,"why":"文中直接說忽高忽低「可能是準備不夠均勻」。"},{"q":"文中的「結算」，意思最接近什麼？","o":["重新開始計算","對一段時間的結果做總結","預先計畫未來"],"a":1,"why":"『不只是結算』指成績單不只是總結過去，還可以指向未來。"}],"title2":"我想給自己的學期小目標","hint":"寫出一個具體、一週內做得到的小目標，並說明你打算怎麼檢查有沒有做到。","starters":["這學期我最想進步的是……","看完成績單後，我決定……"]},{"title":"分數之外","theme":"學期回顧","text":["期末考結束，教室裡有人歡呼，有人沉默。分數發下來，我們很容易把它看成自己的全部。","但分數只是一把尺，量的是某一天、某一份考卷上的表現。它量不出你這學期為了背單字熬過幾個晚上，量不出你在運動會替同學遞過幾瓶水，也量不出你在朋友難過時，默默坐在旁邊的那十分鐘。","這並不是說分數不重要，它能提醒我們哪裡該補強。只是別讓一把尺，決定你是誰。鐘聲響起，我把考卷折好，收進書包，也把那些量不出來的東西，一起帶走。"],"gj":[{"s":"但分數只是一把尺","t":"譬喻","n":"把分數比成尺，指出它只能量出一部分，觀點清楚。"},{"s":"它量不出你這學期為了背單字熬過幾個晚上，量不出你在運動會替同學遞過幾瓶水","t":"排比","n":"重複『量不出』，用具體的小事列舉，讓人感受到分數之外的價值。"},{"s":"只是別讓一把尺，決定你是誰","t":"點題","n":"呼應前面的尺，一句話收回主旨，並提醒讀者不要被分數定義。"}],"w":[{"w":"沉默","m":"不說話"},{"w":"熬","m":"勉強忍受、支撐"},{"w":"補強","m":"補足不足的地方"}],"quiz":[{"q":"「分數只是一把尺」的比喻用意是什麼？","o":["分數只能量出部分表現，不是全部","分數像尺一樣可以拿來打人","分數越長越好"],"a":0,"why":"尺只能量出長度，比喻分數只能衡量一部分的能力。"},{"q":"作者對分數的態度是什麼？","o":["分數完全沒有意義","分數有用，但不能代表全部的你","只有分數才重要"],"a":1,"why":"作者說分數能提醒補強，也強調別讓它決定你是誰，態度是平衡的。"}],"title2":"成績之外的我","hint":"寫三件分數量不出來、但你很得意的事，每件用一句具體的畫面說明。","starters":["如果有一把能量出善意的尺，……","這學期我最想被看見的是……"]},{"title":"期末大掃除","theme":"學期回顧","text":["期末最後一週，學校宣布大掃除。這時才知道，教室的每個角落都藏著驚喜：抽屜裡有一顆已經長毛的橘子，置物櫃裡有一個失蹤三個月的便當盒。","我分到擦窗戶，拿著報紙猛擦，結果越擦越花，窗戶像在對我做鬼臉。旁邊的阿傑負責掃地，他把掃把當吉他，邊掃邊唱，灰塵跟著節拍一起跳舞。","老師巡視一圈，只說了一句：「很好，明天再來一次。」全班發出哀號。我低頭看看自己黑掉的雙手，覺得這學期最大的成就，大概就是學會把一顆長毛橘子，勇敢地丟進垃圾桶。"],"gj":[{"s":"窗戶像在對我做鬼臉","t":"擬人與譬喻","n":"越擦越花的窗戶被寫成會做鬼臉的人，把失敗寫得俏皮。"},{"s":"灰塵跟著節拍一起跳舞","t":"擬人","n":"灰塵因掃地而飛揚，被想像成跟著音樂跳舞，畫面歡樂。"},{"s":"學會把一顆長毛橘子，勇敢地丟進垃圾桶","t":"反諷收束","n":"把日常小事說成最大的成就，用誇張的口吻製造笑點，也與開頭的橘子呼應。"}],"w":[{"w":"置物櫃","m":"存放個人物品的櫃子"},{"w":"巡視","m":"到各處查看"},{"w":"哀號","m":"大聲悲嘆"}],"quiz":[{"q":"全班聽到老師說「明天再來一次」為什麼哀號？","o":["因為老師要考試","因為明天放假","因為又要再大掃除一次"],"a":2,"why":"老師說明天再來一次，也就是要再掃一次，大家才會哀號。"},{"q":"「灰塵跟著節拍一起跳舞」用了什麼手法？","o":["排比，加強語氣","擬人，讓場面更歡樂","設問，引起思考"],"a":1,"why":"灰塵本不會跳舞，作者把它寫成像人一樣，是擬人。"}],"title2":"一次大家一起打掃的經驗","hint":"用輕鬆的語氣寫出打掃時發現的『寶物』，結尾回到這個寶物。","starters":["我們班的角落裡藏著……","老師一聲令下，……"]},{"title":"寫給下學期的我","theme":"學期回顧","text":["親愛的下學期的我：你收到這封信的時候，大概正站在新學期的校門口，書包比現在輕一點，心情卻可能比較重。","我想先告訴你，這學期的你其實很不錯。你第一次在課堂上舉手，聲音抖得像風中的樹葉；你在體育課跌倒，爬起來繼續跑；你也學會了在睡前，把明天要帶的東西放進書包。這些事都很小，卻是你一格一格走出來的。","如果下學期遇到難題，就想想今天這個安靜的下午：窗外有麻雀的叫聲，桌上有一杯涼掉的麥茶，你剛寫完這封信，覺得未來還很長。","好了，鐘聲快響了。我把信紙摺成四折，放進書包最裡面的夾層。下學期的我，我們開學見。"],"gj":[{"s":"聲音抖得像風中的樹葉","t":"譬喻","n":"用樹葉的顫抖比喻緊張的聲音，把害羞寫得具體可感。"},{"s":"桌上有一杯涼掉的麥茶","t":"細節描寫","n":"一個小物件就讓安靜的下午有了溫度，也能在未來成為回想的線索。"},{"s":"我把信紙摺成四折，放進書包最裡面的夾層。","t":"動作收束","n":"以收信的動作作結，把心意妥善放好，與『書包』的意象相扣。"}],"w":[{"w":"夾層","m":"物品中間隔出的空間"},{"w":"麥茶","m":"用烘焙過的大麥泡成的茶"},{"w":"校門口","m":"學校的入口處"}],"quiz":[{"q":"信中為什麼列舉「舉手、跌倒再爬起來、整理書包」等小事？","o":["抱怨學期太辛苦","向別人炫耀成績","肯定自己的進步與努力"],"a":2,"why":"這些都是作者在這學期的小小成長，信中以此鼓勵未來的自己。"},{"q":"開頭稱呼與結尾「我們開學見」有什麼關係？","o":["前後呼應，以對話的口吻完整收束","前後矛盾","只是重複，沒有意義"],"a":0,"why":"開頭呼喚『下學期的我』，結尾又向他約定見面，形成首尾呼應。"}],"title2":"寫給下學期的我","hint":"列出三件這學期做得不錯的小事，再給下學期的自己一個具體的叮嚀。","starters":["親愛的下學期的我，……","如果你覺得累了，就想想……"]}];

const N=ARTICLES.length, KEY='daily-reading-v2', GOAL=100, MIMIC_MIN=8, WD='日一二三四五六';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ord=k=>{const p=k.split('-').map(Number);return Math.floor(Date.UTC(p[0],p[1]-1,p[2])/864e5)};
const addDays=(k,n)=>{const p=k.split('-').map(Number);return keyOf(new Date(p[0],p[1]-1,p[2]+n))};
const dateOf=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const cnt=s=>(s||'').replace(/\s/g,'').length;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod=(a,b)=>((a%b)+b)%b;

function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object'&&o.days)return o}}catch(e){}return {start:null,days:{}}}
let st=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const todayK=keyOf(new Date());
let view=todayK, tab='today';
const homeK=()=>st.start&&ord(todayK)<ord(st.start)?st.start:todayK;

const artOf=k=>{const r=st.days[k]; if(r&&r.art!=null&&ARTICLES[r.art]) return r.art; return mod(ord(k)-ord(st.start),N)};
const peek=k=>st.days[k]||{read:false,quiz:{},mimic:'',essay:''};
const day=k=>st.days[k]||(st.days[k]={art:artOf(k),read:false,quiz:{},mimic:'',essay:''});
function parts(k){
  const d=peek(k), a=ARTICLES[artOf(k)];
  return {read:!!d.read, quiz:a.quiz.every((_,i)=>d.quiz[i]!==undefined), mimic:cnt(d.mimic)>=MIMIC_MIN, essay:cnt(d.essay)>=GOAL};
}
const isDone=k=>{const p=parts(k);return p.read&&p.quiz&&p.mimic&&p.essay};
const doneCount=k=>{const p=parts(k);return (p.read?1:0)+(p.quiz?1:0)+(p.mimic?1:0)+(p.essay?1:0)};
function streak(){
  let c=0, k=todayK;
  if(!isDone(k)) k=addDays(k,-1);
  while(ord(k)>=ord(st.start) && isDone(k)){c++; k=addDays(k,-1)}
  return c;
}

/* 上方資訊（打字時只更新這裡，不會動到輸入框） */
function chrome(){
  if(!st.start){ $('streak').innerHTML=''; $('dateline').textContent='開始前先設定開學日'; return; }
  const n=streak();
  $('streak').innerHTML = n>0 ? '<b>'+n+'</b><span>天連續完成</span>' : '<span>今天完成就是第一天</span>';
  const dv=dateOf(view), nn=ord(view)-ord(st.start);
  const pos = nn>=N ? '第'+(Math.floor(nn/N)+1)+'輪複習' : '第'+(nn+1)+'天／共'+N+'天';
  $('dateline').textContent='民國'+(dv.getFullYear()-1911)+'年'+(dv.getMonth()+1)+'月'+dv.getDate()+'日　週'+WD[dv.getDay()]+'　'+pos;
  if(tab!=='today') return;
  let w='';
  for(let i=6;i>=0;i--){
    const k=addDays(todayK,-i), d=dateOf(k), off=ord(k)<ord(st.start);
    w+='<button class="day'+(k===todayK?' today':'')+'" data-k="'+k+'" aria-pressed="'+(k===view)+'"'+(off?' disabled':'')+' aria-label="'+(d.getMonth()+1)+'月'+d.getDate()+'日'+(isDone(k)?'，已完成':'')+'"><span>'+WD[d.getDay()]+'</span><b>'+d.getDate()+'</b><i>'+(!off&&isDone(k)?'✓':'')+'</i></button>';
  }
  $('week').innerHTML=w;
  const p=parts(view);
  const defs=[['s-read','讀文章',p.read],['s-quiz','小測驗',p.quiz],['s-mimic','仿寫佳句',p.mimic],['s-essay','小作文',p.essay]];
  $('steps').innerHTML=defs.map((x,i)=>'<li style="display:contents"><button class="step'+(x[2]?' ok':'')+'" data-go="'+x[0]+'"><span class="dot">'+(x[2]?'✓':(i+1))+'</span>'+x[1]+'</button></li>').join('')
    + (isDone(view)?'<span class="stamp">今日完成</span>':'');
}

function quizHTML(a,d){
  return a.quiz.map((q,i)=>{
    const pick=d.quiz[i], answered=pick!==undefined;
    const opts=q.o.map((t,j)=>{
      let c='opt'; if(answered){ if(j===q.a)c+=' right'; else if(j===pick)c+=' wrong'; }
      return '<button class="'+c+'" data-q="'+i+'" data-o="'+j+'"'+(answered?' disabled':'')+'>'+'ABC'[j]+'．'+t+'</button>';
    }).join('');
    const why=answered?'<p class="why"><b>'+(pick===q.a?'答對了。':'再想想。')+'</b>'+q.why+'</p>':'';
    return '<div class="q"><p class="qt">'+(i+1)+'. '+q.q+'</p><div class="opts">'+opts+'</div>'+why+'</div>';
  }).join('') + (Object.keys(d.quiz).length?'<button class="link" data-act="resetquiz">重新作答</button>':'');
}

function renderToday(){
  const idx=artOf(view), a=ARTICLES[idx], d=peek(view), wk=Math.min(WEEKS.length-1,Math.floor(idx/7));
  const total=a.text.join('').length, g=a.gj[mod(ord(view)-ord(st.start),3)];
  const paras=a.text.map(p=>{
    let h=p; a.gj.forEach(x=>{ if(h.indexOf(x.s)>-1) h=h.replace(x.s,'<mark>'+x.s+'</mark>'); });
    return '<p>'+h+'</p>';
  }).join('');
  const gj=a.gj.map(x=>'<div class="gj"><span class="tag">'+x.t+'</span><q>'+x.s+'</q><p>'+x.n+'</p></div>').join('');
  const words=a.w.map(x=>'<dt>'+x.w+'</dt><dd>'+x.m+'</dd>').join('');
  $('view').innerHTML=
  '<nav class="week" id="week" aria-label="最近七天"></nav>'+
  '<ol class="steps" id="steps" aria-label="今天的四個步驟"></ol>'+
  '<section class="sheet" id="s-read">'+
    '<p class="eyebrow">第'+(wk+1)+'週　·　'+a.theme+'　·　'+total+'字</p>'+
    '<h2>'+a.title+'</h2><p class="tech">本週手法：'+WEEKS[wk][1]+'</p><div class="text">'+paras+'</div>'+
    '<label class="check"><input type="checkbox" id="readbox"> 我讀完了，黃色底線是值得學的句子</label>'+
  '</section>'+
  '<section class="block" id="s-notes"><p class="eyebrow">讀完再看</p><h3>佳句與好詞</h3>'+
    '<div>'+gj+'</div><dl class="words">'+words+'</dl></section>'+
  '<section class="block" id="s-quiz"><p class="eyebrow">步驟 2／4</p><h3>小測驗</h3><div class="block" id="quiz"></div></section>'+
  '<section class="block" id="s-mimic"><p class="eyebrow">步驟 3／4</p><h3>仿寫佳句</h3>'+
    '<p class="lead">用「'+g.t+'」的手法，寫一句你今天看到、聽到或想到的事。至少'+MIMIC_MIN+'個字。</p>'+
    '<p class="ex">'+g.s+'<small>範例：'+g.t+'</small></p>'+
    '<textarea id="mimic" rows="2" aria-label="仿寫一句" placeholder="寫在這裡"></textarea></section>'+
  '<section class="block" id="s-essay"><p class="eyebrow">步驟 4／4</p><h3>小作文：'+a.title2+'</h3>'+
    '<p class="lead">'+a.hint+'</p>'+
    '<div class="chips"><span class="lead">不知道怎麼開頭？</span>'+a.starters.map(s=>'<button class="chip" data-start="'+esc(s)+'">'+s+'</button>').join('')+'</div>'+
    '<textarea id="essay" rows="8" aria-label="小作文" placeholder="寫在這裡，至少'+GOAL+'字"></textarea>'+
    '<div class="meter"><span><span id="cnt">0</span>／'+GOAL+'字</span><div class="bar" id="bar"><i id="fill"></i></div></div>'+
    '<fieldset class="self"><legend>寫完自己檢查</legend>'+
      '<label><input type="checkbox">有一個看得見、聽得見或摸得到的細節</label>'+
      '<label><input type="checkbox">用到了今天學的一種手法</label>'+
      '<label><input type="checkbox">結尾有一句自己的感受或想法</label>'+
    '</fieldset></section>';
  $('readbox').checked=!!d.read;
  $('mimic').value=d.mimic||'';
  $('essay').value=d.essay||'';
  $('quiz').innerHTML=quizHTML(a,d);
  meter();
}
function meter(){
  const n=cnt($('essay').value);
  $('cnt').textContent=n;
  $('fill').style.width=Math.min(100,n/GOAL*100)+'%';
  $('bar').classList.toggle('full',n>=GOAL);
}

function renderTerm(){
  const t=ord(todayK), s=ord(st.start), curW=Math.floor((t-s)/7);
  let h='<section class="block"><p class="eyebrow">共'+N+'天，每週一個主題</p><h3>學期地圖</h3>'+
        '<p class="lead">綠色是四項都完成，黃色是做了一部分。點日期可以回去補讀。</p></section><div class="weeks">';
  for(let w=0;w<WEEKS.length;w++){
    let pips='';
    for(let i=0;i<7;i++){
      const n=w*7+i, k=addDays(st.start,n), future=ord(k)>t;
      const c=future?0:doneCount(k), cl=c===4?' done':(c>0?' part':'');
      pips+='<button class="pip'+cl+'" data-k="'+k+'"'+(future?' disabled':'')+' aria-label="第'+(w+1)+'週第'+(i+1)+'天'+(c===4?'，已完成':'')+'">'+(c===4?'✓':(i+1))+'</button>';
    }
    h+='<div class="wk'+(w===curW?' now':'')+'"><div class="wkh"><b>第'+(w+1)+'週</b><span>'+WEEKS[w][0]+'</span></div><p class="tech">手法：'+WEEKS[w][1]+'</p><div class="dots">'+pips+'</div></div>';
  }
  h+='</div>'+
  '<section class="panel"><h3>開學日</h3><p class="lead">文章從開學日當天開始，依序一天一篇。改開學日後，已寫的紀錄會保留在原本的日期。</p>'+
    '<div class="row"><input type="date" id="startdate" value="'+st.start+'" aria-label="開學日"><button class="btn ghost" data-act="setstart">更改</button></div></section>'+
  '<section class="panel"><h3>備份進度</h3><p class="lead">進度只存在這支手機的這個程式裡。換手機前，先按「備份」把文字存起來，到新手機貼上再按「還原」。</p>'+
    '<div class="row"><button class="btn ghost" data-act="backup">備份</button><button class="btn ghost" data-act="restore">還原</button></div>'+
    '<textarea class="code" id="code" rows="4" aria-label="進度備份文字" spellcheck="false"></textarea><p class="msg" id="msg" role="status"></p></section>';
  $('view').innerHTML=h;
}

function renderWorks(){
  const ks=Object.keys(st.days).filter(k=>cnt(st.days[k].essay)>0).sort().reverse();
  if(!ks.length){ $('view').innerHTML='<section class="block"><p class="eyebrow">你寫過的文章</p><h3>我的作品</h3></section><p class="empty">還沒有作品。到「今天」寫完小作文，就會收在這裡。</p>'; return; }
  $('view').innerHTML='<section class="block"><p class="eyebrow">共'+ks.length+'篇</p><h3>我的作品</h3></section>'+
   ks.map(k=>{
     const a=ARTICLES[artOf(k)], d=dateOf(k), e=st.days[k].essay;
     return '<article class="work"><h4>'+a.title2+'</h4><p class="meta">'+(d.getMonth()+1)+'月'+d.getDate()+'日　·　讀「'+a.title+'」　·　'+cnt(e)+'字</p>'+
       '<p class="body">'+esc(e)+'</p><div class="row"><button class="link" data-copy="'+k+'">複製全文</button><button class="link" data-k="'+k+'">回到這一天</button></div></article>';
   }).join('');
}

function renderWelcome(){
  $('tabbar').hidden=true;
  $('view').innerHTML='<section class="hello"><h2>每天十五分鐘，一個學期讀寫'+N+'篇</h2>'+
   '<p class="lead">每天一篇約兩百字的短文，共'+WEEKS.length+'週，每週一個主題和一種寫作手法。每天做四件事：</p>'+
   '<ol><li>讀文章，看黃色底線的佳句</li><li>做兩題小測驗</li><li>仿寫一句</li><li>寫一篇一百字的小作文</li></ol>'+
   '<div class="panel"><h3>你的開學日是哪一天？</h3><p class="lead">文章從這一天開始排。今天開始也可以。</p>'+
   '<div class="row"><input type="date" id="startdate" value="'+todayK+'" aria-label="開學日"><button class="btn" data-act="begin">開始</button></div></div></section>';
}

function render(){
  if(!st.start){ renderWelcome(); chrome(); return; }
  $('tabbar').hidden=false;
  document.querySelectorAll('#tabbar button').forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(tab==='today') renderToday(); else if(tab==='term') renderTerm(); else renderWorks();
  chrome();
}
function go(t,k){ tab=t; if(k) view=k; render(); window.scrollTo(0,0); }

function validStart(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v||'') && !isNaN(dateOf(v).getTime()); }
function say(t){ const m=$('msg'); if(m) m.textContent=t; }

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ go(t.dataset.tab, t.dataset.tab==='today'?homeK():null); return; }
  if(t.dataset.k){ go('today', t.dataset.k); return; }
  if(t.dataset.go){ const el=$(t.dataset.go); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(t.dataset.q!==undefined){
    const d=day(view); d.quiz[t.dataset.q]=Number(t.dataset.o); save();
    $('quiz').innerHTML=quizHTML(ARTICLES[artOf(view)],d); chrome(); return;
  }
  if(t.dataset.start){
    const ta=$('essay'); ta.focus(); ta.setRangeText(t.dataset.start,ta.selectionStart,ta.selectionEnd,'end');
    ta.dispatchEvent(new Event('input',{bubbles:true})); return;
  }
  if(t.dataset.copy){
    const txt=(st.days[t.dataset.copy]||{}).essay||'';
    try{ navigator.clipboard.writeText(txt).then(()=>{t.textContent='已複製'},()=>{t.textContent='請長按文字複製'}); }catch(err){ t.textContent='請長按文字複製'; }
    return;
  }
  const act=t.dataset.act; if(!act) return;
  if(act==='resetquiz'){ const d=day(view); d.quiz={}; save(); $('quiz').innerHTML=quizHTML(ARTICLES[artOf(view)],d); chrome(); }
  else if(act==='begin'){ const v=$('startdate').value; st.start=validStart(v)?v:todayK; save(); view=homeK(); tab='today'; render(); }
  else if(act==='setstart'){ const v=$('startdate').value; if(!validStart(v)){say('日期不正確，請重新選擇。');return} st.start=v; save(); view=homeK(); renderTerm(); chrome(); say('已更改，文章順序已重新排列。'); }
  else if(act==='backup'){
    const code=JSON.stringify(st), ta=$('code'); ta.value=code; ta.focus(); ta.select();
    try{ navigator.clipboard.writeText(code).then(()=>say('已複製，請貼到備忘錄收好。'),()=>say('請長按上面的文字，選「全選」再複製。')); }catch(err){ say('請長按上面的文字，選「全選」再複製。'); }
  }
  else if(act==='restore'){
    try{ const o=JSON.parse($('code').value); if(!o||typeof o!=='object'||!o.days||!validStart(o.start)) throw 0; st={start:o.start,days:o.days}; save(); render(); }
    catch(err){ say('這段文字不是正確的備份，請確認有完整貼上。'); }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='mimic'){ day(view).mimic=t.value; save(); chrome(); }
  else if(t.id==='essay'){ day(view).essay=t.value; save(); meter(); chrome(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='readbox'){ day(view).read=e.target.checked; save(); chrome(); }
});

/* 開學日還沒到時，今天以前沒有文章，先固定看開學日那天 */
view=homeK();
render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
</script>

</body>
</html>
