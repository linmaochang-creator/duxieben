<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161C" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="讀寫本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>每日讀寫本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: 單欄作業簿。上方是日期與連續天數，中間依序是文章、賞析、測驗、仿寫、小作文，底部三個分頁（今天、學期、作品）。
   Color: 紙張藍灰、墨水深藍、老師的紅筆、螢光筆黃、批改用的綠。 */
:root{
  --paper:#EDF0F4; --card:#FAFBFC; --ink:#1D2733; --ink-2:#556172; --rule:#D3DAE3;
  --red:#B93A2E; --mark:rgba(244,212,70,.55); --ok:#2B7A57; --ok-bg:#E0F0E7;
  --bad:#B93A2E; --bad-bg:#F8E2DF;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","Source Han Serif TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161C; --card:#1A2028; --ink:#E6E9EE; --ink-2:#9AA5B4; --rule:#2E3743;
    --red:#F0786B; --mark:rgba(238,205,80,.28); --ok:#6FD0A0; --ok-bg:#17332A;
    --bad:#F0786B; --bad-bg:#3A201E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12161C; --card:#1A2028; --ink:#E6E9EE; --ink-2:#9AA5B4; --rule:#2E3743;
  --red:#F0786B; --mark:rgba(238,205,80,.28); --ok:#6FD0A0; --ok-bg:#17332A;
  --bad:#F0786B; --bad-bg:#3A201E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.7;
  padding-block:20px 104px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--red); outline-offset:2px}

.top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
h1{font-family:var(--serif); font-size:28px; line-height:1.2; margin:0; letter-spacing:.04em; text-wrap:balance}
.dateline{margin:4px 0 0; color:var(--ink-2); font-size:14px}
.streak{display:flex; align-items:baseline; gap:6px; color:var(--ink-2); font-size:14px}
.streak b{font-family:var(--serif); font-size:34px; line-height:1; color:var(--red); font-variant-numeric:tabular-nums}

.week{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.day{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 6px; border:1px solid var(--rule); background:var(--card); border-radius:6px; font-size:12px; color:var(--ink-2)}
.day b{font-size:17px; font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.2}
.day i{font-style:normal; height:14px; line-height:14px; font-size:12px; color:var(--ok); font-weight:700}
.day[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 -3px 0 var(--ink)}
.day.today span{color:var(--red); font-weight:700}
.day:disabled{opacity:.4; cursor:default}

.steps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; list-style:none; margin:0; padding:0; position:relative}
.step{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 2px 8px; background:transparent; border:0; border-top:3px solid var(--rule); font-size:13px; color:var(--ink-2)}
.step.ok{border-top-color:var(--ok); color:var(--ink)}
.step .dot{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--rule); display:grid; place-items:center; font-size:12px; line-height:1}
.step.ok .dot{background:var(--ok); border-color:var(--ok); color:var(--card)}
.stamp{position:absolute; right:0; top:-34px; font-family:var(--serif); font-weight:700; letter-spacing:.12em; color:var(--red); border:2px solid var(--red); border-radius:4px; padding:2px 8px; transform:rotate(-7deg); font-size:14px; background:var(--paper)}
@media (prefers-reduced-motion:no-preference){ .stamp{animation:press .28s ease-out} }
@keyframes press{from{transform:rotate(-7deg) scale(1.6); opacity:0} to{transform:rotate(-7deg) scale(1); opacity:1}}

.sheet{background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:22px max(18px,4vw) 20px}
.eyebrow{margin:0 0 6px; font-size:12.5px; letter-spacing:.08em; color:var(--ink-2)}
h2{font-family:var(--serif); font-size:25px; line-height:1.35; margin:0 0 6px; text-wrap:balance}
.tech{margin:0 0 14px; font-size:14px; color:var(--red)}
.text{display:flex; flex-direction:column; gap:.55em; font-family:var(--serif); font-size:18px; line-height:2; min-width:0}
.text p{margin:0; text-indent:2em}
mark{background:linear-gradient(transparent 42%, var(--mark) 42%); color:inherit; padding:0 1px}
.check{display:flex; align-items:center; gap:10px; margin-top:18px; padding-top:14px; border-top:1px dashed var(--rule); font-weight:500; cursor:pointer}
.check input{width:22px; height:22px; accent-color:var(--ok)}

.block{display:flex; flex-direction:column; gap:12px; min-width:0}
h3{font-family:var(--serif); font-size:20px; margin:0}
.block .eyebrow{margin:0}
.lead{margin:0; color:var(--ink-2); font-size:14.5px}
.gj{display:flex; flex-direction:column; gap:6px; padding:12px 0; border-top:1px solid var(--rule)}
.gj q{quotes:none; font-family:var(--serif); font-size:17px; line-height:1.8}
.tag{align-self:flex-start; font-size:12px; letter-spacing:.06em; color:var(--red); border:1px solid var(--red); border-radius:3px; padding:0 6px; line-height:1.7}
.gj p{margin:0; font-size:14.5px; color:var(--ink-2)}
.words{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; padding-top:12px; border-top:1px solid var(--rule)}
.words dt{font-family:var(--serif); font-weight:700}
.words dd{margin:0; color:var(--ink-2); font-size:14.5px}

.q{display:flex; flex-direction:column; gap:8px}
.qt{margin:0; font-weight:500}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{text-align:left; padding:11px 14px; border:1px solid var(--rule); background:var(--card); border-radius:6px; line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default; color:inherit}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.why{margin:0; font-size:14.5px; color:var(--ink-2)}
.why b{color:var(--ink)}
.link{align-self:flex-start; background:none; border:0; padding:4px 0; color:var(--ink-2); text-decoration:underline; font-size:14px}

.ex{margin:0; padding:10px 14px; border-left:3px solid var(--red); background:var(--card); font-family:var(--serif); font-size:16px; line-height:1.8}
.ex small{display:block; font-family:var(--sans); font-size:12.5px; color:var(--ink-2)}
textarea{
  width:100%; display:block; resize:vertical; border:1px solid var(--rule); border-radius:6px;
  background-color:var(--card); color:var(--ink); font-family:var(--serif); font-size:17px; line-height:2.2; padding:0 14px;
  background-image:repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.2em - 1px), var(--rule) calc(2.2em - 1px), var(--rule) 2.2em);
  background-attachment:local;
}
#mimic{min-height:4.4em}
#essay{min-height:13.2em}
.chips{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.chip{border:1px solid var(--rule); background:var(--card); border-radius:999px; padding:5px 12px; font-size:14px}
.chip:hover{border-color:var(--ink)}
.meter{display:flex; align-items:center; gap:12px; font-size:14px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.bar{flex:1; height:6px; border-radius:3px; background:var(--rule); overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--ink); transition:width .15s}
.bar.full i{background:var(--ok)}
.self{display:flex; flex-direction:column; gap:6px; padding:12px 14px; border:1px dashed var(--rule); border-radius:6px; margin:0}
.self legend{padding:0 6px; font-size:13px; color:var(--ink-2)}
.self label{display:flex; gap:10px; align-items:flex-start; font-size:14.5px}
.self input{width:18px; height:18px; margin-top:4px; accent-color:var(--ok); flex:none}

/* 學期地圖 */
.weeks{display:flex; flex-direction:column; gap:10px}
.wk{background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; min-width:0}
.wk.now{border-color:var(--ink)}
.wkh{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.wkh b{font-family:var(--serif); font-size:16px}
.wkh span{font-size:13.5px; color:var(--ink-2)}
.wk .tech{margin:0; font-size:13.5px}
.dots{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.pip{height:34px; border-radius:6px; border:1px solid var(--rule); background:transparent; font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.pip.part{background:var(--mark); color:var(--ink); border-color:transparent}
.pip.done{background:var(--ok); color:var(--card); border-color:var(--ok); font-weight:700}
.pip:disabled{opacity:.35; cursor:default}
.panel{background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
input[type="date"]{border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:6px; padding:6px 10px; min-height:40px}
.btn{border:1px solid var(--ink); background:var(--ink); color:var(--card); border-radius:6px; padding:9px 16px; min-height:40px; font-weight:500}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--rule)}
.code{font-family:ui-monospace,Menlo,monospace; font-size:12.5px; line-height:1.5; min-height:5em; background-image:none; background-color:var(--paper); padding:8px 10px}
.msg{margin:0; font-size:13.5px; color:var(--ok); min-height:1.2em}

/* 作品 */
.work{background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; min-width:0}
.work h4{margin:0; font-family:var(--serif); font-size:17px}
.work .meta{font-size:12.5px; color:var(--ink-2)}
.work .body{margin:0; font-family:var(--serif); font-size:16.5px; line-height:1.95; white-space:pre-wrap; overflow-wrap:anywhere}
.empty{padding:28px 16px; text-align:center; color:var(--ink-2); border:1px dashed var(--rule); border-radius:6px; margin:0}

/* 歡迎頁 */
.hello{display:flex; flex-direction:column; gap:16px; padding-top:12px}
.hello ol{margin:0; padding-left:1.3em; display:flex; flex-direction:column; gap:4px}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--card); border-top:1px solid var(--rule);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.tabbar .in{max-width:680px; margin:0 auto; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.tabbar button{border:0; background:none; padding:10px 0; border-radius:6px; font-size:15px; color:var(--ink-2)}
.tabbar button[aria-current="page"]{color:var(--ink); font-weight:700; box-shadow:inset 0 -3px 0 var(--red)}
@media (max-width:420px){ h1{font-size:25px} h2{font-size:22px} .text{font-size:17px} .step{font-size:12px} }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>每日讀寫本</h1>
      <p class="dateline" id="dateline"></p>
    </div>
    <div class="streak" id="streak"></div>
  </header>
  <main class="wrap" id="view" style="gap:26px"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="分頁" hidden>
  <div class="in">
    <button data-tab="today">今天</button>
    <button data-tab="term">學期</button>
    <button data-tab="works">作品</button>
  </div>
</nav>

<script>
const ARTICLES = [{"title":"投籃一百次","theme":"堅持與練習","text":["放學後，體育館的燈只開了一半。我抱著籃球站在罰球線前，今天的目標是連進五球，卻連一球都沒進。","球一次次彈出籃框，那聲音像敲門卻沒人應門。教練只說：「手腕放鬆，眼睛看籃框前緣。」我照做，球還是歪了。","練到第八十幾球，手臂酸得像灌了水泥，我索性不想了，只是一下一下地投。第九十七球，球擦過籃網，發出清脆的唰一聲。","我愣了一下，才發現汗水已經滴在地板上，圓圓的一小攤。我撿起球，又走回罰球線。"],"gj":[{"s":"那聲音像敲門卻沒人應門","t":"譬喻","n":"把球彈出籃框的聲音比成無人回應的敲門，讓失敗的落寞感一下子具體起來。"},{"s":"手臂酸得像灌了水泥","t":"譬喻","n":"用水泥的沉重比喻疲累，讓讀者立刻感覺到手臂抬不起來。"},{"s":"發出清脆的唰一聲","t":"摹聲","n":"用擬聲詞寫出進球的瞬間，聲音短而乾淨，帶出成功的爽快。"}],"w":[{"w":"索性","m":"乾脆、不再猶豫"},{"w":"清脆","m":"聲音響亮悅耳"},{"w":"愣了一下","m":"一時反應不過來"}],"quiz":[{"q":"作者的球是在第幾球才投進？","o":["第九十七球","第八十幾球","第一百球"],"a":0,"why":"文中寫「第九十七球，球擦過籃網」，才是真正投進的時刻。"},{"q":"「手臂酸得像灌了水泥」運用了哪一種修辭？","o":["映襯","譬喻","設問"],"a":1,"why":"「像」連接手臂與水泥，是明喻。"}],"title2":"一件我練了很久的事","hint":"寫一件你反覆練習的事（球類、樂器、背單字都可以），挑一個最累或最想放棄的瞬間，用一個譬喻把那種感覺寫出來。","starters":["那天練到第……次的時候，","我的手臂（雙腳、手指）像……"]},{"title":"清晨的操場","theme":"堅持與練習","text":["六點半，操場還浸在一層薄薄的霧裡。跑道像一條灰藍色的緞帶，繞著草地靜靜躺著，遠處的司令台只剩下模糊的輪廓。","第一個來的是早起練田徑的學長，鞋底踩過跑道，沙沙沙，像有人在翻一本很厚的書。他的呼吸在空氣裡變成一小團白煙，一下就散了。","太陽慢慢爬過教學大樓的屋頂，霧像被誰輕輕掀開的棉被，露出一片濕亮的草地。草尖上的露珠一顆顆亮起來，好像整座操場都醒了。","廣播還沒響，鐘聲也還沒響，只有一圈又一圈的腳步聲，把早晨踩得越來越暖。"],"gj":[{"s":"跑道像一條灰藍色的緞帶","t":"譬喻","n":"用緞帶的柔軟與細長寫跑道的形狀，連霧中的顏色也一起寫進去。"},{"s":"鞋底踩過跑道，沙沙沙，像有人在翻一本很厚的書","t":"摹聲與譬喻","n":"先用疊字摹聲，再用翻書比喻，把平凡的腳步聲寫得安靜又有趣。"},{"s":"把早晨踩得越來越暖","t":"轉化","n":"把「溫度」加在早晨上，寫出氣氛由冷清漸漸有生氣。"}],"w":[{"w":"輪廓","m":"物體外形的邊線"},{"w":"露珠","m":"凝結在草葉上的小水滴"},{"w":"緞帶","m":"光滑柔軟的帶子"}],"quiz":[{"q":"文中第一個到操場的人是誰？","o":["廣播社的同學","值日生","練田徑的學長"],"a":2,"why":"第二段明寫「第一個來的是早起練田徑的學長」。"},{"q":"結尾「把早晨踩得越來越暖」最主要想表達什麼？","o":["腳步聲讓清晨漸漸有了活力","天氣忽然變得很熱","作者抱怨太早起床"],"a":0,"why":"「暖」是指氣氛與生氣，不是真的氣溫變化。"}],"title2":"我最喜歡的一段時間","hint":"寫一個你熟悉的時段（清晨、放學後、夜市前）和地點，先寫看到什麼，再用一個「像……」的句子描繪它。","starters":["早上（傍晚）的校門口，","當天色慢慢變亮（變暗），"]},{"title":"蘭姨的炒麵攤","theme":"堅持與練習","text":["蘭姨的炒麵攤在學校後門的巷口，每天下午四點準時出現，多年來沒有缺過一天。她的頭髮用一條藍色髮帶紮得緊緊的，像她的炒麵一樣俐落。","她炒麵的樣子像在指揮一支樂隊。鍋鏟一舉，高麗菜落下；手腕一翻，麵條在鐵鍋裡跳起舞。我曾問她累不累，她笑著說：「手熟了，就不覺得重了。」","有一次下大雨，攤子的帆布被風吹得啪啪響，同學都以為她不會來。可是巷口那盞黃色的小燈還是亮了，鍋裡冒出的白煙混著雨絲，是我們最熟悉的味道。","我端著熱騰騰的炒麵站在屋簷下，看她用同一個動作，炒了第一百盤、第一千盤。"],"gj":[{"s":"她炒麵的樣子像在指揮一支樂隊","t":"譬喻","n":"把炒麵的節奏感比成指揮，立刻讓人看見她動作的流暢與自信。"},{"s":"麵條在鐵鍋裡跳起舞","t":"擬人","n":"讓麵條像人一樣跳舞，畫面活潑，也暗示她的手法熟練。"},{"s":"手熟了，就不覺得重了","t":"引述對話","n":"用她自己的話收住人物性格，樸實的一句，比旁人的稱讚更有力。"}],"w":[{"w":"俐落","m":"動作敏捷、不拖泥帶水"},{"w":"帆布","m":"厚實的布料，常用來遮雨"},{"w":"熱騰騰","m":"冒著熱氣的樣子"}],"quiz":[{"q":"下大雨那天，蘭姨怎麼做？","o":["提早收攤","照常出攤","請同學幫忙"],"a":1,"why":"文中寫「巷口那盞黃色的小燈還是亮了」，表示她仍然出攤。"},{"q":"「像她的炒麵一樣俐落」中的「俐落」是指什麼？","o":["說話聲音很大","打扮十分華麗","動作乾淨敏捷"],"a":2,"why":"髮帶紮得緊緊的，與炒麵一樣乾脆，是指做事的樣子。"}],"title2":"那個每天都在的人","hint":"寫一個你生活中每天都會遇到的人（早餐店老闆、警衛、清潔阿姨），描寫他最常做的一個動作，並加入一句他說過的話。","starters":["每天早上，我都會看到……","他（她）做這件事的時候，"]},{"title":"練習的科學","theme":"堅持與練習","text":["你還記得第一次騎腳踏車的情形嗎？那時每個動作都要用力去想：手握哪裡、腳踩多快、眼睛看哪裡。現在你卻能一邊騎、一邊聊天，這就是練習帶來的改變。","反覆練習會讓動作愈來愈熟練，因為大腦把常做的步驟整理成固定的流程。這就像草地上被走出一條小路，走的人愈多，路愈清楚，之後就不必再費力找方向。","不過，只是機械式地重複，效果往往有限。比較有效的方法，是把目標切成小段，專心練最容易出錯的那一段，並留意哪裡做得不好。練完讓身體休息一下，隔天再回頭複習，也能幫助記得更牢。","所以，下次覺得進步很慢時，不妨先問問自己：我是在重複，還是真的在練習？"],"gj":[{"s":"這就像草地上被走出一條小路，走的人愈多，路愈清楚","t":"譬喻","n":"用小路比喻熟練的過程，讓抽象的「大腦流程」變成讀者看得見的畫面。"},{"s":"現在你卻能一邊騎、一邊聊天","t":"舉例與對比","n":"與前面「每個動作都要用力想」形成對比，用生活經驗證明練習的效果。"},{"s":"我是在重複，還是真的在練習？","t":"設問","n":"結尾留下一個問題，讓讀者回頭檢查自己，不用說教也有提醒作用。"}],"w":[{"w":"機械式","m":"不動腦筋、只是照樣重複"},{"w":"熟練","m":"因為常做而很順手"},{"w":"複習","m":"把學過的東西再看一遍"}],"quiz":[{"q":"文章認為比較有效的練習方法是什麼？","o":["把目標切成小段，專練容易出錯處","一口氣練到筋疲力盡","只練自己最拿手的部分"],"a":0,"why":"第三段明說要把目標切小段並專心練易錯的部分。"},{"q":"「草地上被走出一條小路」比喻什麼？","o":["騎腳踏車需要先規劃路線","練習久了，動作變得清楚順手","草地應該受到保護"],"a":1,"why":"路愈走愈清楚，對應的是流程愈練愈熟練。"}],"title2":"我正在練習的一件事","hint":"寫一件你最近正在練習的事，說明你用了什麼方法，並試著用「就像……」說明練習的過程。","starters":["我最近一直在練習……","一開始我總是……，後來"]},{"title":"夜裡的練習曲","theme":"堅持與練習","text":["夜裡九點，房間只剩檯燈亮著。我把譜架往窗邊挪了挪，琴弓一落，又是那個老出錯的小節。","音符像一群調皮的麻雀，總在我快抓住的時候飛走。我聽著自己拉出的聲音，乾澀、歪斜。有時候真想把琴放下，去看一集影片，可是看見譜上被鉛筆畫了又擦、擦了又畫的痕跡，又覺得這些黑黑的印子，是我一點一點留下來的腳印。","窗外有摩托車駛過，燈光掃過牆壁就不見了。我深吸一口氣，再拉一次。這一次，那個小節終於順了，像一條打結的線，鬆開了一個小小的結。","我沒有歡呼，只是把琴弓輕輕放下，聽著房間裡的餘音慢慢變淡。"],"gj":[{"s":"音符像一群調皮的麻雀，總在我快抓住的時候飛走","t":"譬喻","n":"把難抓的音符想成麻雀，既有動感，也寫出又急又氣的心情。"},{"s":"這些黑黑的印子，是我一點一點留下來的腳印","t":"暗喻","n":"不用「像」，直接說印子「是」腳印，把努力變成看得見的足跡。"},{"s":"畫了又擦、擦了又畫","t":"類疊","n":"重複的句型讓人看見反覆修改的過程，節奏也像在練習。"}],"w":[{"w":"乾澀","m":"聲音不圓潤、不流暢"},{"w":"餘音","m":"聲音停止後留下的回響"},{"w":"歪斜","m":"不端正、偏向一邊"}],"quiz":[{"q":"作者為什麼沒有把琴放下？","o":["老師規定一定要練完","擔心被同學比下去","看見譜上的痕跡，覺得那是自己努力的腳印"],"a":2,"why":"第二段說印子是「一點一點留下來的腳印」，使他願意繼續。"},{"q":"結尾「沒有歡呼，只是輕輕放下琴弓」呈現怎樣的心情？","o":["平靜而踏實","失望又生氣","急著結束練習"],"a":0,"why":"他沒有大喜大悲，只是安靜地聽餘音，顯示踏實的滿足。"}],"title2":"一次差點放棄的時刻","hint":"寫一次你差點放棄的經驗，先寫當時身邊的聲音或景物，再用一個比喻說出你的心情。","starters":["那天晚上，我差一點就……","當我看到……，"]},{"title":"慢慢來比較快","theme":"堅持與練習","text":["有人說：「做事要快。」但我覺得，學習這件事，有時候慢才是真的快。","想想看，補習班裡常有人把整本講義一口氣刷完，翻頁翻得飛快，隔天卻什麼都想不起來。這就像用大湯匙喝一碗燙湯，匆匆吞下去，根本嘗不到味道。","反過來，先把一個觀念弄懂，再往下走，看起來速度慢，卻像蓋房子先打穩地基，後面的樓層才不會歪。每次多花幾分鐘把錯題訂正清楚，考試時往往就少犯一次同樣的錯。","當然，慢不等於偷懶。慢，是願意停下來想；偷懶，是根本不想。分清楚這兩者，我們才能走得穩，也走得遠。"],"gj":[{"s":"學習這件事，有時候慢才是真的快","t":"反論","n":"表面矛盾，其實藏著道理，一開頭就讓人想知道原因。"},{"s":"這就像用大湯匙喝一碗燙湯，匆匆吞下去，根本嘗不到味道","t":"譬喻","n":"用喝湯比喻趕進度，貼近生活，也讓「學不進去」有了味覺的畫面。"},{"s":"慢，是願意停下來想；偷懶，是根本不想","t":"對比","n":"把容易混淆的兩件事並排比較，界線一下子變清楚。"}],"w":[{"w":"匆匆","m":"急急忙忙的樣子"},{"w":"訂正","m":"把錯的地方改正"},{"w":"地基","m":"建築物最底下的基礎"}],"quiz":[{"q":"作者的主要看法是什麼？","o":["學習速度愈快愈好","把觀念弄懂，慢有時反而更有效率","補習班的講義不必看"],"a":1,"why":"全文從頭到尾都在說明「慢才是真的快」的道理。"},{"q":"依文意，作者認為「慢」不等於什麼？","o":["放棄","退步","偷懶"],"a":2,"why":"第四段說「慢不等於偷懶」，並解釋兩者的差別。"}],"title2":"我的學習節奏","hint":"寫你學習某件事時，曾經「太急」或「慢下來才成功」的經驗，並加入一個生活中的譬喻。","starters":["有一次我為了趕快完成，","後來我決定慢下來，"]},{"title":"鬧鐘與我的戰爭","theme":"堅持與練習","text":["我家的鬧鐘每天早上六點準時開戰，我則是每天六點零一分準時投降。","它響起來的聲音，像一隻發瘋的蟬黏在耳朵旁邊。我伸出手，用一個非常精準的動作按下「再睡五分鐘」，整個人又像一片煎餅貼回床上。","為了贏這場戰爭，我擬定了訓練計畫：把鬧鐘放到書桌上，逼自己下床關掉。第一天成功！第二天，我走過去關掉它，又走回來，穩穩躺好。媽媽站在門口，說我是「全世界最有毅力的睡覺選手」。","現在鬧鐘放在走廊的鞋櫃上。今天早上，我拖著腳步走到鞋櫃前，按掉它，順便把鞋子穿上了。我站在門口，低頭看著自己的腳，開始認真思考：不如就去上學吧。"],"gj":[{"s":"我家的鬧鐘每天早上六點準時開戰，我則是每天六點零一分準時投降","t":"轉化與對比","n":"把鬧鐘寫成會開戰的對手，又用一分鐘的差距製造反差，開頭就有笑點。"},{"s":"像一隻發瘋的蟬黏在耳朵旁邊","t":"譬喻","n":"蟬聲又尖又長，比喻鬧鐘貼近耳朵的刺耳感，誇張而好笑。"},{"s":"整個人又像一片煎餅貼回床上","t":"譬喻","n":"用煎餅攤平黏住的樣子，寫出賴床時全身癱軟的畫面。"}],"w":[{"w":"精準","m":"非常準確、不差一點"},{"w":"毅力","m":"堅持到底的意志力"},{"w":"投降","m":"承認失敗、不再抵抗"}],"quiz":[{"q":"故事最後，鬧鐘被放在哪裡？","o":["走廊的鞋櫃","書桌上","浴室裡"],"a":0,"why":"最後一段寫「現在鬧鐘放在走廊的鞋櫃上」。"},{"q":"媽媽說「全世界最有毅力的睡覺選手」，語氣最接近哪一種？","o":["嚴厲的責備","帶著調侃的幽默","誠懇的稱讚"],"a":1,"why":"稱讚的字面下其實是在取笑作者一直賴床。"}],"title2":"我和某樣東西的小戰爭","hint":"寫一件你和日常物品或習慣之間的「戰爭」（手機、鬧鐘、作業），用誇張又好笑的方式描寫，並加一個像……的比喻。","starters":["我和（它）的戰爭，","每天晚上（早上），它都會"]},{"title":"外婆的廚房","theme":"家人與親情","text":["放學回到外婆家，還沒推開紗門，就聞到一股油蔥酥的香味，像一隻看不見的手，把我整個人拉了進去。","廚房裡，鍋蓋咕嚕咕嚕地跳動，白煙從縫隙鑽出來，貼在玻璃窗上，結成一層霧。外婆背對著我，用鍋鏟敲了敲鍋沿，叮、叮，是叫我先去洗手的暗號。","我偷捏了一塊剛出鍋的蘿蔔糕，燙得左右手換來換去，咬下去外皮微微酥脆，裡面軟綿綿，帶著淡淡的鹹香。外婆回頭瞪我一眼，嘴角卻彎了起來。","窗外的天色漸漸變橘，我們兩個人擠在小板凳上，吃著那盤永遠吃不膩的點心。"],"gj":[{"s":"還沒推開紗門，就聞到一股油蔥酥的香味","t":"嗅覺摹寫","n":"氣味比人先到，寫出對外婆家的熟悉，也讓畫面還沒進門就先有了香氣。"},{"s":"鍋蓋咕嚕咕嚕地跳動","t":"聽覺摹寫","n":"疊字模擬水滾的聲音，並讓鍋蓋像在跳動，廚房的熱鬧感立即浮現。"},{"s":"咬下去外皮微微酥脆，裡面軟綿綿，帶著淡淡的鹹香","t":"味覺與觸覺摹寫","n":"從口感到味道，由外寫到內，讓讀者彷彿也咬了一口。"}],"w":[{"w":"暗號","m":"事先約好、只有彼此懂的信號"},{"w":"酥脆","m":"食物乾而脆、容易咬斷"},{"w":"油蔥酥","m":"炸過的紅蔥頭，香氣濃郁"}],"quiz":[{"q":"外婆敲鍋沿的聲音是什麼意思？","o":["菜已經煮好了","要我幫忙關火","叫我先去洗手"],"a":2,"why":"文中說那是「叫我先去洗手的暗號」。"},{"q":"「咬下去外皮微微酥脆，裡面軟綿綿」主要運用哪些感官摹寫？","o":["味覺與觸覺","視覺與聽覺","嗅覺與視覺"],"a":0,"why":"寫的是口感與味道，屬於味覺和觸覺。"}],"title2":"我家的味道","hint":"寫一道家裡常出現的食物，依序寫出它的氣味、聲音、口感，至少用到三種感官。","starters":["一聞到（那道菜的）味道，","我最喜歡它的地方是……，因為"]},{"title":"雨天的客廳","theme":"家人與親情","text":["午後下起雨，客廳的落地窗被打得啪啪響。玻璃上的水珠一條一條往下滑，把外面的街景糊成一幅暈開的水彩。","爸爸窩在沙發上看球賽，聲音調得很小，電視裡的歡呼像隔著一層棉被。媽媽在摺衣服，空氣裡有洗衣精的清香，混著剛泡好的薑茶的辛辣氣味。","我把腳縮進毯子，毛線扎在小腿上，癢癢的、暖暖的。弟弟趴在地上拼樂高，塑膠方塊喀啦喀啦碰在一起，像一陣小小的雨聲，和窗外的雨應和。","沒有人說話，只有雨一直下。我捧著那杯微燙的薑茶，看著全家人，被這場雨輕輕收進了同一個客廳。"],"gj":[{"s":"把外面的街景糊成一幅暈開的水彩","t":"視覺摹寫與譬喻","n":"把雨中模糊的街景比成水彩畫，色彩與邊界都柔化了。"},{"s":"電視裡的歡呼像隔著一層棉被","t":"聽覺摹寫","n":"用棉被比喻聲音被悶住，讓讀者聽見那種遙遠又柔軟的聲音。"},{"s":"毛線扎在小腿上，癢癢的、暖暖的","t":"觸覺摹寫","n":"用疊字寫出細微的觸感，癢與暖並列，貼近真實體驗。"}],"w":[{"w":"暈開","m":"顏色向四周擴散模糊"},{"w":"窩","m":"蜷縮著身體舒服地待著"},{"w":"應和","m":"彼此呼應配合"}],"quiz":[{"q":"弟弟在客廳裡做什麼？","o":["在沙發上看球賽","趴在地上拼樂高","幫忙摺衣服"],"a":1,"why":"第三段寫「弟弟趴在地上拼樂高」。"},{"q":"「像一陣小小的雨聲，和窗外的雨應和」中的「應和」是什麼意思？","o":["互相爭吵","慢慢消失","彼此呼應、相互配合"],"a":2,"why":"樂高聲音像雨聲，與真正的雨聲彼此呼應。"}],"title2":"一個下雨的下午","hint":"寫一個下雨天你在家（或在路上）的情景，依序寫出看到、聽到、聞到或摸到的東西。","starters":["雨下得很大，我坐在……","窗外的雨聲"]},{"title":"爸爸的手","theme":"家人與親情","text":["爸爸的手很大，指節粗粗的，掌心有一層厚厚的繭。他是水電工，每天拿的不是筆，是鉗子和扳手。小時候被他牽著，我的手像被一個溫暖的洞穴包起來。","他的手有味道。回到家時，帶著一點金屬和肥皂混合的氣味，洗了好幾遍，指縫裡還是有一絲洗不掉的黑。我每次笑他「手好髒」，他就伸出手，用粗糙的指腹在我臉上輕輕一刮，刮得我又癢又縮脖子。","上星期我的檯燈壞了，他蹲在書桌前，三兩下就修好了。那雙手拆螺絲時又穩又準，彷彿有自己的眼睛。我站在旁邊看，覺得那些繭，一圈圈都是他為了這個家磨出來的年輪。","檯燈亮起，暖黃色的光落在他的手背上，那裡有幾條淡淡的疤。"],"gj":[{"s":"我的手像被一個溫暖的洞穴包起來","t":"觸覺摹寫與譬喻","n":"用洞穴的包覆感寫出被牽著的安全感，溫暖也是觸覺。"},{"s":"帶著一點金屬和肥皂混合的氣味","t":"嗅覺摹寫","n":"用氣味寫職業，不必說他很辛苦，工作的樣子已經在味道裡。"},{"s":"那些繭，一圈圈都是他為了這個家磨出來的年輪","t":"暗喻","n":"把繭比成樹的年輪，一圈圈代表時間與付出，意象具體而深刻。"}],"w":[{"w":"粗糙","m":"表面不光滑"},{"w":"指腹","m":"手指頭內側的肉"},{"w":"彷彿","m":"好像、似乎"}],"quiz":[{"q":"爸爸的職業是什麼？","o":["水電工","木工","廚師"],"a":0,"why":"第一段說他每天拿的是鉗子和扳手，是水電工。"},{"q":"作者把爸爸手上的繭比作「年輪」，想表達什麼？","o":["爸爸的手變得很老","長年辛勞所累積的痕跡","爸爸喜歡種樹"],"a":1,"why":"年輪代表時間累積，繭是為家付出的痕跡。"}],"title2":"家人的一個小動作","hint":"選一位家人，寫他（她）最常見的一個動作或身體的一個部位，加入氣味、聲音或觸感的描寫。","starters":["我最熟悉的，是媽媽（爸爸、阿公）的……","每當他（她）……，"]},{"title":"氣味的記憶","theme":"家人與親情","text":["你有沒有過這樣的經驗：路過一家麵包店，聞到烤奶油的香氣，忽然想起小時候某個下午？這種「一聞就想起」的現象，其實很常見。","人的五種感官中，嗅覺和記憶的關係特別密切。一般認為，鼻子接收到氣味後，訊號會很快傳到大腦處理情緒和記憶的區域，所以氣味常常能一下子把人帶回某個場景。","當然，聲音、畫面和觸感也能喚起回憶，只是氣味常常來得特別突然，連自己都來不及準備。也因此，有些人聞到某種洗衣精會想到媽媽，聞到某種湯頭會想到外婆的廚房。","下次回家，不妨留意玄關、廚房和房間裡的氣味。把這些味道記下來，將來離家的時候，它們就像一張看不見的明信片，隨時可以寄給你。"],"gj":[{"s":"你有沒有過這樣的經驗：路過一家麵包店，聞到烤奶油的香氣，忽然想起小時候某個下午？","t":"設問與嗅覺摹寫","n":"用生活場景開頭，先讓讀者想起自己的經驗，再進入說明。"},{"s":"人的五種感官中，嗅覺和記憶的關係特別密切","t":"總說句","n":"直接點出全文的核心概念，後面再逐步解釋。"},{"s":"它們就像一張看不見的明信片，隨時可以寄給你","t":"譬喻","n":"把氣味比成明信片，說明它能把家的感覺帶到遠方，結尾溫柔。"}],"w":[{"w":"密切","m":"關係很近、很緊密"},{"w":"喚起","m":"引起、使重新出現"},{"w":"玄關","m":"進門處的小空間"}],"quiz":[{"q":"文章如何解釋氣味容易讓人想起往事？","o":["氣味比聲音更大聲","人只靠鼻子記事情","嗅覺訊號很快傳到處理情緒與記憶的大腦區域"],"a":2,"why":"第二段說氣味訊號會傳到處理情緒和記憶的區域。"},{"q":"文章結尾建議讀者做什麼？","o":["留意並記下家裡的氣味","少用有味道的清潔用品","搬家前先打掃"],"a":0,"why":"結尾請讀者留意玄關、廚房、房間的氣味並記下來。"}],"title2":"一個讓我想起家的味道","hint":"寫一種會讓你想起某個人或某個地方的氣味，說明它從哪裡來，以及當時你正在做什麼。","starters":["每次聞到……的味道，","那股味道讓我想起"]},{"title":"冬至的湯圓","theme":"家人與親情","text":["冬至那天傍晚，天色暗得特別早。屋子裡的燈全亮了，廚房的熱氣把窗戶蒸得一片白茫茫。","我們一家人圍著大桌子搓湯圓，粉糰軟軟的，貼在掌心，涼涼滑滑像一塊小小的雲。弟弟搓的總是歪歪扭扭，奶奶卻一個一個撿進鍋裡，說：「這顆最可愛。」","湯圓浮起來的時候，甜甜的薑味和糖香一下子飄滿整個屋子。我捧著碗，小口小口吹氣，熱氣撲在臉上，鼻尖都濕了。","表姊在外地讀書，沒能趕回來，奶奶仍替她盛了一碗，放在空位前。熱氣一縷一縷地升起來，在燈下慢慢散開。"],"gj":[{"s":"廚房的熱氣把窗戶蒸得一片白茫茫","t":"視覺摹寫","n":"用「白茫茫」寫出霧氣的範圍與冬天室內外的溫差，畫面清晰。"},{"s":"粉糰軟軟的，貼在掌心，涼涼滑滑像一塊小小的雲","t":"觸覺摹寫與譬喻","n":"連用疊字與雲的比喻，把粉糰的軟與涼寫得輕盈。"},{"s":"甜甜的薑味和糖香一下子飄滿整個屋子","t":"嗅覺摹寫","n":"用「飄滿」寫氣味的擴散，也暗示屋子裡的溫暖。"}],"w":[{"w":"白茫茫","m":"一片白色、看不清楚"},{"w":"歪歪扭扭","m":"彎曲不整齊的樣子"},{"w":"空位","m":"沒有人坐的位置"}],"quiz":[{"q":"奶奶看到弟弟搓得歪歪扭扭的湯圓，態度如何？","o":["嫌棄","溫柔包容","毫不在意"],"a":1,"why":"她仍一個一個撿進鍋裡，還說「這顆最可愛」。"},{"q":"奶奶替表姊盛一碗放在空位前，說明什麼？","o":["湯圓煮得太多","要請鄰居來吃","惦記著不在身邊的家人"],"a":2,"why":"為缺席的人留一碗，表示心裡一直掛念她。"}],"title2":"一個節日的家人時光","hint":"寫一個你和家人一起過的節日（元宵、中秋、除夕等），至少用到兩種感官，寫出當天最溫暖的一個畫面。","starters":["節日那天，家裡","大家圍在一起，我聽見（聞到）"]},{"title":"嘮叨的另一面","theme":"家人與親情","text":["「外套帶了沒？」「水喝了沒？」「早點睡！」這些話，你是不是每天都聽到耳朵快長繭？我也是。","但有一天，媽媽出差，家裡突然安靜下來。早上出門前沒人提醒我帶傘，晚上沒人問我吃飽了沒，連冰箱的嗡嗡聲都變得特別清楚。我這才發現，原來那些聲音像家裡的背景音樂，平常不覺得，少了才知道它一直都在。","當然，嘮叨聽久了確實會煩，這是很自然的。我們可以試著告訴父母：「我記得了，謝謝你提醒。」比起不耐煩地頂嘴，這樣更容易讓對話變得輕鬆。","嘮叨的內容也許有點重複，但背後的心情很簡單：他們只是想確定我們平安。下一次聽到「早點睡」，不妨回一句「好，你也是」。"],"gj":[{"s":"這些話，你是不是每天都聽到耳朵快長繭？","t":"設問與誇飾","n":"用問句拉近讀者，「耳朵長繭」誇張卻貼切，立刻引起共鳴。"},{"s":"連冰箱的嗡嗡聲都變得特別清楚","t":"聽覺摹寫","n":"用安靜時才聽得到的小聲音，反襯家裡突然少了人聲。"},{"s":"那些聲音像家裡的背景音樂，平常不覺得，少了才知道它一直都在","t":"譬喻","n":"把嘮叨比成背景音樂，既說明它的存在感，也點出珍惜的理由。"}],"w":[{"w":"嘮叨","m":"反覆說個不停"},{"w":"頂嘴","m":"用話反駁長輩"},{"w":"提醒","m":"從旁告知，讓人注意"}],"quiz":[{"q":"作者認為嘮叨背後的心情是什麼？","o":["想確定我們平安","覺得我們不夠努力","沒有別的事可做"],"a":0,"why":"第四段明說「他們只是想確定我們平安」。"},{"q":"媽媽出差時，作者注意到什麼？","o":["家裡變得很吵","家裡很安靜，連冰箱聲都很清楚","冰箱突然壞掉"],"a":1,"why":"第二段寫到「連冰箱的嗡嗡聲都變得特別清楚」。"}],"title2":"家人常說的一句話","hint":"寫一句家人常對你說的話，描寫說這句話時的聲音、表情或動作，再寫你當下和後來的感受。","starters":["媽媽（爸爸、阿嬤）最常對我說的一句話是……","聽到這句話的時候，"]},{"title":"弟弟的襪子","theme":"家人與親情","text":["弟弟的襪子有一種特殊的能力：自己會逃跑。每天晚上脫下來，隔天就分別出現在沙發底下、書包裡，還有一次，在冰箱的蛋盒旁邊。","更厲害的是氣味。我只是走過他房間門口，就被一股酸酸悶悶的味道撞個正著，像有人把一顆過期的橘子悶在鞋盒裡。我捏著鼻子大喊：「這已經違反環保法了！」弟弟頭也不抬，說：「那是我的香水。」","媽媽終於忍無可忍，宣布全家總動員洗襪子。浴室裡水聲嘩啦嘩啦，泡泡堆得像小山，弟弟用腳踩著襪子，踩得吱吱作響，笑得比誰都開心。","晾在陽台的那一排襪子，被風吹得輕輕搖擺，像一排舉手投降的小白旗。我深深吸了一口氣：嗯，終於是肥皂味了。"],"gj":[{"s":"被一股酸酸悶悶的味道撞個正著，像有人把一顆過期的橘子悶在鞋盒裡","t":"嗅覺摹寫與譬喻","n":"「撞」讓氣味有了力道，橘子的比喻又怪又準，讓人忍不住皺鼻子。"},{"s":"浴室裡水聲嘩啦嘩啦，泡泡堆得像小山","t":"聽覺與視覺摹寫","n":"一句寫聲音，一句寫畫面，把洗襪子的熱鬧場面寫得很完整。"},{"s":"像一排舉手投降的小白旗","t":"譬喻","n":"把晾著的襪子比成投降的小白旗，也呼應臭味終於被打敗的趣味。"}],"w":[{"w":"忍無可忍","m":"忍耐到了極限"},{"w":"晾","m":"把東西放在通風處使它乾"},{"w":"搖擺","m":"左右輕輕擺動"}],"quiz":[{"q":"下列哪一處是襪子出現過的地方？","o":["微波爐裡","媽媽的皮包裡","冰箱的蛋盒旁邊"],"a":2,"why":"第一段寫襪子曾出現在冰箱蛋盒旁邊。"},{"q":"「像一排舉手投降的小白旗」有什麼效果？","o":["用白旗比喻晾著的襪子，並帶出幽默感","說明襪子被洗壞了","表示弟弟在比賽"],"a":0,"why":"把一排晾著的襪子比成白旗，又暗示臭味被洗掉、算是『投降』，充滿趣味。"}],"title2":"家裡的一件爆笑小事","hint":"寫一件家人之間發生的好笑小事，至少用一句氣味或聲音的描寫，讓讀者像在現場。","starters":["我家有一個令人頭痛（又好笑）的問題，","那天，我一走進……"]},{"title":"午休鐘響以後","theme":"校園生活","text":["午休鐘一響，教室像被按下了開關。有人把頭埋進手臂，有人飛快翻開便當盒的蓋子，筷子敲在鐵盒上，叮叮噹噹。","我的同桌小宇最特別，他先把外套的帽子拉上，再把書包墊在額頭下，最後才慢慢滑到桌面上，整個人縮成一隻圓圓的蝦子。三十秒後，他的呼吸就變得又深又長。","我偷偷拿起筆，在他的手背上畫了一隻小烏龜。他沒醒，只是皺了皺鼻子，手指微微彈了一下，好像在趕蒼蠅。","窗外的風扇嗡嗡轉著，窗簾一鼓一鼓。我也趴下來，把臉埋進手臂，聽見全班的呼吸聲，慢慢整齊成同一個節奏。"],"gj":[{"s":"他先把外套的帽子拉上，再把書包墊在額頭下，最後才慢慢滑到桌面上","t":"連續動作描寫","n":"用「先、再、最後」拆開動作，像慢動作鏡頭，把小宇睡覺的儀式感寫活。"},{"s":"整個人縮成一隻圓圓的蝦子","t":"譬喻","n":"蝦子彎曲的形狀，剛好對應趴睡的姿勢，簡短而準確。"},{"s":"手指微微彈了一下，好像在趕蒼蠅","t":"細節描寫","n":"睡著時的小反應最真實，也有趣，讓讀者看見他被打擾的樣子。"}],"w":[{"w":"同桌","m":"坐在同一張桌子的同學"},{"w":"節奏","m":"聲音或動作有規律的快慢"},{"w":"開關","m":"控制電器通斷的裝置"}],"quiz":[{"q":"文中小宇睡覺的姿勢被比喻成什麼？","o":["蜷曲的小貓","圓圓的蝦子","攤平的煎餅"],"a":1,"why":"文中寫「整個人縮成一隻圓圓的蝦子」。"},{"q":"結尾「全班的呼吸聲，慢慢整齊成同一個節奏」呈現什麼景象？","o":["老師要求大家整齊","作者感到孤單","教室逐漸安靜，大家都沉入午睡"],"a":2,"why":"呼吸聲一致，暗示全班都睡著，氣氛安靜平和。"}],"title2":"午休的小宇宙","hint":"寫你班上午休（或下課）時一位同學的一連串動作，用「先……再……最後……」，並加一個小細節。","starters":["午休鐘一響，","我的同學（鄰座）"]},{"title":"下課的走廊","theme":"校園生活","text":["下課鐘聲還在空氣裡震動，走廊已經像被打開的汽水，咕嘟咕嘟冒出一堆人。","隔壁班的男生抱著籃球衝出教室，鞋底在磁磚上吱吱作響；兩個女生靠在欄杆邊，頭湊在一起，肩膀一抖一抖地笑，不知道在分享什麼祕密。福利社的方向傳來排隊的吆喝聲，有人踮著腳尖往前張望，手裡緊緊握著幾枚銅板。","值日生拿著板擦，在走廊盡頭用力拍打，粉筆灰飄起來，在斜斜的陽光裡閃閃發亮，像一場小小的、安靜的雪。","然後預備鐘響了，那些喧鬧一下子被收回教室，只剩一只被遺忘的水壺，立在欄杆上，反射著窗外的光。"],"gj":[{"s":"走廊已經像被打開的汽水，咕嘟咕嘟冒出一堆人","t":"譬喻","n":"把人群湧出比成汽水冒泡，說明下課的氣氛輕快又擁擠。"},{"s":"兩個女生靠在欄杆邊，頭湊在一起，肩膀一抖一抖地笑","t":"動作細節描寫","n":"沒有說她們在笑什麼，只寫頭與肩膀的動作，就讓祕密的氣氛浮現。"},{"s":"粉筆灰飄起來，在斜斜的陽光裡閃閃發亮，像一場小小的、安靜的雪","t":"光影細節與譬喻","n":"把平常覺得髒的粉筆灰，寫成安靜的雪，轉換了讀者的眼光。"}],"w":[{"w":"吆喝","m":"大聲叫喊"},{"w":"喧鬧","m":"吵吵鬧鬧、聲音很大"},{"w":"踮","m":"腳跟抬起、用腳尖站立"}],"quiz":[{"q":"預備鐘響之後，走廊上還留下什麼？","o":["一只被遺忘的水壺","值日生的板擦","一顆籃球"],"a":0,"why":"最後一段寫「只剩一只被遺忘的水壺」。"},{"q":"「走廊已經像被打開的汽水」用來比喻什麼？","o":["天氣悶熱","學生一下子湧出來的熱鬧","教室裡很安靜"],"a":1,"why":"汽水一打開就冒泡，比喻下課時人群湧出。"}],"title2":"我眼中的下課十分鐘","hint":"寫下課時你在走廊、福利社或操場看到的一個場景，抓住兩個以上的動作和一個小細節。","starters":["下課鐘一響，","我站在（走廊、福利社）旁，"]},{"title":"黑板前的老師","theme":"校園生活","text":["數學老師姓陳，個子不高，走路時習慣把雙手背在身後，粉筆盒夾在左手手指之間。他總是穿著洗得有點發白的藍襯衫，袖口捲到手肘，露出一截曬得黝黑的手臂。","他講題目的時候不看課本。粉筆在黑板上沙沙畫過，一條斜線、一個圓，三兩下就把複雜的圖形拆開。每次講到關鍵處，他會停下來，拿粉筆輕輕敲兩下黑板，然後轉過身，瞇起眼睛問：「看出來了嗎？」","有一回，我盯著一題幾何發呆，他走到我座位旁，彎下腰，用食指在我的考卷上點了一個小點，什麼也沒說，就走開了。我低頭看，才發現那個點，正是我漏掉的輔助線的起點。","下課時，他蹲在講桌旁，一根一根撿起掉落的粉筆頭，吹掉灰塵，排回盒子裡。"],"gj":[{"s":"露出一截曬得黝黑的手臂","t":"外貌細節描寫","n":"用一個局部的特寫代替「他很常運動」這類說明，讓人物更具體。"},{"s":"他走到我座位旁，彎下腰，用食指在我的考卷上點了一個小點，什麼也沒說，就走開了","t":"動作描寫","n":"幾個連續的小動作，加上「什麼也沒說」，把老師的細心與留白寫得很好。"},{"s":"一根一根撿起掉落的粉筆頭，吹掉灰塵，排回盒子裡","t":"連續動作與細節","n":"結尾用珍惜小東西的動作，不必評論，就讓人感覺老師的認真。"}],"w":[{"w":"黝黑","m":"皮膚被曬得深黑"},{"w":"關鍵","m":"最重要、起決定作用的地方"},{"w":"輔助線","m":"幫助解題而添加的線"}],"quiz":[{"q":"老師在考卷上點一個小點，是為了什麼？","o":["指出計算錯誤","責備我發呆","暗示輔助線的起點"],"a":2,"why":"作者低頭看才發現那個點正是漏掉的輔助線的起點。"},{"q":"結尾老師撿起粉筆頭的動作，最能表現他怎樣的性格？","o":["珍惜物品、細心認真","脾氣暴躁","喜歡偷懶"],"a":0,"why":"一根一根撿、吹灰、排好，顯示細心與愛惜。"}],"title2":"一位老師的招牌動作","hint":"寫一位老師（或校內的一位大人），挑兩個他獨特的動作和一個外貌細節，不要直接寫「他很……」。","starters":["我們的老師有個習慣，","每當他（她）走進教室，"]},{"title":"掃地的學問","theme":"校園生活","text":["在學校，掃地看起來只是拿著掃把揮一揮，但想把教室掃乾淨，其實有一些小訣竅。","首先是順序。要先清桌椅底下和角落，再掃走道，最後才處理門口，這樣灰塵才不會被反覆踩回已經掃好的地方。掃的時候，掃把要貼著地面，輕輕地、一下一下往同一個方向帶，而不是用力左右亂甩，否則灰塵只會飄起來，再落回原處。","接著是分工。負責掃地的人把垃圾集中成一小堆，拿畚箕的人蹲低身體，讓畚箕邊緣緊貼地面，這樣細小的紙屑才不會從縫隙溜走。拖地的人則要記得先擰乾拖把，從教室最裡面往門口退著拖，才不會踩到剛拖好的地板。","做好這些小細節，原本拖拖拉拉的打掃時間，常常可以縮短不少。下次輪到你打掃時，不妨試試看。"],"gj":[{"s":"掃把要貼著地面，輕輕地、一下一下往同一個方向帶","t":"動作描寫","n":"把掃地的手勢寫得具體，讀者馬上能照著做，是說明文裡很實用的寫法。"},{"s":"拿畚箕的人蹲低身體，讓畚箕邊緣緊貼地面","t":"動作細節","n":"特別寫出身體與器具的位置，說明為什麼紙屑不會溜走。"},{"s":"否則灰塵只會飄起來，再落回原處","t":"因果說明","n":"用「否則」說出做錯的後果，讓方法的理由更有說服力。"}],"w":[{"w":"訣竅","m":"做事的巧妙方法"},{"w":"畚箕","m":"用來盛裝垃圾的簸箕"},{"w":"擰乾","m":"用力扭轉擠出水分"}],"quiz":[{"q":"文中說拖地時應該怎麼做？","o":["從門口往裡面拖","先擰乾拖把，從裡面往門口退著拖","不必擰乾拖把"],"a":1,"why":"第三段說要擰乾拖把，從最裡面往門口退著拖。"},{"q":"全文的主旨最接近下列何者？","o":["學校應該請清潔公司","打掃是一種處罰","掃地雖小，掌握順序、動作與分工會更有效率"],"a":2,"why":"全文逐項說明掃地的順序、動作與分工，目的是更有效率。"}],"title2":"我會的一項小技巧","hint":"寫一件你很會做的家事或校園小事（擦黑板、摺棉被、洗碗），說明步驟，並描寫其中一個關鍵動作。","starters":["要把（這件事）做好，","首先，我會"]},{"title":"最後一排","theme":"校園生活","text":["換座位那天，我抽到了最後一排靠窗的位置。抱著書包走過整間教室時，同學們的後腦杓一顆一顆從身旁掠過，像一排整齊的小山丘。","坐下來之後，我才發現世界變得不一樣。黑板變小了，老師的聲音遠遠的，卻能看見所有人的背影：有人偷偷轉筆，有人用手指捲著頭髮，有人把下巴頂在手背上，眼睛慢慢瞇成一條線。","窗外有一棵榕樹，風一吹，葉子翻出銀綠色的背面，沙沙作響。我用手指描著桌面上前人用鉛筆寫下的小字，字很淺，被橡皮擦磨得有些模糊，還是看得出是一個日期，和一顆小小的星星。","不知道是誰留下的。我拿出鉛筆，在旁邊輕輕畫了第二顆，讓它們相伴。"],"gj":[{"s":"同學們的後腦杓一顆一顆從身旁掠過，像一排整齊的小山丘","t":"譬喻","n":"把一顆顆後腦杓比成山丘，並用「掠過」帶出走動的速度，視角很新鮮。"},{"s":"有人偷偷轉筆，有人用手指捲著頭髮，有人把下巴頂在手背上","t":"動作細節描寫","n":"三個不同的小動作並列，寫出從後排才看得見的眾生相。"},{"s":"風一吹，葉子翻出銀綠色的背面，沙沙作響","t":"視覺與聽覺細節","n":"寫出葉子翻面的瞬間與聲音，是只有靠窗才看得到的小細節。"}],"w":[{"w":"掠過","m":"很快地擦過"},{"w":"模糊","m":"不清楚、看不真切"},{"w":"相伴","m":"互相陪伴"}],"quiz":[{"q":"作者在桌面上發現了什麼？","o":["一個日期和一顆小星星","一首短詩","一個同學的名字"],"a":0,"why":"第三段說是「一個日期，和一顆小小的星星」。"},{"q":"結尾作者在旁邊畫第二顆星，表示什麼？","o":["想破壞桌面","對陌生前人的善意與連結","對座位不滿意"],"a":1,"why":"他用鉛筆輕輕畫，讓星星相伴，表達與前人的溫柔連結。"}],"title2":"換座位以後","hint":"寫你換到某個新位置（教室、公車、補習班）的所見，挑兩種人的動作和一個窗外的細節來寫。","starters":["坐到這個位置，我才發現","從這裡看出去，"]},{"title":"站上講台","theme":"校園生活","text":["輪到上台報告時，你是不是也有過這種經驗：手心冒汗、喉嚨乾乾的，明明背得很熟，一站上講台卻全忘光？","我認為，緊張並不丟臉，反而說明你在乎。真正的問題，是我們常常把「不能緊張」當成目標，結果越要求自己，越緊張。","比較實際的做法，是把緊張當成一位愛湊熱鬧的同學，允許它跟你一起上台。你可以先站穩雙腳，慢慢吸一口氣，把手放在講稿的邊緣，然後看向教室後排的牆壁或某位友善的同學。這些小動作能讓身體先穩下來，聲音也會跟著穩。","站上講台一次，緊張就少一點；站上兩次，講稿就熟一點。講台再高，也不過比地板高出一小階，一步就能踏上去。"],"gj":[{"s":"手心冒汗、喉嚨乾乾的，明明背得很熟，一站上講台卻全忘光","t":"生理細節描寫","n":"用身體反應取代「很緊張」三個字，讀者馬上有同感。"},{"s":"把緊張當成一位愛湊熱鬧的同學，允許它跟你一起上台","t":"擬人","n":"把情緒當成同學，讓人不再把緊張當敵人，語氣輕鬆。"},{"s":"站上講台一次，緊張就少一點；站上兩次，講稿就熟一點","t":"層遞","n":"次數遞增，效果也遞增，把進步說得簡單而可期待。"}],"w":[{"w":"湊熱鬧","m":"跟著大家一起參與"},{"w":"講稿","m":"演講時使用的稿子"},{"w":"實際","m":"符合現實、可以做到"}],"quiz":[{"q":"作者建議如何面對上台的緊張？","o":["強迫自己完全不緊張","盡量避免上台","接受緊張，並用小動作穩住身體"],"a":2,"why":"第三段主張允許緊張同行，並以站穩、深呼吸等動作穩住。"},{"q":"「把緊張當成一位愛湊熱鬧的同學」運用了何種修辭？","o":["擬人","誇飾","排比"],"a":0,"why":"把情緒當成人，說它會「湊熱鬧」，是擬人。"}],"title2":"我上台的那一次","hint":"寫一次你上台（報告、比賽、表演）的經驗，用動作和身體反應寫出緊張，不要只寫「我很緊張」。","starters":["輪到我的時候，","我走上台，"]},{"title":"抽屜裡的生態","theme":"校園生活","text":["我的抽屜是一個獨立的生態系。上週我伸手進去摸課本，摸到一塊軟軟的東西，抽出來一看，是很久以前忘了吃的半片吐司，已經長出一圈綠色的絨毛，像戴了一頂小毛帽。","我倒抽一口氣，用兩根手指捏著吐司，像捏著一隻死掉的蟑螂，一路踮腳尖走向垃圾桶。同學們紛紛閃開，像水面被石頭激起的漣漪，一圈一圈向外散開。","老師站在講台上，推了推眼鏡，說：「我們來複習一下，抽屜是放書的地方。」全班哄堂大笑。我臉紅得像剛出爐的蝦子，默默把抽屜裡的紙團、橡皮擦屑和三張過期的考卷，一樣一樣挖出來，排在桌面上。","清完的抽屜空空蕩蕩，連回音都有了。我拍拍手上的灰，滿意地把課本放進去，然後順手，把一包餅乾也塞到了最裡面。"],"gj":[{"s":"已經長出一圈綠色的絨毛，像戴了一頂小毛帽","t":"譬喻","n":"把發霉寫得可愛，讓原本噁心的畫面變成笑點。"},{"s":"用兩根手指捏著吐司，像捏著一隻死掉的蟑螂，一路踮腳尖走向垃圾桶","t":"動作描寫","n":"兩根手指和踮腳尖兩個細節，讓人看見作者嫌棄又小心的模樣。"},{"s":"清完的抽屜空空蕩蕩，連回音都有了","t":"誇飾","n":"空到有回音，是誇張的說法，用來襯托前面抽屜之亂。"}],"w":[{"w":"倒抽一口氣","m":"突然吸氣，表示驚訝"},{"w":"絨毛","m":"細細軟軟的毛"},{"w":"哄堂大笑","m":"滿屋子的人一起大笑"}],"quiz":[{"q":"作者在抽屜裡摸到什麼？","o":["過期的餅乾","長了絨毛的半片吐司","一隻死掉的蟑螂"],"a":1,"why":"文中寫那是「忘了吃的半片吐司」，長出綠色絨毛。"},{"q":"結尾作者又把餅乾塞進抽屜最裡面，暗示什麼？","o":["他已經學會不放食物","老師要求他這麼做","他可能又會重蹈覆轍"],"a":2,"why":"明明剛清完，卻又塞入食物，帶出幽默的伏筆。"}],"title2":"我桌上（書包）的小災難","hint":"寫一次你整理（或找不到）東西的經歷，用連續的動作和一個幽默的比喻，寫出那種狼狽。","starters":["打開（書包）的那一刻，","我伸手進去，"]},{"title":"借橡皮擦","theme":"朋友與友誼","text":["數學小考進行到一半，我的橡皮擦從桌緣滾下去，骨碌碌地鑽進隔壁同學的椅子底下。我不敢出聲，只好用筆尾輕輕敲了敲他的桌角。","他轉過頭，用氣音問：「幹嘛？」我指指地板，也用氣音回答：「橡皮擦，在你腳邊。」他低頭看了看，又抬起頭，一臉嚴肅地說：「掉在我的領土上，要付過路費喔。」","我瞪大眼睛，他卻自己先笑出聲來，被老師瞥了一眼。他趕緊撿起橡皮擦，偷偷塞進我手心，還用鉛筆在上面畫了一個小小的笑臉。考卷發下來，我只考了八十二分，可是那個笑臉，我一直捨不得擦掉。"],"gj":[{"s":"一臉嚴肅地說：「掉在我的領土上，要付過路費喔。」","t":"對話描寫","n":"用一本正經的神情配上荒唐的玩笑話，反差製造幽默，也看得出兩人的熟稔。"},{"s":"骨碌碌地鑽進隔壁同學的椅子底下","t":"摹寫","n":"「骨碌碌」模擬滾動的聲音，讓橡皮擦的動作又有聲音又有畫面。"},{"s":"偷偷塞進我手心，還用鉛筆在上面畫了一個小小的笑臉","t":"動作描寫","n":"兩個動作寫出同學的體貼與俏皮，不必直說友情，情意已在其中。"}],"w":[{"w":"氣音","m":"不發出明顯聲響、只用氣息說話的聲音"},{"w":"嚴肅","m":"神情態度認真、不隨便"},{"w":"領土","m":"一個國家或個人所掌管的土地範圍"}],"quiz":[{"q":"「我」為什麼用筆尾輕輕敲同學的桌角？","o":["想悄悄引起他的注意，又不驚動老師","想催他快點交考卷","想問他某一題的答案"],"a":0,"why":"考試中不能出聲，所以用輕敲提醒對方，文中也提到他不敢出聲。"},{"q":"同學說「掉在我的領土上，要付過路費喔」，主要效果是什麼？","o":["表示他真的很生氣要收錢","用誇張的玩笑話緩和緊張，顯出親切","說明考試中撿東西的規定"],"a":1,"why":"這是玩笑話，目的在逗人發笑，之後他自己先笑出聲，可見並非認真。"}],"title2":"我和朋友之間的小趣事","hint":"選一件你和朋友之間的小事，寫出至少兩句雙方真正會說的話，並在話前後加上表情或動作，例如「他壓低聲音說」。","starters":["那天下課，朋友突然轉過頭問我：「","我們一邊走一邊吵，我說：「"]},{"title":"放學後的操場","theme":"朋友與友誼","text":["下午五點，夕陽把操場染成一片橘紅色。籃球架的影子長長地躺在跑道上，像一個伸懶腰的巨人。","階梯上，兩個同學正分著一包餅乾。「你的比較多吧？」「才沒有，一樣啦！」他們邊吵邊笑，餅乾屑掉了一地，引來幾隻麻雀蹦蹦跳跳地搶食。","遠處傳來補習班接送車的喇叭聲，有人拎起書包，揮著手喊：「明天見！」「明天見！」聲音在空蕩蕩的操場上彈來彈去。風吹過來，帶著青草和汗水的味道，那兩條長長的影子慢慢靠在一起，又慢慢分開。"],"gj":[{"s":"籃球架的影子長長地躺在跑道上，像一個伸懶腰的巨人。","t":"譬喻","n":"把長長的影子比成伸懶腰的巨人，又讓影子「躺」著，畫面悠閒生動。"},{"s":"「你的比較多吧？」「才沒有，一樣啦！」","t":"對話描寫","n":"只用兩句短短的來回對話，就讓人聽見朋友鬥嘴的語氣，不必另外解釋。"},{"s":"聲音在空蕩蕩的操場上彈來彈去。","t":"轉化","n":"把看不見的聲音寫成會彈跳的球，也襯出操場的空曠。"}],"w":[{"w":"夕陽","m":"傍晚時西下的太陽"},{"w":"空蕩蕩","m":"形容地方沒什麼人或東西，很寬闊冷清"},{"w":"蹦蹦跳跳","m":"輕快跳動的樣子"}],"quiz":[{"q":"兩個同學在階梯上「邊吵邊笑」，他們吵的是什麼？","o":["誰先離開操場","補習班該不該去","誰分到的餅乾比較多"],"a":2,"why":"文中對話是「你的比較多吧」，由此可知是在爭餅乾的份量，而且氣氛輕鬆。"},{"q":"「聲音在空蕩蕩的操場上彈來彈去」用了哪種修辭？","o":["轉化","排比","設問"],"a":0,"why":"把聲音當成能彈跳的東西，是將一種事物寫成另一種事物的轉化。"}],"title2":"放學後，我和朋友","hint":"寫一個放學後和朋友相處的場景，先寫景（天色、聲音、味道），再放進一小段對話。","starters":["放學的鐘聲一響，","走出校門時，朋友拉了拉我的袖子說：「"]},{"title":"祕密警報","theme":"朋友與友誼","text":["我的同桌有個奇怪的習慣：每次想說祕密之前，一定先把筆蓋咬在嘴裡。我們都叫這是「祕密警報」。","這天下課，警報響了。他壓低聲音說：「欸，我跟你說，不要告訴別人。」我點點頭，湊過去。他頓了一下，小聲地說：「我昨天晚上，把整包洋芋片都吃完了。」我差點笑翻：「這算什麼祕密？」「對我來說很大條好嗎！」他漲紅了臉。","其實我知道，他是在試探我值不值得信任。他的心事總是用小小的祕密包裝，一次放一點，像在池塘邊丟小石子。後來，他終於說出了考差的難過，我沒有多問，只是把書包裡最後一顆軟糖，輕輕推到他的桌上。"],"gj":[{"s":"他壓低聲音說：「欸，我跟你說，不要告訴別人。」","t":"對話描寫","n":"先寫動作與聲音，再接說話內容，讓人彷彿看見他湊近耳邊的樣子。"},{"s":"「對我來說很大條好嗎！」他漲紅了臉。","t":"對話描寫","n":"口語的語氣加上臉紅的神態，把一個又急又窘的同學寫得很真實。"},{"s":"像在池塘邊丟小石子","t":"譬喻","n":"把一點一點試探的說話方式比成丟石子，既形象又貼切。"}],"w":[{"w":"壓低","m":"把聲音放小、放低"},{"w":"試探","m":"用小動作或話語探聽對方的反應"},{"w":"包裝","m":"把事物裝飾或遮蓋起來，這裡指用小事掩護真正的心事"}],"quiz":[{"q":"作者認為同桌一次只說一點小祕密，是為了什麼？","o":["吸引全班的注意","確認我值不值得信任","顯示自己很誠實"],"a":1,"why":"文中說「他是在試探我值不值得信任」，所以小祕密像丟小石子一樣先探探水深。"},{"q":"「祕密警報」在文中指的是什麼？","o":["學校用來點名的鈴聲","老師發現作弊時的暗號","同桌咬筆蓋，代表他要說祕密了"],"a":2,"why":"文章開頭交代，他每次說祕密前會先咬筆蓋，大家便戲稱為祕密警報。"}],"title2":"一個朋友的小習慣","hint":"寫一個朋友獨有的小習慣，說明它代表什麼，並寫出一次他說話時的原話。","starters":["我有個朋友，每次要說重要的事之前，一定會","他的口頭禪是「"]},{"title":"友誼怎麼長出來","theme":"朋友與友誼","text":["友誼不像泡麵，倒進熱水三分鐘就好。它比較像種一盆小植物，需要時間，也需要日常的照顧。","觀察一下就會發現，許多好朋友的開始都很平凡：坐在隔壁、同一組、同一個社團，或是補習班裡共撐一把傘。常常見面，讓我們有機會聊天；聊得來，又讓我們想再多見幾次。於是從「你好」變成「欸，等我一下」，距離一點一點縮短。","不過，要讓友誼維持下去，光靠見面還不夠。願意傾聽、記得對方說過的小事、在對方難過時不急著給答案，這些小小的舉動就像澆水和曬太陽。若是有了爭執，說一聲「剛剛我太急了」，往往比任何解釋都有用。盆栽的葉子，就這樣悄悄地長出來。"],"gj":[{"s":"它比較像種一盆小植物，需要時間，也需要日常的照顧。","t":"譬喻","n":"用大家熟悉的泡麵與盆栽對照，立刻讓人懂得友誼需要慢慢培養。"},{"s":"於是從「你好」變成「欸，等我一下」，距離一點一點縮短。","t":"對話描寫","n":"只引兩句簡單的話，就看出兩人由陌生到熟悉，比直接說「變親近」更生動。"},{"s":"盆栽的葉子，就這樣悄悄地長出來。","t":"呼應","n":"回到開頭的盆栽比喻，用畫面結尾，餘味比講道理更自然。"}],"w":[{"w":"傾聽","m":"專心用心地聽別人說話"},{"w":"爭執","m":"因意見不同而爭吵"},{"w":"日常","m":"平常的生活"}],"quiz":[{"q":"依照文章，許多好朋友的開始通常是什麼樣子？","o":["在平凡的相處機會中慢慢熟起來","因為一次重大的事件而結識","必須有相同的興趣才能開始"],"a":0,"why":"文中舉出坐隔壁、同一組、同社團等平凡情境，說明友誼往往從日常相處開始。"},{"q":"作者用「種一盆小植物」來比喻友誼，主要想說明什麼？","o":["友誼很容易枯萎","友誼需要時間與持續的照顧","交朋友要先挑選對象"],"a":1,"why":"文中提到需要時間、日常照顧，並以澆水、曬太陽比喻傾聽與關心。"}],"title2":"我們是怎麼變成朋友的","hint":"回想你和一位好朋友如何認識，寫出第一次說話的情形，並說一說後來哪件小事讓你們更親近。","starters":["我和他成為朋友，是從一個很小的巧合開始：","第一次和他說話，是在"]},{"title":"沒寄出的訊息","theme":"朋友與友誼","text":["你轉學的那天，天空下著細細的雨。你把一張紙條塞進我的鉛筆盒，轉身就跑，連一句再見都沒說完。","後來我常想，如果那天我追了出去，會說些什麼？是「你到了新學校要記得吃早餐」，還是「我們週末再一起去買雞蛋糕」？手機裡有一則編輯過很多次的訊息，打了又刪，刪了又打，最後仍然躺在草稿匣裡。","昨天整理抽屜，我又看見那張紙條，上面只有四個字：「換你寫給我。」我拿起筆，在窗邊坐了很久。窗外的雨停了，一道光斜斜地落在信紙上，亮得像一句遲到的再見。"],"gj":[{"s":"你把一張紙條塞進我的鉛筆盒，轉身就跑，連一句再見都沒說完。","t":"動作描寫","n":"連續的動作寫出離別的倉促，也暗示對方其實不敢面對道別。"},{"s":"手機裡有一則編輯過很多次的訊息，打了又刪，刪了又打，最後仍然躺在草稿匣裡。","t":"頂真","n":"「打了又刪，刪了又打」來回重複，寫出猶豫難捨；「躺」字把訊息寫得像有了心情。"},{"s":"一道光斜斜地落在信紙上，亮得像一句遲到的再見。","t":"譬喻","n":"把光比成遲到的再見，表示雖然晚了，溫柔的道別仍然到來。"}],"w":[{"w":"轉學","m":"從原來的學校改到另一所學校就讀"},{"w":"草稿匣","m":"電子郵件或訊息軟體中存放未送出內容的地方"},{"w":"遲到","m":"比預定的時間晚到"}],"quiz":[{"q":"手機裡的訊息「打了又刪，刪了又打」，表現出「我」怎樣的心情？","o":["對朋友非常生氣","訊息其實已經送出","想聯絡卻不知如何開口的猶豫"],"a":2,"why":"反覆刪改又沒寄出，說明心裡有很多話，卻怕說不好而猶豫。"},{"q":"紙條上寫著「換你寫給我」，最可能暗示什麼？","o":["朋友希望由我主動聯絡","朋友要借我的鉛筆盒","朋友想要回那張紙條"],"a":0,"why":"紙條在離別時留下，這句話像一個邀請，盼望我主動寫信給他。"}],"title2":"想寫給你的一封信","hint":"寫一封給某位朋友的短信，不必寄出，說說你最想對他說的話，並加入一個你們共同的小回憶。","starters":["當我整理書桌時，","如果現在能見到你，我想先說："]},{"title":"朋友要不要說真話","theme":"朋友與友誼","text":["朋友問你：「我新剪的瀏海是不是很怪？」這時候你會怎麼回答？有人覺得說真話才是好朋友，也有人覺得說點好聽的比較不傷感情。","我認為，真話和善意並不衝突。如果只是為了討好而說「超好看」，對方下次照鏡子時，說不定還是覺得怪。但如果直接說「真的很醜」，又像一把沒有鞘的刀，傷人在先。","比較好的做法，是把真話包上一層溫柔：「我覺得原本的比較適合你，不過你今天氣色很好。」這樣既誠實，也讓對方感覺被在乎。至於我自己，下次朋友再問起瀏海，我大概會笑著說：「很有個性喔，而且很快就會長長。」"],"gj":[{"s":"朋友問你：「我新剪的瀏海是不是很怪？」這時候你會怎麼回答？","t":"設問","n":"用一個大家都遇過的小場景開頭，再拋出問題，立刻引起讀者思考。"},{"s":"又像一把沒有鞘的刀，傷人在先。","t":"譬喻","n":"把直接的壞話比成沒有刀鞘的刀，說明不經修飾的話會讓人受傷。"},{"s":"比較好的做法，是把真話包上一層溫柔","t":"轉化","n":"把抽象的「真話」寫成可以包裝的東西，具體說明如何兼顧誠實與體貼。"}],"w":[{"w":"討好","m":"說好聽的話或做事來博取別人歡心"},{"w":"善意","m":"好心、友善的心意"},{"w":"衝突","m":"彼此對立、互相牴觸"}],"quiz":[{"q":"作者對於「朋友要不要說真話」的看法是什麼？","o":["只要說好聽的話就好","真話可以用溫柔的方式說出口","一律老實說，不必顧慮感受"],"a":1,"why":"作者主張真話與善意並不衝突，並建議把真話包上一層溫柔。"},{"q":"「像一把沒有鞘的刀」是形容哪一種說話方式？","o":["只為討好而說的假話","小聲說出來的祕密","毫不修飾、直接傷人的話"],"a":2,"why":"沒有刀鞘的刀容易傷人，對應前一句直接說「真的很醜」。"}],"title2":"朋友問我意見的時候","hint":"寫一次朋友請你給意見的經驗，說出你當時怎麼回答，並寫出你現在會怎麼說得更好。","starters":["上週，朋友拿著他的作品問我：「","我愣了一下，說：「"]},{"title":"便當交換條約","theme":"朋友與友誼","text":["我和前座的同學簽了一份「便當交換條約」：他的媽媽擅長做滷肉，我的媽媽擅長煎蛋，所以每週三，我們要交換一半的菜。條約是用原子筆寫在餐巾紙上的，還蓋了手印，非常正式。","第一個星期三，他挑走了我最大塊的荷包蛋。「這樣不公平吧！」我抗議。他邊嚼邊說：「條約第三條，蛋類由我優先挑選。」「哪有第三條？」「現在有了。」他從容地在餐巾紙上補寫了一行小字。","到了下週三，我如法炮製，夾走他最肥美的那塊滷肉。他瞪著我，我指著餐巾紙，笑得很得意。這時班導剛好走過，看見那張髒兮兮的條約，沉默了三秒，說：「可以順便幫我加一條嗎？每週五，我也要加入。」"],"gj":[{"s":"條約是用原子筆寫在餐巾紙上的，還蓋了手印，非常正式。","t":"幽默反差","n":"用最隨便的紙與筆，配上「非常正式」的評語，反差造成笑點。"},{"s":"「哪有第三條？」「現在有了。」","t":"對話描寫","n":"三言兩語就寫出同學耍賴的從容，與「我」的啞口無言，節奏明快。"},{"s":"他從容地在餐巾紙上補寫了一行小字。","t":"動作描寫","n":"「從容」一詞讓耍賴的動作顯得理所當然，反而更好笑。"}],"w":[{"w":"條約","m":"雙方約定共同遵守的文件"},{"w":"從容","m":"不慌不忙、鎮定自在"},{"w":"如法炮製","m":"照著別人的方法再做一遍"}],"quiz":[{"q":"「條約第三條」是怎麼出現的？","o":["同學當場在餐巾紙上補寫的","一開始就寫在條約中","老師在上面加註的"],"a":0,"why":"對話中「我」問哪有第三條，同學回答現在有了，並補寫小字。"},{"q":"班導最後說「我也要加入」，這個結尾的效果是什麼？","o":["表示老師要沒收條約","出乎意料，增加幽默感","說明便當不夠吃"],"a":1,"why":"一般會以為老師要制止，卻反過來想加入，這個意外轉折製造笑點。"}],"title2":"午餐時間的趣事","hint":"寫一件發生在午餐或福利社的有趣小事，要有兩個人的對話，讓讀者笑出來。","starters":["中午吃飯時，我的同學突然宣布：「","排隊買午餐時，我聽見前面的人說："]},{"title":"梅雨裡的教室","theme":"自然與四季","text":["梅雨季的早晨，天空像一塊擰不乾的抹布，把整個校園捂得潮潮的。我走進教室，發現窗戶玻璃上全是水氣，雨滴沿著玻璃慢慢爬行，像一群不趕時間的小蝸牛。","第三節是自習課，大家都安靜下來，只聽見雨在屋頂上敲鼓。隔壁同學的鞋子濕了，偷偷脫下來擺在走廊，襪子掛在椅背上，一滴一滴落著水。我低頭寫考卷，筆尖卻不自覺跟著雨點的節奏輕輕點著紙。","下課鈴響時，雨忽然小了。教室後方的盆栽伸直了腰，好像剛剛偷偷喝飽了水。我擦開一小塊玻璃，看見操場那頭，有人撐著傘跑過積水，濺起一朵一朵透明的小花。"],"gj":[{"s":"天空像一塊擰不乾的抹布","t":"譬喻","n":"把灰濛濛、滴著水氣的天空比成擰不乾的抹布，潮濕感立刻出來。"},{"s":"只聽見雨在屋頂上敲鼓","t":"擬人","n":"把雨寫成會敲鼓的人，讓雨聲有了節奏與生命。"},{"s":"濺起一朵一朵透明的小花","t":"轉化","n":"把水花轉化成小花，使雨天的畫面多了一點輕快與美感。"}],"w":[{"w":"梅雨","m":"春末夏初連續多日的陰雨天氣"},{"w":"不自覺","m":"沒有察覺、不知不覺"},{"w":"積水","m":"聚集在地面低窪處的水"}],"quiz":[{"q":"雨滴沿著玻璃慢慢爬行，像一群不趕時間的小蝸牛，主要表現玻璃上雨滴的什麼特點？","o":["顏色鮮豔","數量稀少","移動緩慢"],"a":2,"why":"蝸牛爬得慢，用來形容雨滴緩緩沿著玻璃滑下。"},{"q":"「雨在屋頂上敲鼓」運用了哪一種修辭？","o":["擬人","誇飾","排比"],"a":0,"why":"把雨當作會敲鼓的人，賦予人的動作，屬於擬人。"}],"title2":"一個下雨的日子","hint":"寫一個下雨天的教室或街道，至少用一個擬人句，讓雨、風或雲做出人的動作。","starters":["雨一直下，窗外的樹葉","走在濕漉漉的路上，我聽見"]},{"title":"秋天的校園","theme":"自然與四季","text":["十月的風一來，操場邊的欖仁樹開始換衣服。葉子先是黃，再是紅，最後變成深深淺淺的褐色，一片一片從樹上跳下來，像急著去赴約。","午後的陽光變得溫和，不再像夏天那樣凶巴巴地追著人跑。它輕輕趴在教室的窗台上，打著盹。福利社前的風鈴被風推了一下，叮叮噹噹地唱了兩句，又害羞地停了。","放學時，掃地的同學把落葉堆成一座小山。旁邊的人你推我擠，終於有人忍不住跳了進去，葉子嘩啦啦飛起來，笑聲也跟著飛得很高。夕陽把那座小山鍍上一層金色，彷彿整個秋天都躲在裡面。"],"gj":[{"s":"它輕輕趴在教室的窗台上，打著盹。","t":"擬人","n":"把陽光寫成會趴著打盹的動物，讓秋日午後顯得懶洋洋、很安靜。"},{"s":"福利社前的風鈴被風推了一下，叮叮噹噹地唱了兩句，又害羞地停了。","t":"擬人","n":"聲音是「唱」，停下來是「害羞」，把風鈴寫得有表情，又兼有聲音的摹寫。"},{"s":"笑聲也跟著飛得很高","t":"轉化","n":"把聲音轉成能飛的東西，帶出快樂的氣氛。"}],"w":[{"w":"赴約","m":"前往約定的地方會面"},{"w":"溫和","m":"不強烈、不刺激"},{"w":"鍍上","m":"在表面覆蓋薄薄的一層"}],"quiz":[{"q":"放學時，有人為什麼會跳進落葉堆？","o":["為了找掉在裡面的東西","忍不住想玩，覺得有趣","老師要求他整理落葉"],"a":1,"why":"文中說有人「忍不住跳了進去」，笑聲跟著飛起，可見是貪玩。"},{"q":"「不再像夏天那樣凶巴巴地追著人跑」，這句話最想表達什麼？","o":["夏天的操場很熱鬧","秋天的人們愛運動","秋天的陽光比夏天溫和"],"a":2,"why":"把夏陽寫成凶巴巴追人，對照秋陽的溫和，可知秋天陽光不再刺眼酷熱。"}],"title2":"我最喜歡的季節","hint":"選一個你最喜歡的季節，寫出它的顏色、聲音或氣味，並用一句擬人或轉化的句子表現。","starters":["如果季節會說話，秋天一定會","每到冬天，我家附近"]},{"title":"掃落葉的伯伯","theme":"自然與四季","text":["學校的校工伯伯每天清晨六點就到了，拿著一支比他還高的竹掃把，沙沙、沙沙地掃著落葉。我常想，那些葉子是不是故意等他來，才肯離開樹枝？","有一回我提早到校，看見他蹲在花圃旁邊，對著一株快枯萎的杜鵑說話：「乖，再撐一下，過幾天就下雨了。」我忍不住笑出聲，他也不害羞，抬頭說：「植物聽得懂的啦，你對它好，它就對你好。」","到了春天，那株杜鵑竟然開了花，粉紅色的一小團，探出頭來看著大家。伯伯站在旁邊，把掃把當枴杖拄著，笑得眼角都是皺紋，像一朵也開了花的老樹。"],"gj":[{"s":"我常想，那些葉子是不是故意等他來，才肯離開樹枝？","t":"擬人","n":"用設問把葉子寫得有心思，也表現伯伯天天掃葉的日常。"},{"s":"「乖，再撐一下，過幾天就下雨了。」","t":"對話描寫","n":"對花說話的口吻像哄小孩，很能看出他愛惜植物的溫柔。"},{"s":"笑得眼角都是皺紋，像一朵也開了花的老樹","t":"譬喻","n":"把伯伯的笑容比成開花的老樹，與前文杜鵑開花呼應，充滿歡喜。"}],"w":[{"w":"清晨","m":"天剛亮的早上"},{"w":"枯萎","m":"植物因缺水或衰老而乾癟凋謝"},{"w":"探出頭","m":"把頭從遮蔽處伸出來"}],"quiz":[{"q":"伯伯對杜鵑說話，最能表現他什麼特質？","o":["愛護植物，用心照顧","喜歡對人發號施令","擔心學校評比"],"a":0,"why":"他像對孩子一樣哄著杜鵑，並說對它好它就對你好，顯示用心愛護。"},{"q":"文中「像一朵也開了花的老樹」比喻的是什麼？","o":["杜鵑長得很高大","伯伯笑得燦爛的樣子","學校的老榕樹"],"a":1,"why":"伯伯見到花開，笑得臉上皺紋展開，如同開花的老樹，與杜鵑呼應。"}],"title2":"校園裡的一位大人","hint":"寫一位在學校或社區默默工作的人，描寫一個他做事的動作和他說過的一句話。","starters":["每天早上，我都會在校門口看見","他對我說過的一句話是："]},{"title":"颱風是怎麼來的","theme":"自然與四季","text":["台灣的夏末與秋天，常聽到「颱風來了」的新聞，同學們最期待的，大概是「明天會不會放假」。可是你知道嗎？颱風的旅程，其實在遙遠的海上就開始了。","夏秋之際，太平洋上的海水被太陽曬得很溫暖，海面的水氣不斷往上升，形成厚厚的雲。當這些雲聚在一起、開始旋轉，就可能慢慢發展成熱帶低壓，再變強，成為颱風。它像一個巨大的陀螺，靠近中心的地方風力特別強，外圍則帶來大範圍的雨。","颱風靠近時，氣象單位會發布警報，各縣市再依情況決定是否停班停課。這時，把窗邊的盆栽搬進屋內、檢查排水孔有沒有堵塞、準備手電筒，都是很實用的小準備。等風雨過去，天空常常洗得特別藍，彷彿大地剛剛洗了一場澡。"],"gj":[{"s":"可是你知道嗎？颱風的旅程，其實在遙遠的海上就開始了。","t":"設問","n":"用提問吸引注意，並把颱風的形成說成一趟旅程，說明文也能生動。"},{"s":"它像一個巨大的陀螺","t":"譬喻","n":"用陀螺比喻颱風旋轉的樣子，讓抽象的氣象現象變得容易想像。"},{"s":"彷彿大地剛剛洗了一場澡","t":"擬人","n":"把風雨後乾淨清新的景象寫成大地洗澡，結尾輕鬆又有畫面。"}],"w":[{"w":"熱帶低壓","m":"颱風形成之前，在熱帶海面上的低氣壓系統"},{"w":"發布","m":"對外公開宣布消息"},{"w":"堵塞","m":"被東西擋住，不通暢"}],"quiz":[{"q":"依文章，颱風最初是怎麼形成的？","o":["高山的冷空氣下沉","沙漠的熱風吹向海洋","溫暖海面的水氣上升，聚成旋轉的雲"],"a":2,"why":"文中說明海水溫暖，水氣上升形成雲，雲聚集旋轉後可能發展成熱帶低壓和颱風。"},{"q":"「彷彿大地剛剛洗了一場澡」運用了什麼修辭？","o":["擬人","對比","引用"],"a":0,"why":"把大地當成人，寫他洗澡，所以是擬人。"}],"title2":"我遇過最特別的天氣","hint":"寫一次你印象深刻的天氣（颱風、大雷雨、寒流等），先說發生了什麼，再寫你的感受。","starters":["那天的雲壓得很低，","寒流來的早晨，我一出門就"]},{"title":"春天來信","theme":"自然與四季","text":["一夜春雨之後，窗台上的小盆栽悄悄冒出了新芽。嫩綠嫩綠的，像剛睡醒的嬰兒，揉著眼睛向世界打招呼。","我想，春天一定是個很會寫信的人。她把消息寫在風裡，風一吹，冰冷的空氣就軟了下來；她把消息寫在枝頭，櫻花、桃花爭先恐後地拆開信封；她也把消息塞進我的口袋，那件冬天的外套裡，不知何時多了一片粉色的花瓣。","今天放學，我沒有急著回家，而是繞到學校後面的小路，慢慢走，慢慢看。空氣裡有泥土被雨水喚醒的味道，遠處的田裡，農人正彎著腰插秧。我把外套脫下來掛在手臂上，覺得整個人都輕了起來。"],"gj":[{"s":"嫩綠嫩綠的，像剛睡醒的嬰兒，揉著眼睛向世界打招呼。","t":"譬喻","n":"把新芽比成剛睡醒的嬰兒，又加上揉眼睛、打招呼的動作，可愛又有生命。"},{"s":"我想，春天一定是個很會寫信的人。","t":"轉化","n":"把春天寫成會寫信的人，後文接著用風、枝頭、口袋展開，全段就有了統一的畫面。"},{"s":"空氣裡有泥土被雨水喚醒的味道","t":"擬人","n":"把泥土寫成沉睡後被喚醒，同時帶出春雨後的嗅覺印象。"}],"w":[{"w":"新芽","m":"剛長出來的嫩芽"},{"w":"爭先恐後","m":"爭著搶在前面，怕落在後面"},{"w":"喚醒","m":"使人或事物從沉睡中醒來"}],"quiz":[{"q":"全文把春天比作「很會寫信的人」，這是什麼修辭？","o":["排比","轉化","誇飾"],"a":1,"why":"把春天當成人，又把花開、風暖當作她寄來的消息，是把一物當作另一物來寫的轉化。"},{"q":"這篇文章主要表達什麼？","o":["對冬天離開的惋惜","對農事忙碌的擔心","對春天到來的欣喜與愉悅"],"a":2,"why":"從新芽、花瓣到脫下外套覺得輕盈，整篇都洋溢著迎接春天的喜悅。"}],"title2":"季節給我的一個訊號","hint":"寫一個你感受到季節改變的小訊號，例如一陣風、一種味道或一件衣服，並用擬人的方式描寫它。","starters":["我知道夏天快到了，因為","一早起床，我發現窗外的"]},{"title":"雨天的好處","theme":"自然與四季","text":["很多人討厭下雨天：鞋子會濕，頭髮會塌，體育課還要改成室內上課。連我也常常看著窗外的雨，唉聲嘆氣。","不過冷靜想想，雨其實是大自然最勤勞的清潔工。它把空氣中的灰塵洗掉，把乾渴的土地餵飽，也把水一點一點送進水庫和河川。台灣的夏天若是少了午後那幾場雷陣雨，農田和水庫都會很辛苦。","所以，下次遇到下雨天，我們不妨換個心情：雨傘是一朵會移動的花，水窪是地上的小鏡子，雨聲則是免費的輕音樂。我今天就故意踩進最大的水窪，讓鞋子發出咕啾一聲，好像大地在跟我打招呼。"],"gj":[{"s":"雨其實是大自然最勤勞的清潔工","t":"轉化","n":"把雨寫成清潔工，讓人換個角度看待討厭的雨。"},{"s":"它把空氣中的灰塵洗掉，把乾渴的土地餵飽","t":"排比","n":"兩個「把」字句並列，一洗一餵，列出雨的功勞，句子整齊有節奏。"},{"s":"雨傘是一朵會移動的花，水窪是地上的小鏡子，雨聲則是免費的輕音樂。","t":"排比","n":"三個比喻接連出現，把雨天的小東西都寫出了趣味，是轉換心情的好示範。"}],"w":[{"w":"唉聲嘆氣","m":"因煩悶或不如意而發出嘆息"},{"w":"勤勞","m":"工作認真，不偷懶"},{"w":"水窪","m":"地面低處積的小水坑"}],"quiz":[{"q":"文章中，作者為什麼說雨是「大自然最勤勞的清潔工」？","o":["因為雨洗去灰塵，也滋潤土地和水源","因為雨會幫人打掃教室","因為雨可以讓人少寫作業"],"a":0,"why":"第二段提到雨洗掉灰塵、餵飽土地、補充水庫與河川，所以像清潔工。"},{"q":"全文最想傳達的觀點是什麼？","o":["雨天最適合待在家裡","換個角度，雨天也有可愛之處","雨水會造成許多麻煩"],"a":1,"why":"作者先承認雨的不便，再用清潔工與一連串比喻帶出雨的好處。"}],"title2":"我和雨天的故事","hint":"寫一次你在雨天遇到的事，試著用三個並列的比喻（像排比那樣）描寫你看到的雨天小東西。","starters":["下雨的時候，我最喜歡","那天沒帶傘，我只好"]},{"title":"與蚊子談判","theme":"自然與四季","text":["夏天的夜晚，我正在寫數學作業，耳邊突然傳來「嗡嗡嗡」的聲音。蚊子又來了。牠像一架迷你轟炸機，在我的耳朵旁邊盤旋，還不時降落在我的小腿上，開起免費自助餐。","我決定和牠談判。我放下筆，嚴肅地說：「這位先生，我們簽個和平條約好嗎？你不要咬我，我給你看我的作業。」話還沒說完，牠就停在我的手背上，悠閒地洗了洗腳。我氣得拍下去，結果只打到自己，「啪」的一聲，連隔壁房間的弟弟都被嚇醒。","最後，我點起蚊香，把紗窗檢查了一遍，那位談判代表從此沒有再來。我寫完作業，才發現小腿上多了三個包。看來這場談判，吃虧的永遠是我。夜風吹進來，窗簾輕輕晃了一下，彷彿在偷笑。"],"gj":[{"s":"牠像一架迷你轟炸機，在我的耳朵旁邊盤旋，還不時降落在我的小腿上，開起免費自助餐。","t":"擬人","n":"把蚊子寫成飛機與餐廳客人，吸血的行為被說得又好氣又好笑。"},{"s":"話還沒說完，牠就停在我的手背上，悠閒地洗了洗腳。","t":"擬人","n":"蚊子完全不理會談判，還悠閒洗腳，反差讓人發笑。"},{"s":"我氣得拍下去，結果只打到自己，「啪」的一聲，連隔壁房間的弟弟都被嚇醒。","t":"誇飾","n":"打到自己的聲音大到吵醒別人，有一點誇張，加上聲音的描寫，十分好笑。"}],"w":[{"w":"盤旋","m":"在空中環繞飛行"},{"w":"談判","m":"雙方商議解決問題的辦法"},{"w":"悠閒","m":"從容自在、不匆忙"}],"quiz":[{"q":"「我」和蚊子談判的結果如何？","o":["蚊子答應不再咬人","蚊子被抓住放走了","蚊子毫不理會，我反而打到自己"],"a":2,"why":"文中蚊子停在手背洗腳，我一拍卻打到自己。"},{"q":"「開起免費自助餐」指的是什麼？","o":["蚊子叮咬並吸血","蚊子偷吃桌上的食物","作者請蚊子吃東西"],"a":0,"why":"把蚊子叮人吸血比成客人吃免費自助餐，是幽默的說法。"}],"title2":"夏夜裡的小麻煩","hint":"寫一件夏天發生的小麻煩（蚊子、停電、冷氣壞掉等），用誇張的比喻讓讀者笑一笑。","starters":["夏天的晚上，最令人頭痛的就是","那天晚上，電風扇突然"]},{"title":"週日早市","theme":"家鄉與小鎮","text":["週日清晨，阿嬤把我從被窩裡拉出來：「走，帶你去市場，晚了好菜就被搶光了。」我睡眼惺忪，被她牽著，走進那條從小逛到大的市場。","市場裡有吆喝聲，有剁肉聲，也有塑膠袋沙沙作響的聲音。賣魚的攤位堆滿了冰塊，賣菜的阿姨把青菜擺得整整齊齊，賣豆花的攤子冒著熱氣，每個人都忙得像上了發條的玩具。","阿嬤一路殺價、一路聊天，一會兒和這個老闆問候孫子，一會兒又和那個阿姨交換食譜。最後我們各提著一袋菜，我手上還多了一杯阿嬤偷偷買的熱豆漿。我低頭喝了一口，肚子暖了，連清晨的冷風都甜了起來。"],"gj":[{"s":"市場裡有吆喝聲，有剁肉聲，也有塑膠袋沙沙作響的聲音。","t":"排比","n":"三個「有」字句並列，把市場的聲音一層一層疊起來，熱鬧感十足。"},{"s":"每個人都忙得像上了發條的玩具","t":"譬喻","n":"把忙碌的攤商比成上緊發條的玩具，寫出停不下來的動作。"},{"s":"連清晨的冷風都甜了起來","t":"轉化","n":"把觸覺的冷風寫成味覺的甜，說明心裡溫暖，連風也變得可愛。"}],"w":[{"w":"睡眼惺忪","m":"剛睡醒、眼睛還睜不開的樣子"},{"w":"吆喝","m":"大聲叫賣或呼喊"},{"w":"殺價","m":"買東西時請求降價"}],"quiz":[{"q":"阿嬤為什麼一大早就帶「我」去市場？","o":["因為市場只營業到中午","怕晚了好菜就被搶光","要我學習殺價"],"a":1,"why":"開頭阿嬤說的話就是理由：晚了好菜就被搶光了。"},{"q":"「連清晨的冷風都甜了起來」，是指什麼？","o":["風裡真的有糖的味道","清晨的天氣特別熱","作者心裡暖暖的，覺得一切都美好"],"a":2,"why":"是喝了熱豆漿後的幸福感，使人覺得連冷風也變得可愛。"}],"title2":"家鄉的一處熱鬧地方","hint":"寫一個你家鄉熱鬧的地方，如市場、夜市或廟口，用三個並列句寫出你聽到、看到或聞到的東西。","starters":["在我們這裡，最熱鬧的地方是","一走進那條街，就"]},{"title":"廟埕的黃昏","theme":"家鄉與小鎮","text":["黃昏的廟埕，是小鎮最熱鬧的客廳。屋簷上的燕尾彎彎地翹向天空，香爐裡飄出細細的煙，在夕陽裡慢慢散開。","這裡有下棋的老爺爺，有追著球跑的小朋友，有牽狗散步的阿姨，還有坐在石階上寫作業的我。榕樹的鬚根垂下來，風一吹就輕輕晃動，好像在替每個人打拍子。","遠處的小吃攤升起了炊煙，空氣中混著蚵仔煎、烤香腸和甜米糕的味道。天色漸漸暗下來，廟前的燈一盞一盞亮了，把每個人的影子拉得長長的，像把一天的故事，全都收進了這個溫暖的院子。"],"gj":[{"s":"黃昏的廟埕，是小鎮最熱鬧的客廳。","t":"轉化","n":"把公共的廟埕寫成大家聚會的客廳，一開頭就說出親切的氣氛。"},{"s":"這裡有下棋的老爺爺，有追著球跑的小朋友，有牽狗散步的阿姨，還有坐在石階上寫作業的我。","t":"排比","n":"四種人並列，由老到少、由遠到近，最後落到「我」，生活畫面完整。"},{"s":"空氣中混著蚵仔煎、烤香腸和甜米糕的味道","t":"摹寫","n":"以嗅覺描寫小吃，不必形容就讓人聞到廟口的香氣。"}],"w":[{"w":"廟埕","m":"廟前的空地"},{"w":"炊煙","m":"燒火煮飯時冒出的煙"},{"w":"燕尾","m":"廟宇屋脊兩端向上翹起、形如燕尾的裝飾"}],"quiz":[{"q":"作者把廟埕比成「客廳」，主要是因為什麼？","o":["大家在這裡自在相聚、親切熱鬧","廟埕的地板很乾淨","廟埕裡擺滿沙發"],"a":0,"why":"客廳是家人聚會的地方，作者用它形容廟埕成為鎮上居民相聚交流的場所。"},{"q":"文章中的「我」在廟埕做什麼？","o":["下棋","坐在石階上寫作業","牽狗散步"],"a":1,"why":"第二段最後列出「坐在石階上寫作業的我」。"}],"title2":"我們的廟口或公園","hint":"寫一個你家附近人們會聚集的地方，用「有……，有……，還有……」的句型寫出至少三種人或事物。","starters":["傍晚的公園裡，","每次經過廟口，我都會看見"]},{"title":"郵差伯伯","theme":"家鄉與小鎮","text":["小鎮的郵差伯伯，每天騎著綠色的郵務機車，噗噗噗地穿過大街小巷。他的置物箱裡裝著掛號信、明信片，還有一個總是塞得鼓鼓的保溫壺。","他認得每一條巷子，認得每一戶人家，也認得每一隻看到他就狂吠的狗。「這封是給巷尾種蘭花那家的。」他不看門牌，卻從沒送錯過。誰家孩子考上了學校，誰家阿公住院，他總是第一個知道，也總是第一個送上一句：「恭喜啦！」或「保重喔！」","有一次下大雨，他的雨衣滴著水，仍把信塞進塑膠袋，一封一封護在懷裡。我站在騎樓下看他遠去的背影，綠色的車影在雨裡越來越小，卻像一小片會移動的葉子，替整座小鎮把消息輕輕送到每一個手心。"],"gj":[{"s":"他認得每一條巷子，認得每一戶人家，也認得每一隻看到他就狂吠的狗。","t":"排比","n":"三個「認得」並列，由大到小，連狗也寫進去，顯出他對小鎮的熟悉與幽默。"},{"s":"「這封是給巷尾種蘭花那家的。」他不看門牌，卻從沒送錯過。","t":"對話描寫","n":"用一句話表現他記人不記號碼的功夫，勝過直接誇他厲害。"},{"s":"綠色的車影在雨裡越來越小，卻像一小片會移動的葉子","t":"譬喻","n":"以葉子比車影，既點出郵務車的綠，也寫出渺小卻帶來消息的溫柔。"}],"w":[{"w":"掛號信","m":"寄送時要登記並有憑證的信件"},{"w":"狂吠","m":"瘋狂地大聲叫"},{"w":"騎樓","m":"臨街建築一樓向外延伸、供行人通行的有頂走廊"}],"quiz":[{"q":"文中說郵差「不看門牌，卻從沒送錯過」，是因為什麼？","o":["他的信都有電子定位","他只送給認識的人","他對每戶人家都十分熟悉"],"a":2,"why":"第二段說他認得每條巷子、每戶人家，所以不用看門牌。"},{"q":"「像一小片會移動的葉子」是比喻什麼？","o":["在雨中遠去、替小鎮送消息的郵差","隨風飄落的信件","路邊的落葉堆"],"a":0,"why":"文中前面說綠色的車影越來越小，像葉子般輕輕送消息，指的是郵差的身影。"}],"title2":"一個我熟悉的大人","hint":"寫一位你家鄉裡你很熟悉的人，用「他認得……，認得……，也認得……」的排比，寫出他的特色。","starters":["在我們這條巷子裡，大家都認識","每天傍晚，我都會看到他"]},{"title":"地名裡的故事","theme":"家鄉與小鎮","text":["每個小鎮的名字，都藏著一段故事。只要多留意，你會發現地名不是隨便取的，它們像一張張小小的名片，記錄著這塊土地過去的模樣。很多小鎮最初，不過是一小群人的聚落。","地名的來源很多。有些和地形有關，像是山腳、溪口、坡頂；有些和物產行業有關，記下了種田、曬鹽、打鐵的日子；也有些來自原住民族語言的發音，後來才被漢字記錄下來。","地名也會隨著時代改變。像高雄，早年叫作「打狗」，後來改寫成現在的名字。下次搭車經過小站，不妨抬頭看看站牌，問問自己：這個名字從哪裡來？說不定，一個站名就能帶你走進一個老故事。"],"gj":[{"s":"它們像一張張小小的名片，記錄著這塊土地過去的模樣。","t":"譬喻","n":"把地名比成名片，說明它們像自我介紹一樣，提供土地的身分與歷史。"},{"s":"有些和地形有關，像是山腳、溪口、坡頂；有些和物產行業有關，記下了種田、曬鹽、打鐵的日子；也有些來自原住民族語言的發音，後來才被漢字記錄下來。","t":"排比","n":"用「有些……有些……也有些……」並列三種來源，條理清楚，讀者容易記住。"},{"s":"說不定，一個站名就能帶你走進一個老故事。","t":"轉化","n":"把站名寫成帶人走進故事的入口，結尾邀請讀者親自留意身邊地名。"}],"w":[{"w":"聚落","m":"人們聚集居住的地方"},{"w":"曬鹽","m":"利用陽光使海水蒸發而取得鹽"},{"w":"改寫","m":"把原來的寫法改成另一種"}],"quiz":[{"q":"依文章，地名的來源不包括下列哪一項？","o":["與地形有關","由當地學生投票決定","與物產和行業有關"],"a":1,"why":"文中列出的來源是地形、物產行業和原住民族語言的發音，沒有提到投票。"},{"q":"作者在結尾建議讀者怎麼做？","o":["背下所有鄉鎮的名稱","去查所有地名何時改名","留意站牌，探究地名由來"],"a":2,"why":"文中說下次經過小站，不妨看看站牌，問問名字從哪裡來。"}],"title2":"我家附近的地名","hint":"查查或問問長輩你家附近某個地名的由來，寫出你知道的版本，並說說你對它的感覺。","starters":["我住的地方叫作","聽阿公說，這個地名的由來是"]},{"title":"外婆家的夏夜","theme":"家鄉與小鎮","text":["暑假回到外婆家，晚飯後，我們搬著小板凳坐在三合院的門口。天空黑得很徹底，星星像是有人撒了一把碎鑽，一顆一顆毫不客氣地亮著。","這裡有蛙鳴，有蟲叫，有遠處田埂上的狗吠，還有外婆搖著蒲扇的沙沙聲。城市裡的夜晚太亮了，我已經很久沒有聽見這麼多聲音，一起合唱成一首沒有指揮的歌。","外婆把切好的西瓜遞過來，說：「慢慢吃，不要急。」我咬一口，涼涼的甜汁流過喉嚨，也流進心裡。我很想把這個夜晚收進口袋，帶回去，在忙碌的日子裡，偷偷拿出來聞一聞。"],"gj":[{"s":"星星像是有人撒了一把碎鑽，一顆一顆毫不客氣地亮著","t":"譬喻","n":"把星星比成碎鑽，「毫不客氣」讓星星有了性格，鄉下夜空的明亮可見一斑。"},{"s":"這裡有蛙鳴，有蟲叫，有遠處田埂上的狗吠，還有外婆搖著蒲扇的沙沙聲。","t":"排比","n":"四種聲音由自然到人，寫出夏夜的豐富，結尾落在外婆身上，特別溫暖。"},{"s":"我很想把這個夜晚收進口袋","t":"轉化","n":"把一個夜晚寫成可以收進口袋的東西，表達珍惜與不捨。"}],"w":[{"w":"蛙鳴","m":"青蛙的叫聲"},{"w":"三合院","m":"三面有房子、中間有院子的傳統住宅"},{"w":"田埂","m":"田地之間的小路或土堤"}],"quiz":[{"q":"「一首沒有指揮的歌」指的是什麼？","o":["各種自然的聲音自然交織在一起","外婆唱的搖籃曲","電視裡播放的音樂"],"a":0,"why":"前一句列出蛙鳴、蟲叫、狗吠和蒲扇聲，大家各自發聲卻合成一首歌。"},{"q":"作者想把這個夜晚「收進口袋」，表達的是什麼心情？","o":["想帶走外婆家的東西","珍惜並想留住這份寧靜","對城市生活感到憤怒"],"a":1,"why":"作者說要在忙碌的日子偷偷拿出來聞一聞，可見非常珍惜這個夜晚。"}],"title2":"一個想留住的夜晚","hint":"寫一個你想一直記得的夜晚，用「有……，有……，還有……」寫出當時的聲音或味道，最後說說你想怎麼把它留下來。","starters":["那個晚上，我們全家","外面一片安靜，只聽見"]},{"title":"小鎮也有大世界","theme":"家鄉與小鎮","text":["有人說，小鎮很無聊：沒有大型商場，沒有捷運，連電影院都要騎車半小時才到得了。每次聽到這種話，我都想反問：真的是這樣嗎？","在小鎮，我們有清晨的霧，有午後的蟬聲，也有放學路上一整片會變顏色的天空。我們認得賣菜的阿姨，也認得公車司機，甚至連巷口那隻黃狗，都知道我們幾點回家。這些細小的熟悉，是任何大城市都買不到的。","當然，小鎮的資源少一點，要學的東西、要看的世界，還得靠自己多找、多走。但這未必是壞事：書本、網路和旅行，會把遠方一步一步帶到眼前。我想，一個人的世界有多大，不只看他住在哪裡，更看他願不願意好奇。回家的路上，我抬頭看見天邊那道晚霞，又覺得，這裡真的不小。"],"gj":[{"s":"每次聽到這種話，我都想反問：真的是這樣嗎？","t":"設問","n":"用反問表達不服氣，也順勢帶出下文的反駁。"},{"s":"我們有清晨的霧，有午後的蟬聲，也有放學路上一整片會變顏色的天空。","t":"排比","n":"三個「有」並列，列出小鎮的日常之美，一句比一句開闊。"},{"s":"一個人的世界有多大，不只看他住在哪裡，更看他願不願意好奇。","t":"對比","n":"用「住在哪裡」與「好奇」對照，說出世界大小取決於心，而不是地點。"}],"w":[{"w":"反問","m":"明知故問，用來加強語氣的問句"},{"w":"資源","m":"可利用的人力、物力或各種條件"},{"w":"好奇","m":"對新鮮事物想了解的心理"}],"quiz":[{"q":"作者認為小鎮最難得的是什麼？","o":["大型商場與捷運","方便的娛樂設施","細小而熟悉的人事景物"],"a":2,"why":"文中說認得賣菜阿姨、司機和黃狗，這些細小的熟悉是大城市買不到的。"},{"q":"作者說一個人的世界有多大，取決於什麼？","o":["他願不願意好奇","他住在大城市還是小鎮","他家有多少書"],"a":0,"why":"文中明說「不只看他住在哪裡，更看他願不願意好奇」。"}],"title2":"我眼中的家鄉","hint":"寫出你家鄉的三樣小特色（天空、聲音、人情都可以），再說說你想對別人怎麼介紹它。","starters":["有人問我，家鄉有什麼好玩的？我想了想，說：","對我來說，家鄉最特別的是"]},{"title":"鄉下問路","theme":"家鄉與小鎮","text":["外地來的表哥第一次到我家，打電話問路。我說：「很簡單啦，你看到一棵很大的榕樹，就左轉。」他說：「這裡到處都是榕樹耶。」我想了想，補充：「那就是最大的那棵。」","表哥又問：「然後呢？」我說：「我們這裡問路，不看路牌，看榕樹，看狗，看阿嬤的表情。你經過一間以前賣冰的店，現在改賣雞蛋糕了，再過去一點，有三隻狗在曬太陽，你就慢慢騎，不要吵到牠們。」電話那頭沉默了很久，最後傳來一句：「你確定這不是尋寶遊戲嗎？」","結果表哥迷路了二十分鐘，最後是被一位在騎樓下乘涼的阿嬤，一路比手畫腳帶到我家門口的。阿嬤還笑咪咪地問他：「你是不是那個愛吃雞蛋糕的孫子的表哥？」表哥回頭看我，一臉敬佩，原來小鎮裡最準的導航，不是手機，而是阿嬤。"],"gj":[{"s":"我們這裡問路，不看路牌，看榕樹，看狗，看阿嬤的表情。","t":"排比","n":"「不看……看……看……看……」並列短句，用最土的地標說出小鎮的問路文化，又好笑又親切。"},{"s":"電話那頭沉默了很久，最後傳來一句：「你確定這不是尋寶遊戲嗎？」","t":"對話描寫","n":"先寫長長的沉默，再丟出一句吐槽，節奏停頓得剛好，笑點才出得來。"},{"s":"原來小鎮裡最準的導航，不是手機，而是阿嬤。","t":"對比","n":"用「不是……而是……」做出意外的結論，既好笑又寫出人情味。"}],"w":[{"w":"榕樹","m":"常見於台灣鄉間的大樹，樹冠大、枝葉繁茂"},{"w":"乘涼","m":"在陰涼的地方休息，避開暑熱"},{"w":"敬佩","m":"尊敬而佩服"}],"quiz":[{"q":"表哥為什麼覺得「這不是尋寶遊戲嗎」？","o":["我故意不告訴他路","「我」指路的地標太生活化、不夠明確","路上真的藏著寶藏"],"a":1,"why":"我的路線都用榕樹、狗、舊店等記號，一般人聽起來像找寶藏的提示。"},{"q":"文章最後說「最準的導航是阿嬤」，用意是什麼？","o":["批評手機導航不準","說明阿嬤很愛管閒事","幽默地說出鄉下人熟人熟地的特色"],"a":2,"why":"這是反轉的結尾，用輕鬆的方式突顯小鎮居民彼此熟識、熱心指路。"}],"title2":"一次迷路的經驗","hint":"寫一次你迷路或幫人指路的經過，至少放進一句問路的對話，並用排比的方式寫出路上的地標。","starters":["那天在陌生的街頭，我停下來問路人：「","要去我家很簡單：先看到，再看到，最後看到"]},{"title":"蛋餅的溫度","theme":"食物與記憶","text":["每天早上六點半，媽媽會把一片蛋餅放進我的手心。紙袋還燙著，我得左手換右手，像在玩傳球遊戲。","咬下第一口，外皮煎得微焦，發出細細的脆響；裡面的蛋香混著蔥花的辛氣，再淋上一點甜甜鹹鹹的醬油膏，舌尖立刻醒了過來。","上了國中以後，我常常趕公車，來不及坐下好好吃。可是只要聞到那股煎蛋的香味，我就想起小學時，媽媽站在騎樓下，一邊看錶，一邊把紙袋遞給我的樣子。","今天的蛋餅已經涼了一半，我還是把它吃光，連指尖的油都捨不得擦。"],"gj":[{"s":"我得左手換右手，像在玩傳球遊戲","t":"譬喻","n":"把燙手的動作比成傳球遊戲，既生動又帶著一點童趣。"},{"s":"裡面的蛋香混著蔥花的辛氣","t":"嗅覺摹寫","n":"用「混著」寫出兩種氣味交織，讀者彷彿也聞到了。"},{"s":"舌尖立刻醒了過來","t":"轉化","n":"把舌尖當成會睡醒的人，寫出味覺被喚醒的瞬間。"}],"w":[{"w":"騎樓","m":"店面前方有屋頂遮蔽、供行人通行的走廊"},{"w":"微焦","m":"稍微煎到焦黃"},{"w":"捨不得","m":"不忍心、很珍惜"}],"quiz":[{"q":"作者為什麼要「左手換右手」？","o":["因為紙袋裡的蛋餅還很燙","因為想把蛋餅分給同學","因為另一隻手拿著書包很重"],"a":0,"why":"第一段說紙袋還燙著，所以才不停換手。"},{"q":"文末「連指尖的油都捨不得擦」最可能表示什麼？","o":["覺得蛋餅太貴不能浪費","珍惜這份味道與背後的回憶","擔心被媽媽責備弄髒衣服"],"a":1,"why":"作者想起媽媽遞蛋餅的畫面，連一點油都想留住，顯示珍惜。"}],"title2":"那一口熟悉的味道","hint":"寫一種讓你想起某個人或某個地方的食物，並描寫它的味道與氣味。先寫食物的外表，再依序寫它聞起來、吃起來的感覺，最後帶出你想起的人或場景。","starters":["每次聞到那股香味，我就會想起","那天放學回家，廚房裡飄出一陣"]},{"title":"夜市的味道","theme":"食物與記憶","text":["傍晚五點多，夜市的鐵捲門一扇扇升起，空氣裡像有人悄悄打開了一盒調味料。","最先衝過來的是烤香腸的焦甜，接著是炸臭豆腐那股霸道的酸香，像一位不用敲門就走進來的鄰居。再往前走，滷味攤的八角和醬油味裹著白色蒸氣，慢慢爬上我的外套。","我們一群同學擠在鐵板燒的攤前，看老闆把高麗菜翻得嘩啦嘩啦響。燈泡一盞盞亮起，油煙在光裡盤旋，連天上的月亮也彷彿被香得模糊了。"],"gj":[{"s":"最先衝過來的是烤香腸的焦甜","t":"嗅覺摹寫","n":"「衝」字讓氣味有了速度，焦甜兩字又點出香腸烤過的特色。"},{"s":"像一位不用敲門就走進來的鄰居","t":"譬喻","n":"把臭豆腐強烈的氣味比成不請自來的鄰居，幽默又貼切。"},{"s":"看老闆把高麗菜翻得嘩啦嘩啦響","t":"聽覺摹寫","n":"疊字的聲音讓讀者彷彿站在鐵板前聽見翻炒聲。"}],"w":[{"w":"鐵捲門","m":"可以捲起收放的金屬門"},{"w":"八角","m":"常用來滷製食物的香料"},{"w":"盤旋","m":"在空中繞圈飄動"}],"quiz":[{"q":"「像一位不用敲門就走進來的鄰居」是形容什麼？","o":["老闆熱情地招呼每位客人","夜市裡擁擠的人潮","臭豆腐的氣味自然地飄到每個人身邊"],"a":2,"why":"這句緊接在臭豆腐的酸香之後，比喻氣味不請自來。"},{"q":"本文主要透過哪些方式寫夜市？","o":["食物的氣味與聲音","夜市的歷史由來","逛夜市時要注意的安全"],"a":0,"why":"全文寫香腸、臭豆腐、滷味的氣味和翻炒的聲響。"}],"title2":"我最愛的小吃攤","hint":"介紹一個你常吃的小吃攤，不必寫店名，重點是描寫它的氣味和吃的感覺。試著用「先聞到、再看到、最後吃到」的順序，寫出三種不同的感官。","starters":["遠遠地，我就聞到","排隊的時候，我一直盯著"]},{"title":"阿嬤的滷肉飯","theme":"食物與記憶","text":["阿嬤煮滷肉飯，從來不看食譜，也不用量匙。她只靠鼻子，聞到醬油在鍋裡開始冒出焦糖般的甜香，就知道火候到了。","我蹲在灶邊問她：「到底要放多少糖？」她笑著把湯匙遞給我，說：「你嚐嚐看，嘴巴比秤子準。」我舔了一小口，肥肉融在舌頭上，鹹裡帶甜，後面還藏著淡淡的米酒香。","阿嬤的手背有深深的皺紋，像滷肉鍋底沉澱的老湯。可是她舀飯的時候，手穩得很，一勺肉燥澆下去，油亮的醬汁緩緩滲進每一粒白飯。","那碗飯我吃得特別慢，怕太快就吃完了。"],"gj":[{"s":"肥肉融在舌頭上，鹹裡帶甜，後面還藏著淡淡的米酒香","t":"味覺摹寫","n":"由口感到鹹甜再到餘味，一層一層寫，讀來很有層次。"},{"s":"像滷肉鍋底沉澱的老湯","t":"譬喻","n":"把皺紋比成老湯，暗示歲月的累積與厚實。"},{"s":"油亮的醬汁緩緩滲進每一粒白飯","t":"視覺摹寫","n":"「油亮」「緩緩」寫出醬汁的光澤與速度，畫面清楚。"}],"w":[{"w":"食譜","m":"記載烹調方法的書或紙"},{"w":"火候","m":"烹煮時火力的大小與時間"},{"w":"滲進","m":"慢慢浸透進去"}],"quiz":[{"q":"阿嬤判斷滷肉的火候，主要靠什麼？","o":["照著食譜上的時間","用鼻子聞醬油的甜香","用湯匙量糖的多少"],"a":1,"why":"第一段寫她只靠鼻子，聞到焦糖般的甜香就知道火候到了。"},{"q":"「像滷肉鍋底沉澱的老湯」用來形容皺紋，最可能暗示什麼？","o":["容易被別人忽略","讓人感到害怕","歲月累積而來的深厚"],"a":2,"why":"老湯是久煮而成，比喻皺紋是歲月與經驗的痕跡。"}],"title2":"家裡的拿手菜","hint":"寫一道家人常煮的菜，說說它的味道，以及煮菜的人有什麼特別的小習慣。可以先寫煮菜的人怎麼動手，再寫你吃第一口的感覺，用上酸甜苦辣鹹的詞。","starters":["我家的餐桌上，最常出現的是","每次這道菜端上桌，"]},{"title":"便當怎麼不變味","theme":"食物與記憶","text":["中午打開便當盒，有時會聞到一股悶悶的酸味，這通常不是廚師的錯，而是早上裝盒的方法出了問題。","剛煮好的飯菜帶著熱氣，如果立刻蓋上蓋子，水蒸氣會凝成小水珠，滴回飯菜上。潮濕又溫暖的環境，最適合細菌生長，菜色也會變得軟爛，味道走樣。","比較好的做法，是先把飯菜攤開放涼，再蓋上蓋子。菜盡量選炒得乾一點的，湯汁多的菜就另外裝。吃之前如果有蒸飯箱，加熱到整盒都熱透，香氣也會重新醒來。","小小的便當盒，藏著不少生活的學問。"],"gj":[{"s":"有時會聞到一股悶悶的酸味","t":"嗅覺摹寫","n":"「悶悶」二字讓看不見的氣味有了質感，也呼應後文的潮濕。"},{"s":"水蒸氣會凝成小水珠，滴回飯菜上","t":"因果說明","n":"清楚交代水氣如何一步步影響飯菜，說明有條理。"},{"s":"加熱到整盒都熱透，香氣也會重新醒來","t":"擬人","n":"把香氣寫成會醒來的人，讓說明文也有生動感。"}],"w":[{"w":"凝成","m":"由氣體或液體聚集變成液體或固體"},{"w":"細菌","m":"肉眼看不見的微小生物"},{"w":"走樣","m":"失去原本的樣子或味道"}],"quiz":[{"q":"立刻蓋上蓋子容易讓便當變味，主要原因是什麼？","o":["水氣凝成水珠，讓環境潮濕又溫暖","蓋子的材質會吸走香氣","熱氣會讓飯菜變得太乾"],"a":0,"why":"第二段說明水珠滴回飯菜，潮濕溫暖的環境容易走樣。"},{"q":"依據文章，哪種做法比較合適？","o":["趁熱立刻蓋緊，這樣最保溫","先放涼再蓋蓋子，湯汁多的菜另外裝","把湯汁全部倒進飯裡讓飯更入味"],"a":1,"why":"第三段提出先放涼、湯汁另裝的建議。"}],"title2":"我的便當盒故事","hint":"寫你吃便當或帶便當的一次經驗，包括打開盒子時看到、聞到了什麼。從打開蓋子的那一秒寫起，描寫三樣菜的顏色與味道，再寫你和誰一起吃。","starters":["蓋子一掀開，","午休鈴響了，我立刻"]},{"title":"冬至湯圓","theme":"食物與記憶","text":["冬至的傍晚，天色暗得特別早。我坐在餐桌邊，看著外婆把一顆顆湯圓搓成小小的白月亮。","湯圓下鍋，浮起來的時候，整間屋子都是薑湯的辣香和紅糖的暖甜。我捧著碗，先吹了吹，再咬開軟軟黏黏的外皮，花生粉的香氣從裡面慢慢流出來。","每年這一天，一家人都會到齊。去年表哥還在說笑，今年他到外地念書了，位子空著，碗卻還是多擺了一副。","窗外的風很冷，可是鍋裡的熱氣，輕輕貼在每個人的臉上。"],"gj":[{"s":"看著外婆把一顆顆湯圓搓成小小的白月亮","t":"譬喻","n":"把白白圓圓的湯圓比成月亮，畫面溫柔，也帶出夜晚的氣氛。"},{"s":"整間屋子都是薑湯的辣香和紅糖的暖甜","t":"嗅覺與味覺摹寫","n":"「辣香」「暖甜」兩個詞寫出冬天的溫度感。"},{"s":"位子空著，碗卻還是多擺了一副","t":"含蓄抒情","n":"不直說想念，只寫多擺的一副碗，餘味更深。"}],"w":[{"w":"冬至","m":"二十四節氣之一，白天最短的日子"},{"w":"暖甜","m":"溫暖的甜味"},{"w":"到齊","m":"全部的人都來了"}],"quiz":[{"q":"「位子空著，碗卻還是多擺了一副」表達了什麼？","o":["外婆煮得太多","外婆記錯了人數","對遠方家人的思念"],"a":2,"why":"表哥到外地念書，碗仍為他留著，是含蓄的想念。"},{"q":"「搓成小小的白月亮」指的是什麼？","o":["把糯米糰搓成圓圓的湯圓","在月光下搓麵團","把月餅染成白色"],"a":0,"why":"月亮是譬喻，形容白又圓的湯圓。"}],"title2":"節日裡的一道料理","hint":"寫一個節日或季節裡，家裡一定會出現的食物，以及它帶給你的感覺。先寫準備的過程，再寫吃的時候的氣味與味道，最後用一個畫面收尾。","starters":["每到這一天，家裡就會","熱氣從鍋子裡冒出來，"]},{"title":"早餐留個位子","theme":"食物與記憶","text":["很多同學早上寧願多睡十分鐘，也不想吃早餐。理由聽起來都很合理：趕時間、沒胃口、反正中午就吃飯。","但我認為，早餐值得留一個位子。經過一整夜，身體像一部沒電的手機，需要充一點電。一杯豆漿、一個飯糰，不必豐盛，卻能讓上午的課不會在第三節就昏昏欲睡。","更重要的是，早餐是一天的開機儀式。喝下第一口熱豆漿，穀物的香氣在鼻尖升起，人才真正醒過來。","所以，與其問自己「有沒有時間吃」，不如問「要不要給自己三分鐘」。"],"gj":[{"s":"身體像一部沒電的手機，需要充一點電","t":"譬喻","n":"用大家天天使用的手機作比方，馬上懂得早餐的作用。"},{"s":"穀物的香氣在鼻尖升起","t":"嗅覺摹寫","n":"「在鼻尖升起」寫出香氣由下往上的動態。"},{"s":"與其問自己「有沒有時間吃」，不如問「要不要給自己三分鐘」","t":"對照","n":"兩個問句換了角度，把藉口變成選擇，收尾有力。"}],"w":[{"w":"豐盛","m":"份量多又豐富"},{"w":"昏昏欲睡","m":"精神不好，很想睡覺"},{"w":"儀式","m":"有固定程序、帶有意義的動作"}],"quiz":[{"q":"「身體像一部沒電的手機」比喻什麼？","o":["身體容易故障需要維修","睡了一夜之後需要補充能量","睡太久會變得反應遲鈍"],"a":1,"why":"充電對應吃早餐，是為了補充能量。"},{"q":"本文的主要主張是什麼？","o":["早餐一定要吃得很豐盛","沒有胃口時可以不必吃","早餐值得花一點時間好好吃"],"a":2,"why":"作者說早餐不必豐盛，但值得留位子。"}],"title2":"一天的第一口","hint":"寫你早晨吃的第一樣食物，描寫它的氣味、溫度和你當時的心情。別只寫「好吃」，試著寫出它是熱的還是涼的、聞起來像什麼。","starters":["鬧鐘響了以後，","今天的早餐是"]},{"title":"三分鐘的泡麵","theme":"食物與記憶","text":["在我們家，泡麵有一套神聖的規矩：水要滾，蓋子要壓，時間要三分鐘。誰要是兩分半就掀蓋，會被我哥用眼神處決。","可是這三分鐘，是人類最漫長的時間。我盯著蓋子，鼻子卻早就背叛了我，濃濃的醬油雞湯味從縫裡偷跑出來，在客廳繞了一圈。肚子立刻開了一場抗議大會，咕嚕咕嚕地發表演說。","終於掀蓋，麵條捲著白煙，鹹香直衝鼻腔。我吹了三口氣，吸一大口，燙得舌頭跳了一段舞。","結果哥哥冷冷地說：「你剛剛那口，兩分五十八秒。」"],"gj":[{"s":"這三分鐘，是人類最漫長的時間","t":"誇飾","n":"三分鐘當然不是最久，但這樣說把等待的難熬放大，惹人發笑。"},{"s":"濃濃的醬油雞湯味從縫裡偷跑出來","t":"嗅覺摹寫加擬人","n":"讓氣味像小偷一樣溜走，既寫出味道也帶幽默。"},{"s":"肚子立刻開了一場抗議大會","t":"擬人","n":"把肚子餓寫成開會抗議，生動又好笑。"}],"w":[{"w":"掀蓋","m":"把蓋子掀開"},{"w":"背叛","m":"違背、不再站在同一邊"},{"w":"漫長","m":"時間或距離很長"}],"quiz":[{"q":"「會被我哥用眼神處決」是什麼意思？","o":["哥哥會用嚴厲的眼神表示不滿","哥哥會沒收泡麵","哥哥會罵很久"],"a":0,"why":"處決是誇張說法，其實只是眼神很兇。"},{"q":"結尾哥哥說「兩分五十八秒」，暗示什麼？","o":["作者泡麵煮得太久","作者其實也沒等滿三分鐘就偷吃","哥哥的計時器壞掉了"],"a":1,"why":"哥哥抓到作者自己也提早吃，產生幽默的反差。"}],"title2":"我家的小規矩","hint":"寫一件你家在吃東西時的特別規矩或習慣，用幽默的語氣描述。可以讓一個人物說一句經典台詞，再寫你的反應。","starters":["在我家，吃飯有一條不成文的規定：","只要一聞到那個味道，"]},{"title":"第一次上台","theme":"勇氣與挑戰","text":["輪到我上台報告時，我的手心濕得像剛從水裡撈出來。走上講台的十步，我數了又數，膝蓋卻像不是自己的。","站定以後，我看見全班四十雙眼睛。怎麼辦？要逃嗎？還是假裝喉嚨痛？我心裡的小劇場吵成一團。可是老師已經微微點頭，示意我開始。","我吸了一口氣，念出第一句。聲音抖了一下，又穩住了。念到第三段，我竟然看見後排的同學笑著點頭。","多麼奇妙的七分鐘啊！下台的時候，我的腿還在軟，嘴角卻怎麼也壓不下來。"],"gj":[{"s":"我的手心濕得像剛從水裡撈出來","t":"譬喻","n":"用誇張的畫面表現緊張，讀者立刻感同身受。"},{"s":"怎麼辦？要逃嗎？還是假裝喉嚨痛？","t":"設問","n":"連續提問，把內心拉扯的混亂寫得很真實。"},{"s":"多麼奇妙的七分鐘啊！","t":"感嘆","n":"用感嘆句直接抒發緊張過後的驚喜。"}],"w":[{"w":"講台","m":"老師或報告者站立的台子"},{"w":"示意","m":"用動作或表情表達意思"},{"w":"小劇場","m":"指內心自己演出來的各種想像"}],"quiz":[{"q":"「手心濕得像剛從水裡撈出來」表現什麼？","o":["作者剛洗完手","天氣太悶熱","作者非常緊張而冒汗"],"a":2,"why":"後文寫膝蓋不聽使喚，都是緊張的表現。"},{"q":"下台時作者的心情最接近哪一種？","o":["緊張之後帶著一點成就感","後悔答應上台","對同學感到生氣"],"a":0,"why":"嘴角壓不下來，顯示開心與滿足。"}],"title2":"我的第一次","hint":"寫一次你鼓起勇氣做的事，並寫出你當時心裡的問題與感嘆。用兩三個問句寫出內心掙扎，結尾加一句感嘆句。","starters":["站在那裡的時候，我心裡不停問自己：","事後回想起來，真是"]},{"title":"跳水台上的風","theme":"勇氣與挑戰","text":["游泳池的跳水台不過兩層樓高，站在上面，卻像站在一座小山的山頂。池水藍得發亮，風從遠處的樹梢吹來，帶著一點氯水的味道。","腳下的水面輕輕晃動，把天空的碎片搖成一片金光。往下看，同學的臉小小的，像一排浮在水上的豆子。誰能保證我不會嗆到水？誰又能保證我一定做不到？","哨音響了。我閉上眼睛，往前一踏，風呼地一聲掠過耳邊，接著是撲通一聲，水花像一朵白色的大花在身後炸開。","浮出水面的那一刻，陽光好亮啊！"],"gj":[{"s":"站在上面，卻像站在一座小山的山頂","t":"譬喻","n":"把不算太高的跳水台寫成山頂，傳達心理上的高度。"},{"s":"誰能保證我不會嗆到水？誰又能保證我一定做不到？","t":"設問","n":"兩個問句一前一後，從害怕轉向不服輸。"},{"s":"陽光好亮啊！","t":"感嘆","n":"短短一句感嘆，寫出完成挑戰後的輕鬆與明亮。"}],"w":[{"w":"氯水","m":"泳池消毒用的水，有特殊氣味"},{"w":"掠過","m":"很快地擦過"},{"w":"炸開","m":"向四周迸裂散開"}],"quiz":[{"q":"「誰能保證我不會嗆到水？誰又能保證我一定做不到？」表達什麼？","o":["向同學求助","害怕與不服輸交錯的心情","對老師安排的不滿"],"a":1,"why":"前一句擔心，後一句反問自己，兩種念頭拉扯。"},{"q":"「掠過」在文中的意思是什麼？","o":["慢慢停留","重重撞上","很快地擦過"],"a":2,"why":"風呼地一聲，表示速度快，只是擦過耳邊。"}],"title2":"站在高處的時候","hint":"寫一次站在高處或舞台前、必須做決定的時刻，寫出你看到的景象與心情。先寫周遭景物，再用一兩個問句寫內心，最後用感嘆句收尾。","starters":["我低頭一看，","深吸一口氣之後，"]},{"title":"矮個子的籃球","theme":"勇氣與挑戰","text":["小凱是班上最矮的男生，站在籃球場上，連籃框的邊都夠不到。可是每次體育課分組，他總是第一個舉手說：「我來守最強的那個！」","他怎麼敢？我曾經這樣問他。他聳聳肩：「被蓋火鍋又不會痛，頂多丟臉一下下。」說完就衝進場內，像一隻不怕風的小麻雀，貼著對手的身邊轉來轉去。","有一次，他真的抄到球，運球衝過半場。球被打掉了，他一屁股坐在地上，卻抬頭大笑：「剛剛那一下，帥不帥？」全班笑成一團，連對手都伸手拉他起來。","夕陽斜斜照在球場上，他的影子明明很短，看起來卻長長的。"],"gj":[{"s":"他怎麼敢？我曾經這樣問他。","t":"設問","n":"先丟出疑問再交代是誰問的，製造好奇，也帶出人物性格。"},{"s":"像一隻不怕風的小麻雀","t":"譬喻","n":"小麻雀體型小卻靈活，貼切地寫出小凱的衝勁。"},{"s":"他的影子明明很短，看起來卻長長的","t":"映襯","n":"短與長形成對比，暗示他的氣勢比身高大。"}],"w":[{"w":"蓋火鍋","m":"籃球中把對手投籃封阻下來"},{"w":"運球","m":"在籃球中拍球前進"},{"w":"聳聳肩","m":"聳起肩膀，表示不在乎或無所謂"}],"quiz":[{"q":"小凱為什麼總是第一個舉手要守最強的人？","o":["他不怕失敗，喜歡挑戰","他是全班最高的人","他想讓老師特別注意他"],"a":0,"why":"他說被蓋火鍋頂多丟臉，顯示不怕輸。"},{"q":"「影子明明很短，看起來卻長長的」想表達什麼？","o":["夕陽很晚了","他給人的氣勢比外表高大","影子被地面拉長"],"a":1,"why":"用短與長的對比，暗指他的精神讓人印象深刻。"}],"title2":"我佩服的那個人","hint":"寫一位你身邊讓你佩服的人，說說他做過什麼讓你印象深刻的事。寫一個具體的場景，加入他說的一句話，並用一個問句表達你的好奇。","starters":["他明明","我忍不住問他：「"]},{"title":"緊張是怎麼回事","theme":"勇氣與挑戰","text":["上台前心跳加快、手心冒汗、喉嚨發乾，你是不是以為自己出了問題？其實，這是身體在幫你做準備。","當人覺得面臨挑戰時，身體會進入警戒狀態，心跳變快，呼吸變急，讓血液把力氣送到需要的地方。這套反應原本是為了讓人面對危險時能快速行動，所以並不是膽小的證明。","那麼，該怎麼讓自己平靜一點呢？最簡單的方法是慢慢呼吸：用鼻子慢慢吸氣，再用嘴巴緩緩吐氣，讓吐氣比吸氣更長。這樣身體就會收到「可以放鬆了」的訊號。","下次手心冒汗時，不妨對自己說：太好了，我的身體正在替我加油！"],"gj":[{"s":"那麼，該怎麼讓自己平靜一點呢？","t":"設問","n":"先提出問題，再在後文回答，讓說明的層次分明。"},{"s":"這樣身體就會收到「可以放鬆了」的訊號","t":"擬人","n":"把身體寫成能收到訊號的對象，讓抽象的放鬆變得具體。"},{"s":"太好了，我的身體正在替我加油！","t":"感嘆","n":"用感嘆句換個角度看待緊張，給讀者正面力量。"}],"w":[{"w":"警戒","m":"對可能的危險保持注意"},{"w":"證明","m":"能夠說明事情真實的依據"},{"w":"緩緩","m":"很慢地"}],"quiz":[{"q":"作者認為緊張是什麼？","o":["膽小的證明","需要立刻消除的疾病","身體為了面對挑戰而做的準備"],"a":2,"why":"第二段明確說這不是膽小的證明，而是警戒反應。"},{"q":"結尾說「我的身體正在替我加油」，用意是什麼？","o":["換個角度，把緊張看成正面的力量","要求身體停止反應","責怪自己太緊張"],"a":0,"why":"作者提醒讀者用正面的想法看待身體反應。"}],"title2":"當我緊張的時候","hint":"寫一次你很緊張的經驗，並寫出你用了什麼方法讓自己平靜下來。先寫身體的反應，再寫你怎麼做，最後用一句話鼓勵自己。","starters":["那天，我的心跳","為了讓自己冷靜，我"]},{"title":"夜裡的操場","theme":"勇氣與挑戰","text":["傍晚的操場，風還帶著白天的熱氣。我繞著跑道，一圈、兩圈、三圈，腳步聲在耳邊啪噠啪噠地響。","為什麼要報名這場長跑？我也問過自己。也許只是想知道，那個老是說「我不行」的自己，究竟能走多遠？","第五圈的時候，肺像被誰捏住，腿像灌了鉛。我很想停下來。可是抬頭看見天邊的雲被夕陽染成橘紅，忽然覺得，這片天空好大啊，大到可以裝下我所有的喘息。","我又跨出一步。啪噠，啪噠，路燈亮了。"],"gj":[{"s":"腳步聲在耳邊啪噠啪噠地響","t":"聽覺摹寫","n":"疊用擬聲詞，讓腳步的節奏感躍然紙上。"},{"s":"為什麼要報名這場長跑？","t":"設問","n":"作者自問，點出參加挑戰的原因，引出下一句的內心話。"},{"s":"這片天空好大啊，大到可以裝下我所有的喘息","t":"感嘆","n":"以感嘆加誇飾，寫出面對疲累時心胸被打開的感覺。"}],"w":[{"w":"跑道","m":"運動場上供跑步的路線"},{"w":"喘息","m":"急促地呼吸"},{"w":"染成","m":"被顏色渲染成某種樣子"}],"quiz":[{"q":"「腿像灌了鉛」形容什麼？","o":["腿受傷流血","腿十分沉重，很難抬起","腿被繩子綁住"],"a":1,"why":"鉛很重，用來比喻跑到疲累時腿的沉重感。"},{"q":"從文章看，作者報名長跑的原因最可能是什麼？","o":["想贏過全班同學","被老師強迫參加","想知道自己究竟能走多遠"],"a":2,"why":"第二段說想知道老說不行的自己能走多遠。"}],"title2":"一次不想放棄的時刻","hint":"寫一次你很累卻沒有放棄的經驗，包含你看到的景色和心裡的聲音。用一個問句開頭，再用一句感嘆結束，中間寫具體的動作或景物。","starters":["我為什麼要這麼做？","那一刻，天空"]},{"title":"勇氣不等於不怕","theme":"勇氣與挑戰","text":["提到勇敢的人，我們常想到毫不猶豫、一點都不害怕的樣子。可是，真的有人完全不怕嗎？","我覺得不是。就像第一次騎腳踏車上街，手會握得緊緊的，心也懸在半空。真正的勇氣，是怕歸怕，還是慢慢踩出第一圈。","如果一定要等到不怕了才開始，那麼大多數的事，我們永遠都來不及做。游泳、演講、交新朋友，哪一件不是從發抖開始的？","所以，害怕可以跟著我們一起上路，只要它不握住方向盤就好。"],"gj":[{"s":"可是，真的有人完全不怕嗎？","t":"設問","n":"開頭先質疑常見想法，引起讀者思考。"},{"s":"游泳、演講、交新朋友，哪一件不是從發抖開始的？","t":"激問","n":"用反問加上舉例，答案不言自明，說服力強。"},{"s":"害怕可以跟著我們一起上路，只要它不握住方向盤就好","t":"擬人","n":"把害怕寫成同行的乘客，既溫和又有畫面。"}],"w":[{"w":"毫不猶豫","m":"一點也不遲疑"},{"w":"懸在半空","m":"沒有著落、很不安穩"},{"w":"發抖","m":"身體因害怕或冷而顫動"}],"quiz":[{"q":"作者認為真正的勇氣是什麼？","o":["雖然害怕，仍願意開始","完全不感到害怕","避開所有危險"],"a":0,"why":"第二段說怕歸怕，還是慢慢踩出第一圈。"},{"q":"「它不握住方向盤」的意思最接近什麼？","o":["害怕要完全消失","害怕可以存在，但不能主導我們的決定","開車時必須很小心"],"a":1,"why":"方向盤象徵決定權，害怕可以同行，但不能掌控。"}],"title2":"我怕的那件事","hint":"寫一件你一直很害怕、但後來試了的事，並說說你的想法有沒有改變。先寫你怕什麼，再寫你怎麼跨出第一步，可以用一個反問句加強語氣。","starters":["說實話，我一直很怕","哪一個人不曾"]},{"title":"鬼屋裡的英雄","theme":"勇氣與挑戰","text":["校慶園遊會，七年級的鬼屋排了長長一條人龍。我拍拍胸脯說：「這有什麼好怕的？都是同學扮的啊！」","十秒後，我發現自己抓著阿哲的書包帶，走路像一隻被捕的螃蟹。黑布後面忽然伸出一隻白手，我叫得比警鈴還響，連扮鬼的同學都嚇了一跳，小聲說：「拜託，我才是鬼耶！」","走出鬼屋，陽光刺眼。大家笑到蹲在地上，我也只好跟著笑。誰說英雄一定不尖叫呢？至少我是勇敢地叫完了全程！","出口的志工遞給我一張紙，上面寫著：「勇敢小英雄證書」。我把它摺好，收進口袋，決定不告訴阿哲，他的書包帶被我扯歪了。"],"gj":[{"s":"走路像一隻被捕的螃蟹","t":"譬喻","n":"用螃蟹橫著走、被抓住的樣子，寫出害怕又狼狽的姿態。"},{"s":"我叫得比警鈴還響","t":"誇飾","n":"把尖叫聲誇大，笑點十足。"},{"s":"誰說英雄一定不尖叫呢？","t":"設問","n":"用反問替自己找台階下，語氣自嘲又幽默。"}],"w":[{"w":"人龍","m":"排得很長的隊伍"},{"w":"拍拍胸脯","m":"表示有把握、很自信"},{"w":"警鈴","m":"發出警告的鈴聲"}],"quiz":[{"q":"「拜託，我才是鬼耶！」好笑的地方在哪裡？","o":["扮鬼的同學忘了台詞","扮鬼的同學想繼續嚇他","扮鬼的人反而被客人嚇到"],"a":2,"why":"鬼被叫聲嚇到，角色顛倒，造成幽默。"},{"q":"「拍拍胸脯」在文中表示什麼？","o":["表現得很有把握","呼吸不順","胸口疼痛"],"a":0,"why":"作者一開始自信滿滿，後面才出現反差。"}],"title2":"我也有嚇一跳的時候","hint":"寫一次你被嚇到或出糗的經驗，用幽默的方式說出來。先寫一開始你多有自信，再寫結果有多慘，製造前後落差。","starters":["我一向以為自己","沒想到下一秒，"]},{"title":"五十九分","theme":"失敗與成長","text":["數學考卷發下來的時候，右上角的紅筆數字是五十九。只差一分，卻像差了一整座山。","同桌小雯考九十三分，笑得像剛領到獎品；我把考卷折了又折，塞進抽屜最深處，彷彿折小了，分數就會變大。","放學後，我留在教室訂正。以前算錯，我只會嘆氣，這次卻一題一題對著紅叉，找出錯在哪裡。原來有三題，不是不會，是我粗心把正負號抄反。","夕陽落在桌面，那些紅叉看起來不再刺眼，反而像路標，一個個指著我該走的方向。"],"gj":[{"s":"只差一分，卻像差了一整座山","t":"映襯","n":"一分與一座山，數量懸殊卻放在一起，寫出心裡的落差。"},{"s":"以前算錯，我只會嘆氣，這次卻一題一題對著紅叉","t":"對比","n":"以前與這次相對照，看見作者面對失敗的轉變。"},{"s":"反而像路標，一個個指著我該走的方向","t":"譬喻","n":"把紅叉比成路標，讓錯誤從打擊變成指引。"}],"w":[{"w":"訂正","m":"改正錯誤"},{"w":"粗心","m":"做事不仔細"},{"w":"刺眼","m":"光線太強令人不舒服，也指看了讓人難受"}],"quiz":[{"q":"作者訂正後發現了什麼？","o":["題目超出課本範圍","有幾題是因為粗心抄錯正負號","老師批改錯誤"],"a":1,"why":"第三段說有三題不是不會，是抄反。"},{"q":"「那些紅叉……像路標」是什麼意思？","o":["提醒他放棄這一科","讓他容易迷路","錯誤能指出下一步要努力的方向"],"a":2,"why":"路標指引方向，比喻錯誤其實幫助進步。"}],"title2":"一次不太順利的考試","hint":"寫一次你考不好或做不好的經驗，說說你前後心情有什麼不同。用「一開始……後來……」的對比，並寫一個具體的畫面收尾。","starters":["拿到成績單的那一刻，","一開始，我只想"]},{"title":"颱風過後","theme":"失敗與成長","text":["颱風過後的早晨，校園像打了一場敗仗。操場積著黃濁的水，榕樹的斷枝橫在走道上，布告欄的海報碎成一片片，貼在牆角。","昨天還整齊的花圃，今天只剩歪倒的花莖。可是我蹲下來細看，泥土裡有一株被壓彎的小白花，竟又悄悄挺起了腰。","清潔隊和同學拿著掃把，一邊笑一邊把落葉掃成一堆。天空洗得特別乾淨，藍得像剛換過的新玻璃。濕濕的泥土味，混著草葉被折斷後的青澀香氣，飄在微涼的風裡。","校工伯伯站在梯子上，把一面歪掉的旗子輕輕扶正。"],"gj":[{"s":"昨天還整齊的花圃，今天只剩歪倒的花莖","t":"對比","n":"昨天與今天的落差，讓破壞的程度一眼就看見。"},{"s":"泥土裡有一株被壓彎的小白花，竟又悄悄挺起了腰","t":"擬人","n":"用「挺起了腰」寫花的復原，帶有堅強的意味。"},{"s":"藍得像剛換過的新玻璃","t":"譬喻","n":"以新玻璃形容雨後的天空，乾淨明亮。"}],"w":[{"w":"黃濁","m":"混濁而偏黃"},{"w":"青澀","m":"帶著未成熟植物的味道"},{"w":"扶正","m":"把歪斜的東西弄直"}],"quiz":[{"q":"作者描寫那株小白花，要表現什麼？","o":["受挫之後仍然慢慢站起來","花被連根拔起","花是新種的"],"a":0,"why":"被壓彎後又挺起腰，象徵恢復的力量。"},{"q":"「校園像打了一場敗仗」是什麼意思？","o":["學校剛辦完比賽","校園被破壞得凌亂不堪","大家的情緒很激動"],"a":1,"why":"以敗仗比喻颱風後的殘破景象。"}],"title2":"風雨之後","hint":"寫一次大雨、颱風或考試結束後的景象，並寫出前後的差別。先寫一個狼狽的畫面，再寫一個雨後新生的畫面，兩個畫面互相對照。","starters":["雨停了，","昨天還"]},{"title":"跳高學姊","theme":"失敗與成長","text":["學姊是田徑隊的跳高選手，個子不高，助跑時卻像一支被拉緊的弓。她第一次參加縣賽，三次試跳都碰掉了橫桿，名次是倒數第二。","我以為她會哭，她卻拍拍褲子上的沙，對教練說：「我知道問題在腳步，下週練這個。」那語氣，輕得像在決定晚餐吃什麼。","一年後，同一個運動場，同樣的橫桿。去年她仰頭望著，今年她俯身越過，背脊在空中劃出一道安靜的弧線。落墊的時候，她先望向看台，朝教練比了個大拇指，沙粒還沾在髮尾。"],"gj":[{"s":"助跑時卻像一支被拉緊的弓","t":"譬喻","n":"弓拉滿便蓄滿力量，比喻她起跑前的專注與爆發力。"},{"s":"去年她仰頭望著，今年她俯身越過","t":"對比","n":"仰頭與俯身，一年的差別寫在姿勢裡，不用多說也看出進步。"},{"s":"背脊在空中劃出一道安靜的弧線","t":"轉化","n":"把動作寫成「安靜的弧線」，既有畫面也有聲音的對照。"}],"w":[{"w":"助跑","m":"起跳前先跑一段距離"},{"w":"橫桿","m":"跳高時架在兩端的桿子"},{"w":"試跳","m":"嘗試跳躍"}],"quiz":[{"q":"學姊說「下週練這個」，顯示她怎麼面對失敗？","o":["她不在乎名次","她對教練生氣","冷靜找出原因並想辦法改進"],"a":2,"why":"她立刻指出問題在腳步，並決定練習。"},{"q":"「去年她仰頭望著，今年她俯身越過」說明什麼？","o":["她從望著橫桿到能越過它，有了進步","她的姿勢錯了","她變得害怕橫桿"],"a":0,"why":"仰望與俯身的對照，表示能力提升。"}],"title2":"後來的我","hint":"寫一件你過去做不好、後來進步的事，用去年與今年、以前與現在來對照。找兩個動作或畫面，用相反的樣子對照出你的改變。","starters":["以前的我，","現在回頭看，"]},{"title":"跌倒的用處","theme":"失敗與成長","text":["學騎腳踏車的人，很少有人一上車就能直直前進。龍頭歪一下、身體晃一下，甚至摔進草叢，似乎是必經的過程。","這是因為騎車需要同時顧到平衡、方向和踩踏，這些動作一開始都得靠刻意去想。每一次搖晃，都是身體收到的一次回饋：剛才偏左了，下次往右修一點。","隨著次數增加，這些判斷會愈來愈快，慢慢不必再用力思考，變成自然的動作。這時的你，看起來輕鬆平穩；可是一開始的你，則是滿頭大汗、緊握煞車。","所以看到騎得穩的人，別忘了，他的車輪底下，曾經壓過許多次搖晃。"],"gj":[{"s":"龍頭歪一下、身體晃一下，甚至摔進草叢","t":"舉例說明","n":"用具體的狀況說明學車時常見的失誤，讀者容易想像。"},{"s":"這時的你，看起來輕鬆平穩；可是一開始的你，則是滿頭大汗、緊握煞車","t":"對比","n":"現在與當初相對照，凸顯練習帶來的差別。"},{"s":"他的車輪底下，曾經壓過許多次搖晃","t":"轉化","n":"把看不見的搖晃寫成壓在輪下的東西，結尾很有畫面。"}],"w":[{"w":"龍頭","m":"腳踏車的把手部位"},{"w":"回饋","m":"得到的反應或訊息"},{"w":"煞車","m":"使車輛減速或停止的裝置"}],"quiz":[{"q":"文章認為騎車時的搖晃有什麼作用？","o":["證明一個人沒有天分","提供回饋，讓身體慢慢調整","讓人決定放棄"],"a":1,"why":"第二段說每一次搖晃是回饋，下次可以修正。"},{"q":"「他的車輪底下，曾經壓過許多次搖晃」暗示什麼？","o":["他的車子很重","路面很不平坦","穩定的背後有許多次練習"],"a":2,"why":"搖晃指過去的失誤，說明熟練來自反覆嘗試。"}],"title2":"我學會的一件事","hint":"寫一件你一開始做不好、後來學會的事，描寫你笨拙的樣子與後來的不同。先用具體的動作寫出笨拙，再寫熟練後的樣子，兩段互相對照。","starters":["剛開始學的時候，我","現在，我已經能"]},{"title":"合唱比賽之後","theme":"失敗與成長","text":["成績公布的那一刻，禮堂忽然安靜得像一口深井。我們班是第四名，離獎盃隔了好幾個名次的距離。","練習時我們吵過架，為了誰的聲音太大、誰的音準太飄；可是現在，沒有人再開口，只有鞋底磨過地板的細碎聲響。","走出禮堂，傍晚的風帶著桂花的甜味。指揮的同學忽然大聲說：「剛剛那首，我覺得最好聽！」大家愣了一下，然後有人噗哧笑出來，笑聲一個接一個，像把剛才的沉默敲開了一道縫。","我們沒有獎盃，卻有一整排歪歪斜斜的影子，肩膀碰著肩膀，慢慢走過夕陽。"],"gj":[{"s":"禮堂忽然安靜得像一口深井","t":"譬喻","n":"深井又靜又沉，把失落的氣氛寫得具體。"},{"s":"練習時我們吵過架，為了誰的聲音太大、誰的音準太飄；可是現在，沒有人再開口","t":"對比","n":"從吵鬧到沉默，反映大家在乎這次比賽的程度。"},{"s":"傍晚的風帶著桂花的甜味","t":"嗅覺摹寫","n":"一點甜味為沉重的場面帶來了鬆動的溫柔。"}],"w":[{"w":"音準","m":"唱歌時音高是否準確"},{"w":"愣了一下","m":"一時反應不過來"},{"w":"細碎","m":"細小而零碎"}],"quiz":[{"q":"「安靜得像一口深井」形容什麼氣氛？","o":["失落而沉重的氣氛","禮堂空間很深","大家在找水"],"a":0,"why":"宣布名次後，大家都沒說話，像深井一樣沉。"},{"q":"結尾「我們沒有獎盃，卻有……影子」想表達什麼？","o":["隊伍走得很混亂","雖然沒得獎，同伴們仍在一起","大家各自離開"],"a":1,"why":"沒有獎盃與有影子相對，肩膀碰著肩膀，顯示彼此陪伴。"}],"title2":"沒有拿到第一名","hint":"寫一次你努力了卻沒有得到理想結果的經驗，寫出事前與事後的氣氛差別。用一個安靜的場景和一個熱鬧的場景對照，最後留一個動作的畫面。","starters":["結果公布的時候，","走出教室後，"]},{"title":"難看的草稿","theme":"失敗與成長","text":["同學看到我作文簿上塗塗改改的草稿，忍不住說：「怎麼這麼亂？」我笑了笑，沒有解釋。","其實，我一直覺得草稿的任務，就是難看。第一次寫出來的句子常常拖泥帶水，段落也東倒西歪；但正因為它有地方可以改，作品才有機會變好。相反的，一份乾乾淨淨卻從不修改的文章，也許看起來整齊，卻永遠停在原地。","一份好作品的背後，往往站著一疊皺巴巴的草稿紙。我們欣賞成品的光亮，卻很少看見背後那些被擦掉、被劃掉、被重寫的痕跡。","所以，我把那張亂亂的草稿夾進課本，讓它陪我一起上課。"],"gj":[{"s":"一份乾乾淨淨卻從不修改的文章，也許看起來整齊，卻永遠停在原地","t":"對比","n":"整齊與停滯放在一起，推翻了乾淨就是好的想法。"},{"s":"一份好作品的背後，往往站著一疊皺巴巴的草稿紙","t":"擬人","n":"「站著」讓草稿紙像默默支持的人，帶著敬意。"},{"s":"被擦掉、被劃掉、被重寫","t":"排比","n":"三個相同句式連用，節奏明快，寫出修改的不容易。"}],"w":[{"w":"拖泥帶水","m":"比喻說話寫作不簡潔"},{"w":"皺巴巴","m":"布或紙上有許多皺摺的樣子"},{"w":"痕跡","m":"留下來的印記"}],"quiz":[{"q":"作者對草稿的看法是什麼？","o":["草稿越整齊越好","草稿不應該被別人看到","草稿的任務就是讓人修改"],"a":2,"why":"作者說草稿的任務就是難看，因為有改進的空間。"},{"q":"「拖泥帶水」在文中指句子怎麼樣？","o":["不夠簡潔流暢","寫得太漂亮","字跡被水弄溼"],"a":0,"why":"拖泥帶水原指行動不乾脆，這裡形容句子冗雜。"}],"title2":"我最難看的一份草稿","hint":"寫一份你曾經改了又改的作品或作業，說說它從亂到好的過程。寫出最亂的樣子和修改後的樣子，用一句話說你看著它的感覺。","starters":["翻開那份草稿，","我記得第一版"]},{"title":"烤焦的餅乾","theme":"失敗與成長","text":["週末，我決定做餅乾。食譜上寫著烤十二分鐘，我心想，十二分鐘太保守，二十分鐘一定更香脆。","二十分鐘後，我打開烤箱，一陣黑煙衝出來，像烤箱在跟我打招呼。托盤上的餅乾，本來該是金黃色的小圓月，現在變成了十二顆黑色的小石頭。我敲了敲，聲音鏗鏘，比我家的碗還清脆。","弟弟咬了一口，眼睛瞪得好大，說：「這可以拿去打釘子耶。」我們笑到趴在桌上。","第二批，我乖乖設了十二分鐘。出爐時，奶油香飄滿整個廚房，餅乾金黃酥軟。弟弟吃了三塊，才小聲說：「這次不能打釘子了。」"],"gj":[{"s":"一陣黑煙衝出來，像烤箱在跟我打招呼","t":"擬人","n":"把烤箱寫成會打招呼的對象，把失敗寫得好笑。"},{"s":"本來該是金黃色的小圓月，現在變成了十二顆黑色的小石頭","t":"對比","n":"金黃的月亮對上黑色的石頭，前後落差製造笑點。"},{"s":"奶油香飄滿整個廚房，餅乾金黃酥軟","t":"嗅覺與視覺摹寫","n":"和前面的焦黑相對照，成功的香氣與顏色一起寫出來。"}],"w":[{"w":"保守","m":"不冒險，這裡指時間抓得太短"},{"w":"鏗鏘","m":"形容金屬或硬物敲擊的聲音"},{"w":"酥軟","m":"鬆脆又柔軟"}],"quiz":[{"q":"第二批餅乾成功的關鍵是什麼？","o":["增加烤箱溫度","照著食譜設定時間","多放了奶油"],"a":1,"why":"文中說第二批乖乖設了十二分鐘。"},{"q":"「十二顆黑色的小石頭」形容餅乾怎麼樣？","o":["數量很少","裡面加了石頭","又黑又硬"],"a":2,"why":"石頭又硬又黑，是用來形容烤過頭的餅乾。"}],"title2":"一次失敗的嘗試","hint":"寫一次你做菜、做手工或做實驗失敗的經驗，用輕鬆的語氣寫出前後的差別。寫出你原本的信心、失敗的畫面，再寫第二次的結果。","starters":["我本來以為","打開蓋子的那一刻，"]},{"title":"家裡的感應器","theme":"科技與生活","text":["現代的家裡，有許多東西會「看見」你。走近大樓入口，自動門無聲滑開；夜裡走進樓梯間，感應燈啪地亮起；在洗手台前伸出雙手，水龍頭自己流出水來。","這些裝置都靠感應器工作，但「感」的方式不一樣。感應燈常常偵測人體散發的熱，像一雙怕冷的眼睛；水龍頭則是先送出光線，手一擋，光就彈回來，水便流了出來。","另一類是測量，例如耳溫槍，只要對準耳朵，不必碰觸就能得到體溫；冷氣機也靠溫度感應，自己決定要不要繼續吹風。","下次走進教室，不妨抬頭找找看，天花板上說不定正有一顆小小的眼睛，安靜地看著你。"],"gj":[{"s":"有許多東西會「看見」你","t":"轉化","n":"把機器說成會看見人，讓讀者一開始就對生活中的裝置感到好奇。"},{"s":"像一雙怕冷的眼睛","t":"比喻","n":"用眼睛比喻偵測熱的感應燈，又加上「怕冷」，把原理說得具體又有趣。"},{"s":"手一擋，光就彈回來，水便流了出來","t":"因果說明","n":"用短句交代動作與結果的先後，說明文也能讀起來有節奏。"}],"w":[{"w":"偵測","m":"察覺並測量出來"},{"w":"散發","m":"向四周發出"},{"w":"安靜","m":"沒有聲音、不吵鬧"}],"quiz":[{"q":"水龍頭為什麼能自己出水？","o":["它先送出光線，手一擋光就彈回來","它偵測手掌散發出來的熱","它聽見使用者拍手的聲音"],"a":0,"why":"文中說水龍頭是先送出光線，手擋住後光被彈回來，水才流出。感應燈才是偵測人體的熱。"},{"q":"本文主要用什麼方式介紹感應器？","o":["比較新舊感應器的價格","舉出生活中的例子，並大致分成感應與測量兩類","依照發明的年代依序介紹"],"a":1,"why":"文章從自動門、感應燈、水龍頭舉例，再談耳溫槍等測量類，是舉例加分類。"}],"title2":"我家（或學校）裡的聰明小東西","hint":"選一樣你每天都會遇到的裝置，先寫它做了什麼，再寫你第一次發現它的情形。","starters":["走進校門口，我總是先遇到……","我最常遇到的聰明小東西是……"]},{"title":"阿公的路","theme":"科技與生活","text":["週日，阿公騎機車載我去虎尾買糖廠冰。我把手機導航打開，螢幕上的藍線一直要我在前面的路口右轉。","「不用看啦，」阿公頭也不回，「這條路我走了四十年。」他在加油站旁左轉，鑽進一條田邊小路，兩旁的稻浪沙沙地向後退。導航慌張地重新計算，一連說了三次「請迴轉」，聲音聽起來有點委屈。","我偷偷比較：導航知道每條路的名字和車流，卻不知道哪棵樹下有涼影；阿公的腦袋裡沒有地圖，只有記憶，哪裡有土地公廟、哪間柑仔店還開著、哪段路下雨會積水，他都記得。","結果我們比導航預估的時間還早到五分鐘。阿公把車停好，回頭對我眨眨眼，我低頭一看，手機還在小聲地說：「已偏離路線。」"],"gj":[{"s":"兩旁的稻浪沙沙地向後退","t":"摹寫","n":"「沙沙」寫出聲音，「向後退」寫出車子前進的速度感，畫面一下子動了起來。"},{"s":"導航慌張地重新計算","t":"擬人","n":"把機器的運算寫成人的慌張，讓冷冰冰的導航變得有點好笑。"},{"s":"阿公的腦袋裡沒有地圖，只有記憶","t":"映襯","n":"拿「沒有地圖」和「只有記憶」對照，凸顯阿公靠經驗認路的本事。"}],"w":[{"w":"鑽進","m":"很快地進入狹窄的地方"},{"w":"委屈","m":"受到不公平的對待而難過"},{"w":"柑仔店","m":"台語，指賣雜貨的小商店"}],"quiz":[{"q":"阿公為什麼不看導航也敢走？","o":["他擔心手機沒有訊號","他想考驗孫子認不認得路","他走過這條路很多年，熟悉路況"],"a":2,"why":"阿公說「這條路我走了四十年」，可見是憑長年的記憶。"},{"q":"結尾手機說「已偏離路線」，最能暗示什麼？","o":["路線雖然不合導航，人的經驗仍能順利到達","阿公其實走錯路了","手機壞掉需要維修"],"a":0,"why":"他們比導航預估的還早到，表示偏離路線不等於走錯路，經驗同樣有價值。"}],"title2":"一次跟著家人走的路","hint":"寫出路上看見的三樣東西，再加上一句家人當時說的話。","starters":["那天，爸爸把車轉進一條小巷……","地圖上沒有標出來的那個地方是……"]},{"title":"夜市與條碼","theme":"科技與生活","text":["傍晚六點，夜市像一鍋慢慢煮滾的湯。炭火烤玉米的香氣先冒出來，接著是鐵板上滋滋的聲響，再來是老闆拉長尾音的叫賣聲。","每個攤位前都掛著一塊小小的方牌，上面印著黑白相間的方格。那是行動支付的條碼，貼在鹽酥雞的價目表旁，也貼在手搖飲的杯架邊，像一張張小小的通行證。","穿制服的學生排成一列，手機的螢幕亮成一小片星河。「嗶」一聲輕響，老闆低頭看看手上的小機器，笑著把熱騰騰的雞排遞過來。有人還是從口袋摸出銅板，叮叮噹噹地放進老闆娘的鐵盒；兩種聲音在夜色裡交錯，誰也沒有搶過誰。","科技走進夜市，沒有把煙火氣趕走。油煙繼續往上飄，鑽進黃色的燈泡光裡，慢慢散開。"],"gj":[{"s":"夜市像一鍋慢慢煮滾的湯","t":"比喻","n":"把逐漸熱鬧起來的夜市比成一鍋湯，讓人聞得到、感覺得到溫度。"},{"s":"炭火烤玉米的香氣先冒出來，接著是鐵板上滋滋的聲響，再來是老闆拉長尾音的叫賣聲","t":"摹寫","n":"依序寫嗅覺與聽覺，像鏡頭一樣帶讀者走進夜市。"},{"s":"科技走進夜市，沒有把煙火氣趕走","t":"擬人","n":"把科技寫成會走路的人，一句話點出新舊並存的主題。"}],"w":[{"w":"叫賣","m":"大聲招呼客人購買"},{"w":"通行證","m":"證明可以通過或進入的憑證"},{"w":"煙火氣","m":"市井生活的熱鬧氣息"}],"quiz":[{"q":"文中怎樣描寫行動支付與現金的關係？","o":["現金已經被行動支付淘汰","兩種付款方式同時存在，互不衝突","老闆只願意收行動支付"],"a":1,"why":"文中有人掃條碼、有人投銅板，「誰也沒有搶過誰」，表示並存。"},{"q":"結尾的「煙火氣」最接近下列哪一個意思？","o":["燃放煙火後留下的煙味","攤販使用炭火時的高溫","市井生活的熱鬧與人情味"],"a":2,"why":"「煙火氣」常用來形容人間的生活氣息，這裡指夜市依然熱鬧。"}],"title2":"夜市裡的一個晚上","hint":"挑一個你最難忘的攤位，寫出你聞到、聽到、看到的各一樣東西。","starters":["週末晚上，我和家人走進夜市……","我排了很久的隊，才輪到……"]},{"title":"阿嬤學視訊","theme":"科技與生活","text":["阿嬤七十三歲，戴著老花眼鏡，習慣把手機舉得離臉一尺遠，彷彿那是一盤燙嘴的湯。她最近有了新任務：學視訊。","第一次通話，螢幕裡只有她的鼻孔和天花板的日光燈。「阿嬤，往後一點！」我在電話這頭喊。她果然往後一退，整個人都不見了，只剩螢幕裡的一盆蘭花。","她不肯放棄，在客廳牆上貼了一張紙條，用粗粗的奇異筆寫：「綠色按鈕＝接，紅色按鈕＝掛。」每次看到我的臉跳出來，她就笑得瞇起眼睛，大聲報告今天種了什麼菜、隔壁的小黃又偷吃了什麼。","上週，螢幕終於穩穩地對著她的臉。她清了清喉嚨，對我說：「來，看阿嬤的絲瓜。」鏡頭一轉，一條胖胖的絲瓜，正掛在棚架上晃。"],"gj":[{"s":"彷彿那是一盤燙嘴的湯","t":"比喻","n":"用「燙嘴的湯」形容阿嬤小心翼翼拿手機的樣子，既好笑又準確。"},{"s":"螢幕裡只有她的鼻孔和天花板的日光燈","t":"細節描寫","n":"不寫「拍得很糟」，只列出畫面裡的東西，讀者自己就笑了。"},{"s":"每次看到我的臉跳出來，她就笑得瞇起眼睛","t":"動作描寫","n":"用一個小小的表情，就寫出阿嬤見到孫子的歡喜。"}],"w":[{"w":"老花眼鏡","m":"年長者看近處用的眼鏡"},{"w":"不肯放棄","m":"不願意停止努力"},{"w":"棚架","m":"供藤蔓植物攀爬的架子"}],"quiz":[{"q":"阿嬤在牆上貼紙條，主要是為了什麼？","o":["提醒自己按鈕的功能","提醒家人準時打電話","記錄今天種了哪些菜"],"a":0,"why":"紙條寫著綠色按鈕接、紅色按鈕掛，是阿嬤替自己寫的操作提示。"},{"q":"這篇文章最能表現阿嬤的哪一種特質？","o":["討厭科技、只好勉強配合","願意學習新事物，也樂於分享生活","喜歡向別人炫耀自己的菜園"],"a":1,"why":"她不肯放棄學視訊，最後主動展示絲瓜，可見肯學又愛分享。"}],"title2":"家人學新東西的那一天","hint":"寫一位家人學習新東西的過程，其中要有一個讓你想笑或感動的小動作。","starters":["爺爺拿著新手機，皺起眉頭……","我教媽媽用軟體的那個晚上……"]},{"title":"停電的夜晚","theme":"科技與生活","text":["颱風天的晚上，窗外的風像一群急著回家的人，把樹吵得嘩嘩響。突然「啪」的一聲，冰箱的嗡嗡聲停了，電視黑了，連走廊的小夜燈也熄了。","家裡一下子安靜得不像自己家。媽媽在抽屜裡摸出蠟燭，火光一亮，每個人的影子就歪歪地爬上牆壁。弟弟用手比出一隻兔子，兔子耳朵動了動，牆上便多了一個會跳的小傢伙。","手機只剩百分之三十的電，大家有默契地不去碰它。我們剩下的只有彼此的聲音：爸爸講起小時候在三合院捉螢火蟲，阿嬤補充說，那時的夜晚比現在黑得多，也亮得多。","我並不討厭電，只是那個晚上才發現，原來燭光不夠亮的地方，人會靠得更近。窗外風雨未停，我們圍著那團小小的火，誰也沒有說要睡。"],"gj":[{"s":"窗外的風像一群急著回家的人","t":"比喻","n":"把風聲比成一群人的腳步與喧鬧，既有聲音又有情緒。"},{"s":"每個人的影子就歪歪地爬上牆壁","t":"擬人","n":"「爬」字讓影子有了生命，畫面在燭光裡搖搖晃晃。"},{"s":"原來燭光不夠亮的地方，人會靠得更近","t":"寓理於景","n":"沒有直接說教，而是從燭光的場景中帶出對家人相處的體會。"}],"w":[{"w":"默契","m":"不用說出口就彼此明白的了解"},{"w":"三合院","m":"台灣傳統的磚瓦合院住宅"},{"w":"螢火蟲","m":"夜裡會發光的小昆蟲"}],"quiz":[{"q":"為什麼「大家有默契地不去碰」手機？","o":["手機被颱風吹壞了","爸爸規定停電時不能用手機","手機電量不多，也想把心思留給彼此"],"a":2,"why":"文中提到電量只剩一點，又說「我們剩下的只有彼此的聲音」，可知是想專心相處。"},{"q":"全文流露的主要情感是什麼？","o":["停電之中，感受到家人相聚的溫暖","對颱風造成不便的抱怨","對科技產品過度依賴的後悔"],"a":0,"why":"作者從蠟燭、影子與聊天寫出家人靠近的暖意，並非抱怨。"}],"title2":"一次停電（或安靜）的經驗","hint":"寫出當時你和誰在一起、做了什麼，最後用一個畫面結尾。","starters":["那天晚上，整條街突然暗了下來……","沒有網路的下午，我們……"]},{"title":"查證三步","theme":"科技與生活","text":["手機一滑，訊息像下雨一樣落下來：某種食物會致癌、明天全台停班停課、某位明星出了意外。看到這些，手指常常比腦袋先動，轉傳出去。","其實查證不難，大致可以分成三步。第一步看來源：是誰發的？有沒有署名、有沒有可以聯絡的單位？第二步看日期：舊新聞換個標題，就能再紅一次。第三步看旁證：同一件事，其他可靠的地方有沒有報導？如果只有一個群組在傳，就要多留一個心眼。","有人說，這樣太麻煩了。可是想想，一則假訊息被傳給二十個人，就可能有二十個人信以為真，其中還有人會再轉給別人。我們按下「轉傳」的那一秒，其實也在當一個小小的傳播站。","所以我把這三步寫在筆記本的最後一頁，每次手指想動的時候，先在心裡數三下。"],"gj":[{"s":"訊息像下雨一樣落下來","t":"比喻","n":"用下雨形容訊息又多又密，讓人感受到資訊的壓力。"},{"s":"手指常常比腦袋先動","t":"映襯","n":"把手指和腦袋拿來比較，幽默地點出「沒想就轉傳」的毛病。"},{"s":"第一步看來源：是誰發的？有沒有署名、有沒有可以聯絡的單位？","t":"設問","n":"用問句帶出檢查的方向，讀者可以直接拿去用。"}],"w":[{"w":"查證","m":"查核證實"},{"w":"旁證","m":"從旁提供的佐證"},{"w":"多留一個心眼","m":"多一分小心與警覺"}],"quiz":[{"q":"為什麼要「看日期」？","o":["日期愈新的消息愈可靠","舊新聞可能換個標題再被流傳","日期可以證明發文者的身分"],"a":1,"why":"文中說舊新聞換個標題就能再紅一次，所以要看日期。"},{"q":"第三段「有人說，這樣太麻煩了」的作用是什麼？","o":["表示作者自己也覺得麻煩","轉換到與查證無關的話題","先提出反對意見再回應，讓論點更周全"],"a":2,"why":"論說文常先設想反方說法，再加以回答，使論述更完整。"}],"title2":"我差點相信的一則訊息","hint":"寫下你曾經看到的一則讓你半信半疑的消息，以及你後來怎麼確認的。","starters":["群組裡突然跳出一則消息……","我正要按下轉傳，卻想起……"]},{"title":"班群貼圖圖鑑","theme":"科技與生活","text":["我們班的群組一天可以跳出一長串訊息，其中一半不是字，是貼圖。經過我長期觀察，班級貼圖大致可以分成三種。","第一種是「裝死型」：一隻動物直挺挺躺在地上，在老師宣布隔天小考時出現，全班會按成一整排。第二種是「感恩型」：一隻貓雙手合十，通常出現在有人借出筆記之後。第三種最危險，是「已讀不回型」：一個面無表情的人，只在你問功課的時候默默出現。","我自己最常用的是裝死型，因為它什麼都能代表：沒寫完、不想寫、想不到怎麼寫。有一次我同時送出裝死和感恩，隔壁座位的同學回過頭來問：「你到底是要死還是要謝？」","我想了想，回了一張貼圖：一隻貓，雙手合十，躺在地上。"],"gj":[{"s":"班級貼圖大致可以分成三種","t":"分類說明","n":"開頭先交代分三類，後面逐一舉例，條理清楚。"},{"s":"你到底是要死還是要謝？","t":"對話描寫","n":"一句話就把兩張矛盾的貼圖放在一起，產生幽默效果。"},{"s":"一隻貓，雙手合十，躺在地上","t":"幽默收束","n":"把前面兩種貼圖合成一個畫面，不加解釋就結束，笑點更俐落。"}],"w":[{"w":"直挺挺","m":"身體僵直不彎的樣子"},{"w":"合十","m":"兩手掌心相合"},{"w":"默默","m":"不出聲、悄悄地"}],"quiz":[{"q":"「感恩型」貼圖通常在什麼時候出現？","o":["有人借出筆記之後","老師宣布隔天小考時","有人詢問功課的時候"],"a":0,"why":"文中寫「感恩型」通常出現在有人借出筆記之後。"},{"q":"結尾回傳「貓合十又躺在地上」的貼圖，有什麼效果？","o":["表示作者生氣不想再回話","把兩種貼圖合在一起，製造幽默","說明作者的貼圖已經用完"],"a":1,"why":"作者同時表達裝死與感謝，既回答了同學，又讓人發笑。"}],"title2":"我們班的流行語（或貼圖）","hint":"介紹一句班上流行的話或一種貼圖，分成兩到三類，並各舉一個例子。","starters":["我們班有個奇怪的默契……","如果要幫班上的笑話分類，我會分成……"]},{"title":"公車上的十頁","theme":"閱讀與書","text":["我放學要搭四十分鐘的公車回家。以前，這段路是用來滑手機、看窗外發呆的。","國文老師說過，《荀子》裡有一句話：「不積跬步，無以至千里。」跬步就是半步，意思是不一步一步走，就到不了遠方。我聽了沒什麼感覺，直到有一天，我在書包底層摸到一本借了三個星期沒翻的小說。","於是我給自己訂了一條規則：公車上，只讀十頁。每次搖搖晃晃，字跟著車身一起晃，看久了有點暈，我就抬頭看看窗外的檳榔攤和路邊的廟，再低頭繼續。","一個月後，我翻到最後一頁，闔上書，發現公車剛好到站。我背起書包走下車，腳步輕輕的，彷彿剛剛也走了一段很長的路。"],"gj":[{"s":"《荀子》裡有一句話：「不積跬步，無以至千里。」","t":"引用","n":"引用經典名句，替「每天讀一點」的做法找到有分量的依據。"},{"s":"字跟著車身一起晃","t":"轉化","n":"讓文字像乘客一樣隨車搖晃，把閱讀的處境寫得很生動。"},{"s":"腳步輕輕的，彷彿剛剛也走了一段很長的路","t":"比喻","n":"把讀完一本書比成走完一段路，呼應前面引用的句子。"}],"w":[{"w":"跬步","m":"古代指半步"},{"w":"搖搖晃晃","m":"不穩定地擺動"},{"w":"闔上","m":"把書等合起來"}],"quiz":[{"q":"文中的「跬步」是什麼意思？","o":["一大步","一百步","半步"],"a":2,"why":"作者在文中直接解釋：跬步就是半步。"},{"q":"作者引用荀子的話，在文中有什麼作用？","o":["引出自己每天讀十頁的做法","說明公車行駛的路線","批評同學借書不還"],"a":0,"why":"引用之後，作者便開始訂下「公車上只讀
